services:
  - type: web
    name: nordicsignal-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    numInstances: 1
    disk:
      name: nordicsignal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NORDICSIGNAL_DB_PATH
        value: /var/data/nordicsignal.db
