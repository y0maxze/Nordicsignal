services:
  - type: web
    name: nordicsignal-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn production:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: false
