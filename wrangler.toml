name = "nordicsignal"
main = "scheduler_worker.js"
compatibility_date = "2026-08-22"
workers_dev = true

[triggers]
crons = ["*/10 * * * *", "17 * * * *"]

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "404-page"

