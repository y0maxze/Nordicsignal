name: Reversal Backtest

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/trend_reversal_runtime.py'
      - 'backend/backtest_reversal_v2.py'
      - '.github/workflows/reversal-backtest.yml'
  workflow_dispatch:

jobs:
  live-historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run walk-forward reversal backtest
        run: python backtest_reversal_v2.py
      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reversal-backtest-report
          path: backend/reversal_backtest.json
          if-no-files-found: warn
