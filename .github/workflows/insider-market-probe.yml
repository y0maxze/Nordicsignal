name: Insider Market Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/insider-market-probe.yml'
      - 'backend/insider_market_probe.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Probe production and source parser
        continue-on-error: true
        run: python backend/insider_market_probe.py > /tmp/insider-probe.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insider-market-probe
          path: /tmp/insider-probe.txt
          retention-days: 1
