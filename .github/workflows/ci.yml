name: NordicSignal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==8.4.2
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run complete test suite
        run: python -m pytest -q

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          out = Path('/tmp/nordicsignal-js'); out.mkdir(parents=True, exist_ok=True)
          count = 0
          for html in sorted(Path('frontend').glob('*.html')):
              text = html.read_text(encoding='utf-8')
              if '<html' not in text.lower() or '</html>' not in text.lower(): raise SystemExit(f'Malformed HTML shell: {html}')
              for index, script in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.I | re.S)):
                  if not script.strip(): continue
                  target=out/f'{html.stem}-{index}.js';target.write_text(script,encoding='utf-8');count+=1
          if count == 0: raise SystemExit('No inline frontend JavaScript found')
          PY
      - name: Check frontend JavaScript syntax
        run: |
          set -e
          for file in /tmp/nordicsignal-js/*.js; do node --check "$file"; done
          for file in frontend/*.js; do [ -e "$file" ] || continue; node --check "$file"; done
      - name: Check Cloudflare Worker syntax
        run: cp worker.js /tmp/nordicsignal-worker.mjs && node --check /tmp/nordicsignal-worker.mjs
      - name: Check production assets and routes
        run: |
          set -e
          for file in theme.css index.html stock.html stock_selector.js stock_extras.js stock_readiness.js stock_evidence_ui.js event_radar_ui.js intelligence.html instrument.html paper.html history.html news.html insider.html insider_clean_ui.js mobile.html morning.html calendar.html readiness.html development.html legal.html access_gate.js holdings.html dashboard_performance.js portfolio_dashboard.js manifest.webmanifest sw.js mobile_shell.js mobile_nav.js alert_nav_ui.js ui_shell.js; do test -s "frontend/$file"; done
          for file in production.py api_entrypoint.py http_cache_runtime.py holdings_integrity_runtime.py market_calendar_runtime.py morning_brief_runtime.py event_radar_runtime.py investment_readiness_runtime.py insider_market_v2_runtime.py insider_company_cleanup_runtime.py persistent_feed_cache_runtime.py performance_runtime.py signal_evidence_runtime.py push_runtime.py security_runtime.py data_quality_runtime.py ops_readiness_runtime.py system_health_runtime.py; do test -s "backend/$file"; done
          grep -q 'startCommand: uvicorn api_entrypoint:app' render.yaml
          grep -q '\["/mobile", "/mobile.html"\]' worker.js
          grep -q '\["/morning", "/morning.html"\]' worker.js
          grep -q '\["/stock", "/stock.html"\]' worker.js
          grep -q 'const API=""' frontend/index.html
          if grep -R -Fq 'nordicsignal-api.onrender.com' frontend; then echo 'Frontend must use same-origin /api proxy'; exit 1; fi
          grep -q '/api/morning-brief' frontend/morning.html
          grep -q '/api/event-radar' frontend/event_radar_ui.js
          grep -q 'event_radar_runtime' backend/sitecustomize.py
          grep -q '/api/event-radar' backend/event_radar_runtime.py
          grep -q "events:'Hendelser'" frontend/ui_shell.js
          grep -q "'/event_radar_ui.js'" frontend/sw.js
          grep -q "CACHE_NAME='nordicsignal-shell-v5'" frontend/sw.js
          grep -q "addEventListener('push'" frontend/sw.js
          grep -q 'NORDICSIGNAL_WRITE_TOKEN' backend/security_runtime.py
          grep -q 'NORDICSIGNAL_WRITE_TOKEN' worker.js
          if grep -Fq 'headers.set("access-control-allow-origin", "*")' worker.js; then echo 'Worker must not force wildcard CORS'; exit 1; fi
      - name: Check navigation invariants
        run: |
          set -e
          grep -q 'href="/app"' worker.js
          grep -q 'href="/morning"' worker.js
          grep -q 'href="/mobile"' frontend/mobile_shell.js
          grep -q '"start_url": "/mobile"' frontend/manifest.webmanifest
          grep -q "'/mobile'" frontend/sw.js
          grep -q "'/morning'" frontend/sw.js
          grep -q "'events'" frontend/ui_shell.js
