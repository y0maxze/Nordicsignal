name: NordicSignal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==8.4.2
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run complete test suite
        run: python -m pytest -q

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          out = Path('/tmp/nordicsignal-js'); out.mkdir(parents=True, exist_ok=True)
          count = 0
          for html in sorted(Path('frontend').glob('*.html')):
              text = html.read_text(encoding='utf-8')
              if '<html' not in text.lower() or '</html>' not in text.lower():
                  raise SystemExit(f'Malformed HTML shell: {html}')
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.I | re.S)
              for index, script in enumerate(scripts):
                  if not script.strip(): continue
                  target = out / f'{html.stem}-{index}.js'; target.write_text(script, encoding='utf-8')
                  print(f'{html} -> {target}'); count += 1
          if count == 0: raise SystemExit('No inline frontend JavaScript found')
          PY
      - name: Check frontend JavaScript syntax
        run: |
          set -e
          for file in /tmp/nordicsignal-js/*.js; do node --check "$file"; done
          for file in frontend/*.js; do [ -e "$file" ] || continue; node --check "$file"; done
      - name: Check Cloudflare Worker syntax
        run: |
          cp worker.js /tmp/nordicsignal-worker.mjs
          node --check /tmp/nordicsignal-worker.mjs
      - name: Check production assets and routes
        run: |
          set -e
          for file in theme.css index.html stock.html stock_selector.js stock_extras.js stock_readiness.js stock_evidence_ui.js intelligence.html instrument.html paper.html history.html news.html insider.html insider_clean_ui.js mobile.html calendar.html readiness.html development.html legal.html access_gate.js holdings.html dashboard_performance.js portfolio_dashboard.js manifest.webmanifest sw.js mobile_shell.js; do test -s "frontend/$file"; done
          for file in production.py http_cache_runtime.py holdings_integrity_runtime.py market_calendar_runtime.py investment_readiness_runtime.py insider_market_v2_runtime.py insider_company_cleanup_runtime.py persistent_feed_cache_runtime.py performance_runtime.py signal_evidence_runtime.py push_runtime.py security_runtime.py data_quality_runtime.py ops_readiness_runtime.py system_health_runtime.py; do test -s "backend/$file"; done
          grep -q 'startCommand: uvicorn production:app' render.yaml
          grep -q 'uvicorn production:app' DEPLOY.md
          grep -q '\["/mobile", "/mobile.html"\]' worker.js
          grep -q '\["/insider", "/insider.html"\]' worker.js
          grep -q '\["/stock", "/stock.html"\]' worker.js
          grep -q '\["/intelligence", "/intelligence.html"\]' worker.js
          grep -q '\["/instrument", "/instrument.html"\]' worker.js
          grep -q '\["/holdings", "/holdings.html"\]' worker.js
          grep -q '\["/paper", "/paper.html"\]' worker.js
          grep -q '\["/news", "/news.html"\]' worker.js
          grep -q '\["/calendar", "/calendar.html"\]' worker.js
          grep -q '\["/readiness", "/readiness.html"\]' worker.js
          grep -q '\["/legal", "/legal.html"\]' worker.js
          grep -q 'const API=""' frontend/index.html
          if grep -R -Fq 'nordicsignal-api.onrender.com' frontend; then echo 'Frontend must use same-origin /api proxy'; exit 1; fi
          if grep -Fq 'Number(p)*100' frontend/index.html; then echo 'Short percent invariant failed'; exit 1; fi
          grep -Fq 'Number(p)>=3' frontend/index.html
          grep -q 'dashboard_performance.js' frontend/analysis.js
          grep -q 'portfolio_dashboard.js' frontend/analysis.js
          grep -q 'requestIdleCallback' frontend/analysis.js
          grep -q "setAttribute('href','/insider')" frontend/analysis.js
          if grep -q 'insider_clean_ui.js' frontend/analysis.js; then echo 'Dedicated Insider UI must not load on dashboard critical path'; exit 1; fi
          grep -q "location.href='/stock?ticker='" frontend/analysis.js
          if grep -q 'analysis_legacy.js' frontend/analysis.js; then echo 'Legacy duplicate stock-detail UI must not be loaded'; exit 1; fi
          grep -q 'mapLimit(universe,5' frontend/dashboard_performance.js
          grep -q 'Number(p).toFixed(2)' frontend/dashboard_performance.js
          grep -q 'Søk selskap, ticker eller insider' frontend/insider_clean_ui.js
          grep -q 'XPLRA' frontend/insider_clean_ui.js
          grep -q 'src="/insider_clean_ui.js"' frontend/insider.html
          grep -q '/api/insider-market?limit=100' frontend/insider_clean_ui.js
          grep -q '/api/dashboard-home?mode=desktop&phase=' frontend/portfolio_dashboard.js
          grep -q '/api/dashboard-home?mode=mobile&phase=deferred' frontend/mobile.html
          grep -q 'ns-mobile-last-seen-v1' frontend/mobile.html
          grep -q '/api/ops-readiness' frontend/mobile.html
          if grep -q '/api/holdings/events\|/api/holdings/calendar' frontend/portfolio_dashboard.js; then echo 'Desktop home must use aggregated dashboard API'; exit 1; fi
          if grep -q '/api/holdings/events\|/api/insider-market\|/api/radar\|/api/holdings/calendar' frontend/mobile.html; then echo 'Mobile home must use aggregated dashboard API'; exit 1; fi
          grep -q '/api/calendar' frontend/calendar.html
          grep -q '/api/readiness/' frontend/readiness.html
          grep -q '/api/readiness/' frontend/stock_readiness.js
          grep -q '/api/search?q=' frontend/intelligence.html
          grep -q '/api/search?q=' frontend/stock_selector.js
          grep -q '/api/signal-evidence/' frontend/stock_evidence_ui.js
          grep -q 'stock_evidence_ui.js' worker.js
          grep -q "pathname = \"/intelligence.html\"" worker.js
          grep -q 'NS-RISK-2026-08-27-2' frontend/access_gate.js
          grep -q 'NS-RISK-2026-08-27-2' frontend/legal.html
          grep -q 'sessionStorage' frontend/access_gate.js
          grep -q 'Development Visualisation' frontend/development.html
          grep -q 'access_gate.js' worker.js
          grep -q 'mobile_shell.js' worker.js
          grep -q 'manifest.webmanifest' worker.js
          grep -q 'stock_selector.js' worker.js
          grep -q 'stock_readiness.js' worker.js
          grep -q 'theme.css' worker.js
          grep -q 'stock_extras.js' worker.js
          grep -q 'Market Pressure' frontend/stock_extras.js
          grep -q "CACHE_NAME='nordicsignal-shell-v4'" frontend/sw.js
          grep -q "addEventListener('push'" frontend/sw.js
          grep -q '/api/push/public-key' frontend/mobile_shell.js
          grep -q '/api/push/subscribe' frontend/mobile_shell.js
          grep -q 'pywebpush==2.4.0' backend/requirements.txt
          grep -q 'field_company_press_releases_target_id%5B' backend/insider_market_v2_runtime.py
          grep -q 'EURONEXT_INSIDER_TOPIC_ID = "1081"' backend/insider_market_v2_runtime.py
          grep -q 'insider_market_v2_runtime' backend/sitecustomize.py
          grep -q 'insider_company_cleanup_runtime' backend/sitecustomize.py
          grep -q 'signal_evidence_runtime' backend/sitecustomize.py
          grep -q 'push_runtime' backend/sitecustomize.py
          grep -q 'security_runtime' backend/sitecustomize.py
          grep -q 'data_quality_runtime' backend/sitecustomize.py
          grep -q 'ops_readiness_runtime' backend/sitecustomize.py
          grep -q 'persistent_feed_cache_runtime' backend/sitecustomize.py
          grep -q 'performance_runtime' backend/sitecustomize.py
          grep -q 'canonical_issuer' backend/insider_company_cleanup_runtime.py
          grep -q '/api/dashboard-home' backend/performance_runtime.py
          grep -q '/api/performance' backend/performance_runtime.py
          grep -q '/api/signal-evidence/{ticker}' backend/signal_evidence_runtime.py
          grep -q '/api/push/status' backend/push_runtime.py
          grep -q '/api/push/subscribe' backend/push_runtime.py
          grep -q '/api/security-status' backend/security_runtime.py
          grep -q '/api/data-quality' backend/data_quality_runtime.py
          grep -q '/api/ops-readiness' backend/ops_readiness_runtime.py
          grep -q 'NORDICSIGNAL_WRITE_TOKEN' backend/security_runtime.py
          grep -q 'NORDICSIGNAL_WRITE_TOKEN' worker.js
          if grep -Fq 'headers.set("access-control-allow-origin", "*")' worker.js; then echo 'Worker must not force wildcard CORS'; exit 1; fi
          grep -q 'stale_while_revalidate' backend/persistent_feed_cache_runtime.py
          grep -q 'system_health_runtime' backend/sitecustomize.py
          grep -q '/api/system-health' backend/system_health_runtime.py
          if grep -Eq 'STOCK_PRESSURE_UI|STOCK_INSIDER_UI|DASHBOARD_METRIC_UI|DASHBOARD_STOCK_ACTIONS_UI' worker.js; then echo 'Large UI implementations must live in frontend assets'; exit 1; fi
          if grep -q 'searchUpstream' worker.js; then echo 'Search must use canonical /api proxy'; exit 1; fi
      - name: Check navigation invariants
        run: |
          set -e
          grep -q 'href="/app"' worker.js
          grep -q 'nsGlobalHome' worker.js
          grep -q 'href="/calendar"' worker.js
          grep -q 'href="/readiness"' worker.js
          grep -q 'href="/legal"' worker.js
          grep -q 'href="/mobile"' frontend/mobile_shell.js
          grep -q 'href="/insider"' frontend/mobile_shell.js
          grep -q 'href="/readiness"' frontend/mobile_shell.js
          grep -q 'href="/stock"' frontend/mobile_shell.js
          grep -q 'href="/news"' frontend/mobile_shell.js
          if grep -q 'href="/paper"\|href="/holdings"\|view=insider' frontend/mobile_shell.js; then echo 'Focused mobile shell must not expose desktop-only routes or legacy insider view'; exit 1; fi
          grep -q '"start_url": "/mobile"' frontend/manifest.webmanifest
          grep -q "'/mobile'" frontend/sw.js
          grep -q "data-tab='pressure'\|data-tab=\"pressure\"\|dataset.tab='pressure'" frontend/stock_extras.js
          grep -q 'data-tab="readiness"' frontend/stock_readiness.js
          if grep -q "holdings.html?search=" frontend/dashboard_enhancements.js; then echo 'Global search must open instrument intelligence, not Holdings'; exit 1; fi
