name: NordicSignal temporary performance probe
on:
  push:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Measure production endpoints
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error

          BASES = {
              'cloudflare': 'https://nordicsignal.8pnwk5r8f4.workers.dev',
              'render': 'https://nordicsignal-api.onrender.com',
          }

          def fetch(base, path, timeout=120):
              req = urllib.request.Request(base + path, headers={'User-Agent':'NordicSignal-Performance-Probe/1.0'})
              start = time.perf_counter()
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      body = r.read().decode('utf-8','replace')
                      ms = round((time.perf_counter()-start)*1000, 1)
                      data = json.loads(body)
                      return r.status, ms, data, dict(r.headers)
              except Exception as e:
                  return None, round((time.perf_counter()-start)*1000,1), {'error':repr(e)}, {}

          # Wait for Render to expose the new route. Do not confuse deployment lag with performance.
          ready = False
          for attempt in range(12):
              status, ms, data, headers = fetch(BASES['render'], '/api/dashboard-home?mode=desktop&phase=core', 60)
              print('READY_CHECK', attempt+1, status, ms, data.get('phase'), headers.get('x-nordicsignal-response-ms'))
              if status == 200 and data.get('phase') == 'core':
                  ready = True
                  break
              time.sleep(15)
          if not ready:
              raise SystemExit('New dashboard-home route did not become ready')

          paths = [
              ('desktop_core','/api/dashboard-home?mode=desktop&phase=core'),
              ('desktop_deferred','/api/dashboard-home?mode=desktop&phase=deferred'),
              ('mobile_deferred_1','/api/dashboard-home?mode=mobile&phase=deferred'),
              ('mobile_deferred_2','/api/dashboard-home?mode=mobile&phase=deferred'),
              ('news_1','/api/news?limit=8'),
              ('news_2','/api/news?limit=8'),
              ('insider_1','/api/insider-market?limit=18&days=7'),
              ('insider_2','/api/insider-market?limit=18&days=7'),
              ('performance','/api/performance'),
          ]
          for base_name, base in BASES.items():
              print('BASE', base_name)
              for label, path in paths:
                  status, wall, data, headers = fetch(base, path)
                  out = {
                      'label': label,
                      'status': status,
                      'wall_ms': wall,
                      'server_ms': headers.get('x-nordicsignal-response-ms'),
                  }
                  if 'dashboard-home' in path:
                      out['total_ms'] = data.get('total_ms')
                      out['timings_ms'] = data.get('timings_ms')
                      out['sections'] = sorted((data.get('sections') or {}).keys())
                      h = (data.get('sections') or {}).get('holdings') or {}
                      if h:
                          out['holding_positions'] = (h.get('summary') or {}).get('position_count')
                      i = (data.get('sections') or {}).get('insider') or {}
                      if i:
                          out['insider_trades'] = i.get('eligible_trade_count')
                          out['insider_cache'] = i.get('persistent_cache')
                      n = (data.get('sections') or {}).get('news') or {}
                      if n:
                          out['news_count'] = len(n.get('items') or [])
                          out['news_cache'] = n.get('persistent_cache')
                  elif path.startswith('/api/news'):
                      out['items'] = len(data.get('items') or [])
                      out['cache'] = data.get('persistent_cache')
                  elif path.startswith('/api/insider-market'):
                      out['items'] = len(data.get('items') or [])
                      out['eligible'] = data.get('eligible_trade_count')
                      out['cache'] = data.get('persistent_cache')
                  elif path == '/api/performance':
                      out['tracked_routes'] = data.get('count')
                      out['slowest'] = [
                          {'path':x.get('path'),'avg_ms':x.get('avg_ms'),'max_ms':x.get('max_ms'),'count':x.get('count')}
                          for x in (data.get('items') or [])[:8]
                      ]
                  print('RESULT', json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY
