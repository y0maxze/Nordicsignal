name: NordicSignal temporary final stability probe
on:
  push:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe production
        run: |
          python - <<'PY'
          import json,time,urllib.request
          R='https://nordicsignal-api.onrender.com'
          C='https://nordicsignal.8pnwk5r8f4.workers.dev'
          EXPECTED='incorporated into latest NordicSignal score'
          def get(url, text=False):
              req=urllib.request.Request(url,headers={'User-Agent':'NordicSignal-Final-Stability-Probe/1.1'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  body=r.read().decode('utf-8','replace')
                  return r.status,(body if text else json.loads(body))
          ready=None
          for i in range(24):
              try:
                  s,d=get(R+'/api/data-quality')
                  f=(d.get('freshness') or {}).get('fundamentals') or {} if isinstance(d,dict) else {}
                  if s==200 and EXPECTED in str(f.get('source') or ''):
                      ready=d;break
                  print('WAIT',i+1,'old_deploy',str(f.get('source') or 'missing'))
              except Exception as e:
                  print('WAIT',i+1,type(e).__name__)
              time.sleep(15)
          if ready is None: raise SystemExit('exact final Render data-quality deployment did not become ready')
          summary={k:{'age_seconds':v.get('age_seconds'),'has_latest':bool(v.get('latest_at')),'source':v.get('source')} for k,v in (ready.get('freshness') or {}).items()}
          print('DATA_QUALITY',json.dumps({'status':ready.get('status'),'errors':ready.get('error_count'),'warnings':ready.get('warning_count'),'persistent':ready.get('persistent_storage'),'freshness':summary},sort_keys=True))
          for base,name in [(R,'render'),(C,'cloudflare')]:
              s,p=get(base+'/api/push/status'); print('PUSH',name,json.dumps({'status':s,'delivery_ready':p.get('delivery_ready'),'public_key':p.get('public_key_configured'),'private_key':p.get('private_key_configured'),'subscriptions':p.get('active_subscriptions')},sort_keys=True))
              s,o=get(base+'/api/ops-readiness'); print('OPS',name,json.dumps({'status':s,'stage':o.get('stage'),'private_blockers':o.get('private_blockers')},sort_keys=True))
          s,e=get(C+'/api/signal-evidence/XPLRA?years=1'); print('EVIDENCE',json.dumps({'status':s,'model':e.get('model'),'samples':(e.get('summary') or {}).get('sample_count'),'maturity':(e.get('summary') or {}).get('maturity')},sort_keys=True))
          s,js=get(C+'/mobile_shell.js',text=True); print('MOBILE_JS',json.dumps({'status':s,'test_push':'Test push' in js,'real_push':'/api/push/test' in js},sort_keys=True))
          assert ready.get('persistent_storage') is True
          assert ready.get('error_count') == 0
          assert bool((ready.get('freshness') or {}).get('fundamentals',{}).get('latest_at'))
          assert 'prices' in (ready.get('freshness') or {})
          assert 'market_news' in (ready.get('freshness') or {})
          assert 'insider_feed' in (ready.get('freshness') or {})
          assert 'Test push' in js and '/api/push/test' in js
          PY
