name: NordicSignal temporary maturity probe
on:
  push:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production maturity endpoints
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error

          BASES={
            'render':'https://nordicsignal-api.onrender.com',
            'cloudflare':'https://nordicsignal.8pnwk5r8f4.workers.dev',
          }
          def fetch(base,path,timeout=120,text=False):
              req=urllib.request.Request(base+path,headers={'User-Agent':'NordicSignal-Maturity-Probe/1.0'})
              start=time.perf_counter()
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      body=r.read().decode('utf-8','replace')
                      ms=round((time.perf_counter()-start)*1000,1)
                      return r.status,ms,(body if text else json.loads(body)),dict(r.headers)
              except Exception as exc:
                  return None,round((time.perf_counter()-start)*1000,1),{'error':repr(exc)},{}

          # Wait for Render to expose this deployment; don't confuse deploy lag with failure.
          ready=False
          for attempt in range(16):
              status,ms,data,_=fetch(BASES['render'],'/api/ops-readiness',60)
              print('READY',attempt+1,status,ms,data.get('stage') if isinstance(data,dict) else None)
              if status==200 and isinstance(data,dict) and data.get('stage'):
                  ready=True;break
              time.sleep(15)
          if not ready: raise SystemExit('Maturity endpoints did not become ready')

          for base_name,base in BASES.items():
              print('BASE',base_name)
              for label,path in [
                  ('health','/api/health'),
                  ('data_quality','/api/data-quality'),
                  ('security','/api/security-status'),
                  ('ops','/api/ops-readiness'),
                  ('push','/api/push/status'),
                  ('push_key','/api/push/public-key'),
                  ('evidence_xplra','/api/signal-evidence/XPLRA?years=1'),
              ]:
                  status,ms,data,headers=fetch(base,path,180)
                  out={'label':label,'status':status,'wall_ms':ms,'server_ms':headers.get('x-nordicsignal-response-ms')}
                  if isinstance(data,dict):
                      if label=='data_quality': out.update({'quality':data.get('status'),'errors':data.get('error_count'),'warnings':data.get('warning_count'),'persistent':data.get('persistent_storage')})
                      elif label=='security': out.update({'write_protection':data.get('write_protection'),'secret_configured':data.get('shared_secret_configured'),'authentication':data.get('authentication')})
                      elif label=='ops': out.update({'stage':data.get('stage'),'private_blockers':data.get('private_blockers'),'commercial_blockers':data.get('commercial_blockers')})
                      elif label=='push': out.update({'delivery_ready':data.get('delivery_ready'),'public_key':data.get('public_key_configured'),'private_key':data.get('private_key_configured'),'subscriptions':data.get('active_subscriptions')})
                      elif label=='push_key': out.update({'configured':data.get('configured')})
                      elif label=='evidence_xplra':
                          summary=data.get('summary') or {}; overall=summary.get('overall') or {}; hz=overall.get('horizons') or {}
                          out.update({'ticker':data.get('ticker'),'model':data.get('model'),'samples':summary.get('sample_count'),'maturity':summary.get('maturity'),'h5_n':(hz.get('5') or {}).get('directional_n'),'h20_n':(hz.get('20') or {}).get('directional_n'),'cache':(data.get('cache') or {}).get('state')})
                  print('RESULT',json.dumps(out,ensure_ascii=False,sort_keys=True))

          # Static PWA checks through Cloudflare.
          for label,path,needles in [
              ('mobile','/mobile',['Siden sist','ns-mobile-last-seen-v1']),
              ('sw','/sw.js',["nordicsignal-shell-v4","addEventListener('push'"]),
              ('stock','/stock?ticker=XPLRA',['stock_evidence_ui.js']),
          ]:
              status,ms,body,_=fetch(BASES['cloudflare'],path,60,text=True)
              result={'label':label,'status':status,'wall_ms':ms,'needles':{needle:(needle in body if isinstance(body,str) else False) for needle in needles}}
              print('STATIC',json.dumps(result,ensure_ascii=False,sort_keys=True))
          PY
