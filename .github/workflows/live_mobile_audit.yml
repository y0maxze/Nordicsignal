name: NordicSignal live mobile audit
on:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live production
        run: |
          python - <<'PY'
          import json, urllib.request
          base='https://nordicsignal.8pnwk5r8f4.workers.dev'
          for path in ['/mobile','/insider','/news','/manifest.webmanifest','/sw.js']:
              try:
                  with urllib.request.urlopen(base+path, timeout=30) as r:
                      body=r.read().decode('utf-8','replace')
                      print('PAGE', path, r.status, len(body), 'mobile-nav' if 'mobile_shell.js' in body else '')
              except Exception as e: print('PAGE_FAIL',path,repr(e))
          for path in ['/api/health','/api/system-health','/api/insider-market?days=14&limit=100&refresh=true','/api/holdings/events?limit=8','/api/holdings/calendar?days=45&limit=8','/api/news?limit=8']:
              try:
                  with urllib.request.urlopen(base+path, timeout=90) as r:
                      d=json.loads(r.read().decode())
                  if 'insider-market' in path:
                      sample=[]
                      for x in (d.get('items') or [])[:5]: sample.append({'company':x.get('company'),'actor':x.get('entity') or x.get('person') or x.get('insider'),'shares':x.get('shares'),'price':x.get('price'),'pending':x.get('details_pending')})
                      print('INSIDER',d.get('disclosure_count'),d.get('eligible_trade_count'),d.get('pending_detail_count'),d.get('source_meta'),sample)
                  elif 'system-health' in path: print('SYSTEM',d.get('storage_backend'),d.get('persistent'),d.get('database_status'),d.get('counts'))
                  else: print('API',path,r.status,'items',len(d.get('items') or []),'status',d.get('status'))
              except Exception as e: print('API_FAIL',path,repr(e))
          PY
