name: Insider Confluence Backtest

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  historical-insider-confluence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run canonical insider confluence backtest
        run: python run_insider_confluence_canonical.py
      - name: Upload confluence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insider-confluence-backtest-report
          path: backend/insider_confluence_backtest.json
