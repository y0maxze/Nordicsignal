name: NordicSignal temporary freshness probe
on:
  push:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production freshness semantics
        run: |
          python - <<'PY'
          import json,time,urllib.request
          urls=['https://nordicsignal-api.onrender.com/api/data-quality','https://nordicsignal.8pnwk5r8f4.workers.dev/api/data-quality']
          for attempt in range(20):
              good=True; results=[]
              for url in urls:
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'NordicSignal-Freshness-Probe/1.0'})
                      with urllib.request.urlopen(req,timeout=60) as r:
                          d=json.loads(r.read().decode())
                      prices=(d.get('freshness') or {}).get('prices') or {}
                      snap=(d.get('freshness') or {}).get('persisted_price_snapshot') or {}
                      row={'url':'render' if 'onrender' in url else 'cloudflare','status':r.status,'quality':d.get('status'),'mode':prices.get('mode'),'live_age':prices.get('age_seconds'),'snapshot_age':snap.get('age_seconds'),'errors':d.get('error_count'),'warnings':d.get('warning_count')}
                      results.append(row)
                      good = good and r.status==200 and prices.get('mode')=='live_on_request' and 'persisted_price_snapshot' in (d.get('freshness') or {})
                  except Exception as e:
                      results.append({'url':url,'error':type(e).__name__}); good=False
              print('ATTEMPT',attempt+1,json.dumps(results,sort_keys=True))
              if good: break
              time.sleep(15)
          if not good: raise SystemExit('new freshness semantics not live')
          PY
