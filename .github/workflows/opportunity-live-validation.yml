name: Opportunity Live Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-live-opportunity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run live opportunity validation
        run: python validate_opportunity_live.py
      - name: Upload live validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-live-validation-report
          path: backend/opportunity_live_validation.json
