name: Insider Live Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe live insider sources
        run: |
          python - <<'PY'
          import json, time
          from curl_cffi import requests
          from insider_runtime import _Parser, norm
          from insider_fresh_fallback_runtime import FRESH_ISSUER_FEEDS, discover_release_links, _fresh_items
          from providers import NordicRegulatoryProvider

          session = requests.Session(impersonate='chrome')
          print('FRESH_ISSUER_FEEDS=', FRESH_ISSUER_FEEDS)
          urls = [
              'https://rss.globenewswire.com/news/consumer-products-services/food-beverage/load/more',
              'https://rss.globenewswire.com/news/consumer-products-services/food-beverage/load/more?page=1&pageSize=50',
              'https://www.globenewswire.com/en/search/organization/Ler%C3%B8y%2520Seafood%2520Group%2520ASA?page=1',
              'https://live.euronext.com/en/product/equities/NO0003096208-XOSL/company-information',
          ]
          for url in urls:
              try:
                  r = session.get(url, timeout=20, allow_redirects=True)
                  text = r.text
                  p = _Parser(); p.feed(text)
                  links = discover_release_links(text, url, 'LSG')
                  print('\nURL', url)
                  print('STATUS', r.status_code, 'FINAL', r.url, 'BYTES', len(text))
                  print('HAS_LEROY', 'leroy seafood' in norm(text), 'HAS_INSIDER', 'primary insider' in norm(text) or 'primarinsider' in norm(text))
                  print('TEXT_HEAD', p.text[:500].replace('\n',' '))
                  print('DISCOVERED', len(links), links[:8])
              except Exception as exc:
                  print('\nURL', url, 'ERROR', repr(exc))

          try:
              rows = _fresh_items(session, 'LSG', 'Lerøy Seafood Group ASA')
              print('\nFRESH_ITEMS', json.dumps(rows, ensure_ascii=False, indent=2)[:8000])
          except Exception as exc:
              print('\nFRESH_ITEMS_ERROR', repr(exc))

          try:
              provider = NordicRegulatoryProvider()
              result = provider.insider('LSG', 'Lerøy Seafood Group ASA')
              print('\nPROVIDER_RESULT', json.dumps(result, ensure_ascii=False, indent=2)[:12000])
          except Exception as exc:
              print('\nPROVIDER_ERROR', repr(exc))
          PY
