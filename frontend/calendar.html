<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NordicSignal · Kalender</title>
<style>
:root{--bg:#070707;--panel:#101010;--line:#292929;--text:#f4f4f4;--muted:#888;--green:#35d49a;--yellow:#e7c16b;--blue:#9fc7ff}*{box-sizing:border-box}body{margin:0;background:#070707;color:var(--text);font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:34px 28px 70px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:22px;flex-wrap:wrap}.logo{font-size:20px;font-weight:850;letter-spacing:-.04em}.logo span{color:var(--green)}h1{font-size:30px;letter-spacing:-.035em;margin:19px 0 6px}.sub{color:var(--muted);font-size:11px}.controls{display:flex;gap:7px;flex-wrap:wrap}.seg{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#0b0b0b}.btn{border:0;background:transparent;color:#8e8e8e;border-radius:6px;padding:8px 11px;font:750 10px system-ui;cursor:pointer}.btn.active{background:#ededed;color:#080808}.outline{border:1px solid #303030;background:#151515;color:#eee;border-radius:9px;padding:9px 11px;font-weight:650;cursor:pointer}.status{display:flex;justify-content:space-between;gap:15px;margin:20px 0 12px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#0c0c0c;color:#8e8e8e;font-size:10px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.dayGroup{border-top:1px solid #252525;padding:18px 0 4px}.dayGroup:first-child{border-top:0;padding-top:2px}.dayHead{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}.dayHead b{font-size:16px}.dayHead span{font-size:10px;color:#777}.row{display:grid;grid-template-columns:90px minmax(0,1fr) 150px 80px;gap:14px;align-items:center;padding:13px 0;border-top:1px solid #222}.ticker{font-weight:850;font-size:11px}.company{font-weight:750}.meta{color:#777;font-size:9px;margin-top:3px}.pill{display:inline-flex;width:max-content;border:1px solid #3a3a3a;border-radius:999px;padding:4px 7px;color:#aaa;font-size:9px;font-weight:850}.pill.report{color:var(--yellow);border-color:#554923;background:#17150c}.pill.meeting{color:var(--blue);border-color:#34485c;background:#0d141b}.days{text-align:right;color:#929292;font-size:10px}.source{color:#aaa;text-decoration:none;font-size:10px}.source:hover{color:#fff;text-decoration:underline}.empty{padding:44px 20px;text-align:center;color:#858585}.empty b{display:block;color:#eee;font-size:17px;margin-bottom:7px}@media(max-width:760px){.wrap{padding:24px 16px 55px}.row{grid-template-columns:70px 1fr}.row>:nth-child(3),.row>:nth-child(4){grid-column:2;text-align:left}.status{flex-direction:column}.top{align-items:flex-start}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><div class="logo">Nordic<span>Signal</span></div><h1>Kommende hendelser</h1><div class="sub">Rapporter, generalforsamlinger og andre planlagte finansielle hendelser fra Oslo Børs.</div></div><div class="controls"><div class="seg"><button class="btn active" data-scope="holdings">Min beholdning</button><button class="btn" data-scope="market">Alle Oslo Børs</button></div><div class="seg"><button class="btn" data-days="30">30 dager</button><button class="btn active" data-days="90">90 dager</button></div><button class="outline" id="refresh">Oppdater</button></div></div>
<div class="status"><span id="statusText">Laster offisiell finanskalender…</span><span id="sourceText"></span></div>
<section class="panel"><div id="calendar"><div class="empty">Laster…</div></div></section>
<script>
const API='';let scope='holdings',days=90,seq=0,timer=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function pill(x){const cls=x.event_type==='report'?'report':x.event_type==='meeting'?'meeting':'';return `<span class="pill ${cls}">${esc(String(x.event_label||x.event_raw||'Hendelse').toUpperCase())}</span>`}
function when(x){const n=Number(x.days_until);if(n===0)return 'I dag';if(n===1)return 'I morgen';return Number.isFinite(n)&&n>1?'om '+n+' dager':''}
function dayTitle(value){try{const d=new Date(value+'T12:00:00');return {day:d.toLocaleDateString('no-NO',{weekday:'long',day:'numeric',month:'long'}),year:d.getFullYear()}}catch{return {day:value,year:''}}}
function render(items){const groups=new Map();for(const x of items||[]){if(!groups.has(x.date))groups.set(x.date,[]);groups.get(x.date).push(x)}if(!groups.size){$('calendar').innerHTML=`<div class="empty"><b>Ingen kommende hendelser funnet</b>${scope==='holdings'?'Når en aksje i beholdningen har en planlagt rapport eller et møte, vises den her.':'Prøv et lengre datointervall.'}</div>`;return}$('calendar').innerHTML=[...groups.entries()].map(([date,rows])=>{const title=dayTitle(date);return `<div class="dayGroup"><div class="dayHead"><b>${esc(title.day)}</b><span>${esc(title.year)}</span></div>${rows.map(x=>`<div class="row"><div><div class="ticker">${esc(x.ticker||'—')}</div><div class="meta">${x.in_holdings?'I BEHOLDNING':x.tracked?'NORDICSIGNAL':''}</div></div><div><div class="company">${esc(x.company)}</div><div class="meta">${esc(x.event_raw||x.event_label||'')}</div></div><div>${pill(x)}</div><div class="days">${esc(when(x))}<div>${x.url?`<a class="source" href="${esc(x.url)}" target="_blank" rel="noopener">Kilde ↗</a>`:''}</div></div></div>`).join('')}</div>`}).join('')}
async function load(silent=false){const mine=++seq;if(!silent){$('statusText').textContent='Laster offisiell finanskalender…';$('calendar').innerHTML='<div class="empty">Laster…</div>'}const path=scope==='holdings'?'/api/holdings/calendar':'/api/calendar';try{const r=await fetch(path+'?days='+days+'&limit=180',{cache:'no-store'}),d=await r.json().catch(()=>({}));if(mine!==seq)return;if(!r.ok)throw Error(d.detail||'HTTP '+r.status);render(d.items||[]);$('statusText').textContent=(scope==='holdings'?'Min beholdning':'Alle Oslo Børs')+' · '+(d.items||[]).length+' kommende hendelser';$('sourceText').textContent='Oppdatert '+new Date().toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'})+' · '+(d.source||'Euronext / Oslo Børs')}catch(e){if(mine!==seq)return;$('statusText').textContent='Kalenderen er midlertidig utilgjengelig';if(!silent)$('calendar').innerHTML='<div class="empty"><b>Kunne ikke hente kalenderen</b>Prøv igjen om litt.</div>'}}
document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;document.querySelectorAll('[data-scope]').forEach(x=>x.classList.toggle('active',x===b));load()});document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{days=Number(b.dataset.days);document.querySelectorAll('[data-days]').forEach(x=>x.classList.toggle('active',x===b));load()});$('refresh').onclick=()=>load();timer=setInterval(()=>{if(!document.hidden)load(true)},300000);load();
</script></main></body></html>
