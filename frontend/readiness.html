<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NordicSignal · Investment Check</title><link rel="stylesheet" href="/theme.css"><style>
:root{--bg:#070707;--panel:#0e0e0e;--line:#292929;--text:#f5f5f5;--muted:#929292;--green:#35d99b;--red:#ff7586;--yellow:#e7c16b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1280px;margin:auto;padding:34px 28px 70px}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-end}.logo{font-size:20px;font-weight:850;letter-spacing:-.04em;text-decoration:none}.logo span{color:#18c984}h1{font-size:30px;margin:18px 0 7px;letter-spacing:-.035em}.sub,.small{color:var(--muted);font-size:11px}.controls{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}.searchBox{position:relative;width:min(430px,60vw)}.searchBox label{display:block;color:#888;font-size:10px;margin:0 0 6px 2px}.input{width:100%;background:#0a0a0a;border:1px solid #303030;color:#fff;border-radius:9px;padding:11px 12px;font:inherit;outline:none}.input:focus{border-color:#555}.searchResults{display:none;position:absolute;z-index:40;left:0;right:0;top:100%;margin-top:6px;background:#0b0b0b;border:1px solid #343434;border-radius:10px;box-shadow:0 20px 50px #000b;max-height:360px;overflow:auto}.searchResults.open{display:block}.searchItem{display:block;width:100%;border:0;border-bottom:1px solid #222;background:transparent;color:#eee;text-align:left;padding:11px 12px;cursor:pointer}.searchItem:hover{background:#151515}.searchName{font-weight:760}.searchMeta{color:#858585;font-size:10px;margin-top:3px}.btn{border:1px solid #303030;background:#151515;color:#eee;border-radius:9px;padding:10px 12px;cursor:pointer;font-weight:650}.hero,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.hero{margin-top:20px;padding:22px}.heroTop{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;flex-wrap:wrap}.name{font-size:21px;font-weight:820}.meta{color:#858585;font-size:11px;margin-top:5px}.scoreWrap{text-align:right}.score{font-size:38px;font-weight:870;letter-spacing:-.04em}.status{font-size:13px;font-weight:820;margin-top:3px}.positive{color:var(--green)}.risk{color:var(--red)}.watch{color:var(--yellow)}.bar{height:7px;background:#242424;border-radius:999px;margin-top:17px;overflow:hidden}.bar i{display:block;height:100%;background:#d7d7d7;border-radius:999px}.brief{margin-top:17px;padding:13px 14px;border:1px solid #2b2b2b;border-radius:9px;background:#0a0a0a;line-height:1.55;color:#d2d2d2}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.metric{border-top:1px solid #272727;padding-top:11px}.metric span{display:block;color:#858585;font-size:10px}.metric b{display:block;margin-top:5px;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel{padding:18px}.panel h2{font-size:16px;margin:0 0 12px}.factor{padding:10px 0;border-top:1px solid #242424;line-height:1.45}.factor:first-of-type{border-top:0}.news{display:block;padding:12px 0;border-top:1px solid #242424;color:#eee;text-decoration:none}.news:first-of-type{border-top:0}.news:hover b{text-decoration:underline}.news span{display:block;color:#777;font-size:9px;margin-top:4px}.source{padding:7px 0;color:#999;font-size:10px}.empty,.notice{padding:28px 18px;border:1px solid #292929;border-radius:10px;background:#0c0c0c;color:#999;text-align:center;margin-top:20px}.policy{margin-top:16px;color:#747474;font-size:10px;line-height:1.5}.policy a{color:#aaa}.hidden{display:none!important}@media(max-width:850px){.top{align-items:flex-start;flex-direction:column}.controls,.searchBox{width:100%}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.scoreWrap{text-align:left}}@media(max-width:520px){.wrap{padding:22px 16px 50px}.metrics{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top"><div><a class="logo" href="/app">Nordic<span>Signal</span></a><h1>Investment Check</h1><div class="sub">Sjekker trend, risiko, nyheter og tilgjengelige fakta. Analyse-status — ikke kjøps- eller salgsråd.</div></div><div class="controls"><div class="searchBox"><label>SØK AKSJE, FOND ELLER ETF</label><input id="search" class="input" autocomplete="off" placeholder="F.eks. MPCC, Lerøy, KLP Global, VOO…"><div id="results" class="searchResults"></div></div><button class="btn" onclick="runTyped()">Analyser</button><button class="btn" onclick="location.href='/app'">← Oversikt</button></div></div><div id="host"><div class="empty">Søk etter et instrument for å kjøre Investment Readiness-sjekken.</div></div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let timer=null,seq=0,last=[];
async function get(p){const r=await fetch(p,{cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}
function n(v,d=1){return v==null?'—':Number(v).toLocaleString('no-NO',{maximumFractionDigits:d})}function pct(v){return v==null?'—':(Number(v)>=0?'+':'')+n(v,1)+'%'}function tone(d){return d.tone==='positive'?'positive':d.tone==='risk'?'risk':'watch'}
function factorList(items,kind){return (items||[]).length?(items||[]).map(x=>`<div class="factor ${kind}">${kind==='positive'?'＋':'−'} ${esc(x)}</div>`).join(''):`<div class="factor small">Ingen tydelige ${kind==='positive'?'positive':'negative'} faktorer funnet i tilgjengelige data.</div>`}
function newsList(items){return (items||[]).length?(items||[]).slice(0,6).map(x=>`<a class="news" ${x.url?`href="${esc(x.url)}" target="_blank" rel="noopener"`:''}><b>${esc(x.title||'Nyhet')}</b><span>${esc(x.publisher||x.source||'Offentlig kilde')} · ${esc(x.published_at||'dato ikke oppgitt')}</span></a>`).join(''):'<div class="small">Ingen relevante ferske nyheter funnet.</div>'}
function render(d){const a=d.analytics||{};$('host').innerHTML=`<section class="hero"><div class="heroTop"><div><div class="name">${esc(d.name||d.symbol)}</div><div class="meta">${esc(d.symbol)} · ${esc(d.asset_class||'Instrument')} · ${esc(d.exchange||'')} ${d.price!=null?'· '+n(d.price,2)+' '+esc(d.currency||''):''}</div></div><div class="scoreWrap"><div class="score ${tone(d)}">${esc(d.readiness_score)}/100</div><div class="status ${tone(d)}">${esc(d.readiness_label)}</div><div class="small">Datadekning ${esc(d.coverage_pct)}%</div></div></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(d.readiness_score||0)))}%"></i></div><div class="brief">${esc(d.brief)}</div><div class="metrics"><div class="metric"><span>1 måned</span><b>${pct(a.return_1m_pct)}</b></div><div class="metric"><span>3 måneder</span><b>${pct(a.return_3m_pct)}</b></div><div class="metric"><span>Volatilitet 1 år</span><b>${a.volatility_1y_pct==null?'—':n(a.volatility_1y_pct,1)+'%'}</b></div><div class="metric"><span>Max drawdown 1 år</span><b>${a.max_drawdown_1y_pct==null?'—':n(a.max_drawdown_1y_pct,1)+'%'}</b></div></div></section><div class="grid"><section class="panel"><h2>Det som trekker opp</h2>${factorList(d.positive_factors,'positive')}</section><section class="panel"><h2>Risiko / det som trekker ned</h2>${factorList(d.risk_factors,'risk')}</section><section class="panel"><h2>Siste relevante nytt</h2>${newsList(d.news_items)}</section><section class="panel"><h2>Datagrunnlag</h2>${(d.sources||[]).map(x=>`<div class="source">${esc(x)}</div>`).join('')||'<div class="small">Ingen kilder oppgitt.</div>'}<div class="policy">Investment Readiness er modellbasert beslutningsstøtte. Den kan være feil, ufullstendig eller forsinket og er ikke personlig investeringsrådgivning. <a href="/legal">Les vilkår og risiko.</a></div></section></div>`}
async function analyse(symbol){const s=String(symbol||'').trim();if(!s)return;$('search').value=s;$('results').className='searchResults';history.replaceState({},'',`/readiness?symbol=${encodeURIComponent(s)}`);$('host').innerHTML='<div class="notice">Analyserer markedsdata, risiko og siste nytt…</div>';try{render(await get('/api/readiness/'+encodeURIComponent(s)))}catch(e){$('host').innerHTML=`<div class="notice">Kunne ikke fullføre analysen akkurat nå: ${esc(e.message)}</div>`}}
function runTyped(){const first=last[0],text=$('search').value.trim();analyse(first?.symbol||first?.ticker||text)}
async function search(q){const mine=++seq,res=$('results'),text=q.trim();if(text.length<2){res.className='searchResults';last=[];return}res.className='searchResults open';res.innerHTML='<div class="searchItem"><div class="searchMeta">Søker…</div></div>';try{const d=await get('/api/search?q='+encodeURIComponent(text)+'&limit=12');if(mine!==seq)return;last=(d.items||[]).slice(0,10);res.innerHTML=last.length?last.map((x,i)=>`<button class="searchItem" data-i="${i}"><div class="searchName">${esc(x.name||x.longname||x.ticker||x.symbol)}</div><div class="searchMeta">${esc(x.symbol||x.ticker||'')} ${x.asset_class?'· '+esc(x.asset_class):''} ${x.exchange?'· '+esc(x.exchange):''}</div></button>`).join(''):'<div class="searchItem"><div class="searchMeta">Ingen treff.</div></div>';res.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const x=last[Number(b.dataset.i)];analyse(x.symbol||x.market_symbol||x.ticker)})}catch(e){res.innerHTML='<div class="searchItem"><div class="searchMeta">Søk er midlertidig utilgjengelig.</div></div>'}}
$('search').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>search(e.target.value),220)});$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runTyped()}});document.addEventListener('click',e=>{if(!e.target.closest('.searchBox'))$('results').className='searchResults'});const initial=new URLSearchParams(location.search).get('symbol');if(initial)analyse(initial);
</script></body></html>
