<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NordicSignal · Price History</title><style>:root{--bg:#07111f;--p:#0d1b2d;--l:#20354d;--t:#eef5ff;--m:#91a5bd;--g:#35d49a;--r:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#112942,#07111f 50%);color:var(--t);font:14px system-ui;padding:28px}.wrap{max-width:1200px;margin:auto}.top,.controls,.stats{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between;margin-bottom:15px}.logo{font-size:22px;font-weight:800}.logo span{color:var(--g)}input,button{background:#10243a;border:1px solid var(--l);color:#fff;border-radius:9px;padding:10px 12px}button{cursor:pointer}button.active{border-color:#4d7599}.card{background:rgba(13,27,45,.96);border:1px solid var(--l);border-radius:14px;padding:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:15px 0}.stats .card{flex:1}.sub{color:var(--m);font-size:12px}.value{font-size:22px;font-weight:800;margin-top:4px}.chart{height:470px;position:relative}.chart svg{width:100%;height:100%}.tip{position:absolute;display:none;background:#07111f;border:1px solid var(--l);border-radius:8px;padding:8px;pointer-events:none}.g{color:var(--g)}.r{color:var(--r)}@media(max-width:700px){body{padding:15px}.stats{grid-template-columns:1fr 1fr}.chart{height:350px}}</style></head><body><main class="wrap"><div class="top"><div><div class="logo">Nordic<span>Signal</span></div><h1>Price History</h1><div class="sub">Interaktiv kurshistorikk fra Yahoo Finance.</div></div><div class="controls"><input id="t" value="LSG" maxlength="12" aria-label="Ticker"><button id="load">Last inn</button><button onclick="location.href='/app'">Dashboard</button></div></div><div class="controls" id="periods"><button data-p="1m" class="active">1 mnd</button><button data-p="3m">3 mnd</button><button data-p="6m">6 mnd</button><button data-p="1y">1 år</button><button data-p="5y">5 år</button><button data-p="10y">10 år</button><button data-p="max">Maks</button></div><div id="status" class="sub" style="margin:12px 0">Laster…</div><div class="stats"><div class="card"><div class="sub">Siste</div><div id="last" class="value">—</div></div><div class="card"><div class="sub">Endring i perioden</div><div id="chg" class="value">—</div></div><div class="card"><div class="sub">Høyeste</div><div id="hi" class="value">—</div></div><div class="card"><div class="sub">Laveste</div><div id="lo" class="value">—</div></div></div><section class="card"><div class="chart"><svg id="svg" viewBox="0 0 1000 470" preserveAspectRatio="none"></svg><div id="tip" class="tip"></div></div></section></main><script>const A='https://nordicsignal-api.onrender.com',q=x=>document.getElementById(x),fmt=x=>x==null?'—':Number(x).toLocaleString('no-NO',{maximumFractionDigits:2});let p='1m',pts=[];function clean(a){return(a||[]).map(x=>({d:x.date||x.datetime||x.timestamp,c:+(x.close?.raw??x.close)})).filter(x=>x.d&&Number.isFinite(x.c))}function draw(){let s=q('svg'),w=1000,h=470,l=55,r=15,t=20,b=35,v=pts.map(x=>x.c);if(!pts.length){s.innerHTML='';return}let mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1,xy=pts.map((x,i)=>[l+i/(Math.max(1,pts.length-1))*(w-l-r),t+(1-(x.c-mn)/rg)*(h-t-b)]),path=xy.map((x,i)=>(i?'L':'M')+x[0]+' '+x[1]).join(' '),g='';for(let i=0;i<5;i++){let y=t+i*(h-t-b)/4;g+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="#2a2a2a"/><text x="5" y="${y+4}" fill="#999" font-size="12">${fmt(mx-rg*i/4)}</text>`}s.innerHTML=g+`<path d="${path}" fill="none" stroke="#18c984" stroke-width="3"/>`;s.onmousemove=e=>{let z=s.getBoundingClientRect(),i=Math.round(((e.clientX-z.left)/z.width)*(pts.length-1)),x=pts[Math.max(0,Math.min(pts.length-1,i))];q('tip').style.cssText=`display:block;left:${Math.min(e.clientX-z.left+10,z.width-150)}px;top:${Math.max(5,e.clientY-z.top-20)}px`;q('tip').textContent=x.d+' · '+fmt(x.c)};s.onmouseleave=()=>q('tip').style.display='none'}async function load(){let t=q('t').value.trim().toUpperCase();if(!t)return;q('status').textContent='Laster '+t+' · '+p+'…';try{let r=await fetch(`${A}/api/history/${encodeURIComponent(t)}?period=${p}`);if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();pts=clean(d.items);if(!pts.length)throw Error(d.error||'Ingen kurshistorikk returnert');let v=pts.map(x=>x.c),a=v[0],z=v.at(-1),c=a?100*(z-a)/a:0;q('last').textContent=fmt(z);q('chg').textContent=(c>=0?'+':'')+fmt(c)+'%';q('chg').className='value '+(c>=0?'g':'r');q('hi').textContent=fmt(Math.max(...v));q('lo').textContent=fmt(Math.min(...v));q('status').textContent=`${t} · ${p} · ${pts.length} observasjoner`;draw()}catch(e){pts=[];draw();q('status').textContent='Kunne ikke laste: '+e.message}}q('load').onclick=load;q('t').onkeydown=e=>e.key==='Enter'&&load();document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-p]').forEach(x=>x.classList.remove('active'));b.classList.add('active');p=b.dataset.p;load()});load();</script></body></html>
