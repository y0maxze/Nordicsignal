<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Varsler · NordicSignal</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070707;color:#f2f2f2;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.alertPage{width:min(760px,100%);margin:auto;padding:26px 16px 110px}.alertHead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.alertHead h1{font-size:30px;line-height:1.05;margin:0 0 7px}.alertHead p{margin:0;color:#999;font-size:13px}.alertCount{min-width:42px;height:42px;border:1px solid #333;border-radius:14px;display:grid;place-items:center;font-weight:800;background:#111}.filters{display:flex;gap:8px;overflow:auto;padding:0 0 12px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid #2b2b2b;border-radius:999px;background:#0e0e0e;color:#aaa;padding:9px 13px;font-weight:700;font-size:12px}.filter.active{background:#f1f1f1;color:#080808;border-color:#f1f1f1}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px}.toolbar small{color:#777}.markAll{border:0;background:transparent;color:#cfcfcf;font-weight:700;padding:7px}.alertList{display:grid;gap:10px}.alertCard{display:block;width:100%;text-align:left;color:inherit;text-decoration:none;border:1px solid #242424;background:#0e0e0e;border-radius:18px;padding:15px 15px 14px;position:relative}.alertCard.unread{border-color:#484848;background:#121212}.alertTop{display:flex;align-items:center;gap:9px;margin-bottom:8px}.dot{width:7px;height:7px;border-radius:50%;background:#eee;flex:0 0 auto}.alertCard:not(.unread) .dot{opacity:0}.type{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8e8e8e}.time{margin-left:auto;font-size:11px;color:#777}.alertTitle{font-size:16px;font-weight:780;line-height:1.3;margin:0 0 5px}.alertBody{font-size:13px;line-height:1.45;color:#b5b5b5;margin:0}.ticker{display:inline-flex;margin-top:10px;border:1px solid #292929;border-radius:8px;padding:4px 7px;font-size:10px;font-weight:800;color:#aaa}.empty{border:1px dashed #303030;border-radius:18px;padding:30px 20px;text-align:center;color:#888}.error{border:1px solid #4b2c2c;background:#160d0d;border-radius:14px;padding:14px;color:#d5b0b0}.skeleton{height:105px;border-radius:18px;background:#111;border:1px solid #1d1d1d}
  </style>
</head>
<body>
  <main class="alertPage">
    <header class="alertHead"><div><h1>Varsler</h1><p>Push- og PWA-varsler lagres i 90 dager.</p></div><div class="alertCount" id="unreadCount">0</div></header>
    <div class="filters" id="filters" aria-label="Filtrer varsler">
      <button class="filter active" data-type="ALL">Alle</button>
      <button class="filter" data-type="INSIDER">Insider</button>
      <button class="filter" data-type="OPPORTUNITY">Opportunity</button>
      <button class="filter" data-type="ACTIVITY">Aktivitet</button>
      <button class="filter" data-type="TREND">Trend</button>
      <button class="filter" data-type="SIGNAL">Signal</button>
    </div>
    <div class="toolbar"><small id="summary">Laster…</small><button class="markAll" id="markAll" type="button">Marker alle lest</button></div>
    <section class="alertList" id="alertList"><div class="skeleton"></div><div class="skeleton"></div></section>
  </main>
  <script src="/alerts.js"></script>
</body>
</html>
