<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aksjer</title>
<style>
:root{--bg:#07111f;--p:#0d1b2d;--p2:#10243a;--line:#20354d;--t:#eef5ff;--m:#91a5bd;--g:#35d49a;--y:#f3c95b;--r:#fb7185;--b:#65a9ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#112942,#07111f 45%);color:var(--t);font:14px system-ui,-apple-system,sans-serif}.app{display:flex;min-height:100vh}.side{width:235px;position:fixed;inset:0 auto 0 0;background:#081423;border-right:1px solid var(--line);padding:24px 15px;z-index:30}.logo{font-size:21px;font-weight:850;margin:0 10px 28px}.logo span{color:var(--g)}nav a{display:block;color:var(--m);padding:11px 13px;border-radius:10px;margin:4px 0;cursor:pointer}nav a.active,nav a:hover{background:var(--p2);color:#fff}.main{margin-left:235px;flex:1;min-width:0;padding:30px;max-width:1550px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}.search{background:var(--p);border:1px solid var(--line);border-radius:10px;padding:12px;color:#fff;width:300px;outline:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0 17px}.card,.section{background:rgba(13,27,45,.94);border:1px solid var(--line);border-radius:14px;padding:18px}.label,.sub{color:var(--m);font-size:12px}.value{font-size:25px;font-weight:800;margin-top:6px}.g{color:var(--g)}.y{color:var(--y)}.r{color:var(--r)}.grid{display:grid;grid-template-columns:1.35fr .85fr;gap:17px}.row{display:grid;grid-template-columns:46px minmax(190px,1.5fr) 90px 80px 74px 100px 96px 110px minmax(130px,.8fr);gap:10px;padding:13px 8px;border-top:1px solid var(--line);align-items:center}.row:not(.head){cursor:pointer}.row:not(.head):hover{background:rgba(101,169,255,.045)}.head{border:0;color:var(--m);font-size:11px}.stock .sub{display:block}.stock{font-weight:750;cursor:pointer}.stock:hover{color:var(--g)}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#0c3027;color:var(--g);font-size:11px;font-weight:750}.watch{color:var(--y);background:#30270d}.risk{color:var(--r);background:#351522}.bar{height:6px;background:#1b2b40;border-radius:8px}.fill{height:100%;background:var(--g);border-radius:8px}.signal{padding:13px 0;border-top:1px solid var(--line)}.signal:first-child{border:0}.back{color:var(--b);cursor:pointer;margin-bottom:16px}.big{font-size:44px;font-weight:850}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.metric{background:#0a1727;border:1px solid var(--line);border-radius:12px;padding:15px}.metric b{font-size:19px}.chart{height:330px;margin-top:15px;background:linear-gradient(180deg,rgba(53,212,154,.08),transparent);border-radius:10px;overflow:hidden;position:relative}.chart svg{width:100%;height:100%;display:block}.chart-tooltip{position:absolute;display:none;pointer-events:none;z-index:5;min-width:155px;padding:9px 11px;background:#07111f;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:12px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.btn{border:1px solid var(--line);background:var(--p2);color:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}.btn.active{border-color:#4d7599;background:#17324d}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}.table th{font-size:11px;color:var(--m)}.searchbox{position:relative}.searchResults{display:none;position:absolute;right:0;top:48px;width:380px;z-index:40}.result{padding:13px;border-top:1px solid var(--line);cursor:pointer}.result:hover{background:var(--p2)}.notice{padding:12px;border:1px solid var(--line);border-radius:10px;background:#0a1727;color:var(--m);margin-bottom:14px}.quote{display:flex;justify-content:space-between;align-items:center;gap:20px}.quote-price{font-size:21px;font-weight:800}.small{font-size:11px;color:var(--m)}.chartbar{display:flex;flex-wrap:wrap;gap:6px}.controls{display:flex;gap:8px;flex-wrap:wrap}.marketMeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 16px}.filter{min-height:44px}.rank{color:var(--m);font-variant-numeric:tabular-nums}.delta{font-variant-numeric:tabular-nums;font-weight:750}.marketTable{overflow-x:auto}.statusStack{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
@media(max-width:900px){.side{display:none}.main{margin:0;padding:20px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.cards,.metrics{grid-template-columns:1fr}.main{padding:16px 12px}.main>.top{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:12px!important;align-items:start!important;margin-bottom:18px}.main>.top>div:first-child{grid-column:1/-1}.main>.top .searchbox{min-width:0;width:100%}.main>.top>.nsThemeToggle{margin:0;min-width:44px;min-height:44px;justify-self:end}.search{width:100%;min-height:44px;font-size:16px}.marketTable{overflow:visible;padding:12px 10px}.marketTable .toolbar{align-items:flex-start}.marketTable .toolbar>div{min-width:0}.marketTable .toolbar>span{white-space:nowrap}.row{grid-template-columns:20px minmax(0,1fr) 68px 50px 36px;gap:6px;padding:12px 0}.row>*{min-width:0}.row .stock{overflow-wrap:anywhere}.row>:nth-child(3) .sub{font-size:10px}.row>:nth-child(4),.row>:nth-child(5){text-align:right}.main select.btn{min-height:44px}.row>:nth-child(9),.row>:nth-child(6),.row>:nth-child(7),.row>:nth-child(8){display:none}.row .stock .sub{display:block}.searchResults{width:100%}.filter{min-height:44px;padding:9px 11px}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="logo">AKSJER</div><nav id="nav"><a class="active" data-page="Dashboard">Marked</a><a href="/morning">Før børs</a></nav></aside>
<main class="main"><div class="top"><div><h1 id="title">Marked</h1><div class="sub" id="sub">Rangert marked · laster dekket univers · klikk for analyse</div></div><div class="searchbox"><input id="search" class="search" aria-label="Søk ticker eller selskap" placeholder="Søk ticker eller selskap…"><div id="searchResults" class="section searchResults"><div class="sub" style="padding:4px 10px 10px">Søkeresultater</div><div id="searchResultsList"></div></div></div></div><div id="appview"></div></main></div>
<script>
const API="";let universe=[];let earlyByTicker=new Map(),opportunityByTicker=new Map(),ipoByTicker=new Map(),marketFilter="all",marketUpdatedAt=null;let searchTimer;let searchVersion=0,marketSort="score",contextError="";
const esc=s=>String(s??"").replace(/[&<>\\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
const finite=v=>v!==null&&v!==undefined&&v!==""&&Number.isFinite(Number(v));
const list=d=>Array.isArray(d)?d:(Array.isArray(d?.items)?d.items:[]);
const num=n=>n==null?"—":Number(n).toLocaleString("no-NO",{maximumFractionDigits:2});
const badge=s=>`<span class="badge${s==="Risk"?" risk":s==="Strong"?"":" watch"}">${esc(s||"—")}</span>`;

async function get(path){const r=await fetch(API+path,{signal:AbortSignal.timeout(25000)});if(!r.ok)throw Error(path+" failed");return r.json()}
function setTitle(a,b){document.getElementById("title").textContent=a;document.getElementById("sub").textContent=b}
function supportedStock(x){const symbol=String(x.symbol||x.market_symbol||x.ticker||'').toUpperCase(),kind=String(x.quote_type||x.asset_class||'').toUpperCase(),exchange=String(x.exchange||'').toUpperCase();return (x.tracked===true||universe.some(v=>v.ticker===x.ticker)||symbol.endsWith('.OL')||['OSL','XOSL','OSLO'].includes(exchange))&&!['ETF','MUTUALFUND','FOND','FUND'].includes(kind)}
function openStock(t){location.href='/stock?ticker='+encodeURIComponent(t)}
function activeOpportunity(o){return ['EARLY_OPPORTUNITY','EARLY_OPPORTUNITY_HIGH'].includes(o?.label)}
function statusLabel(x){const opp=opportunityByTicker.get(x.ticker),early=earlyByTicker.get(x.ticker),ipo=ipoByTicker.get(x.ticker),out=[];if(activeOpportunity(opp))out.push('<span class="badge watch">Opportunity · lagret</span>');if(early?.label==='EARLY_BUILDUP')out.push('<span class="badge watch">Early · forskning</span>');if(ipo)out.push('<span class="badge watch">'+esc(ipo.display_status||'PRE-IPO')+'</span>');if(!out.length)out.push('<span class="sub">Ingen handling</span>');return '<span class="statusStack">'+out.join('')+'</span>'}
function trendText(x){const v=x.trend??x.trend_label??x.momentum_label;return v==null?"—":String(v).replaceAll("_"," ")}
function volumeText(x){const v=x.volume_ratio??x.relative_volume??x.volume_vs_20d;return finite(v)?Number(v).toLocaleString("no-NO",{maximumFractionDigits:1})+"×":"—"}
function relativeText(x){const v=x.relative_strength??x.relative_strength_20d??x.excess_return_20d;return finite(v)?(Number(v)>0?"+":"")+Number(v).toLocaleString("no-NO",{maximumFractionDigits:1})+"%":"—"}
function priceText(x){const v=x.price??x.last_price;return finite(v)?Number(v).toLocaleString("no-NO",{maximumFractionDigits:2}):"—"}
function dayText(x){const v=x.change_pct??x.day_change_pct;return finite(v)?'<span class="delta '+(Number(v)>=0?"g":"r")+'">'+(Number(v)>=0?"+":"")+Number(v).toLocaleString("no-NO",{maximumFractionDigits:2})+'%</span>':"—"}
function rows(items){return items.map((x,i)=>'<a class="row" style="color:inherit;text-decoration:none" href="/stock?ticker='+encodeURIComponent(x.ticker)+'"><span class="rank">'+(x.market_rank??i+1)+'</span><span class="stock">'+esc(x.name)+'<span class="sub">'+esc(x.ticker)+' · '+esc(x.sector||"—")+'</span></span><span title="'+esc(x.quote_as_of||'Tidspunkt ukjent')+'">'+priceText(x)+'<small class="sub"> '+esc(x.data_status||'UTILGJENGELIG')+'</small></span><span>'+dayText(x)+'</span><span class="'+(x.score>=80?"g":x.score<60?"r":"y")+'"><b>'+esc(x.score??"—")+'</b></span><span>'+esc(trendText(x))+'</span><span>'+volumeText(x)+'</span><span>'+relativeText(x)+'</span><span>'+statusLabel(x)+'</span></a>').join("")}
async function loadMarketContext(){const results=await Promise.allSettled([get('/api/early-discovery?limit=100'),get('/api/ipo-radar?limit=50'),get('/api/ipo-radar/listings?limit=100')]);const [early,ipo,registry]=results.map(r=>r.status==='fulfilled'?r.value:{items:[]});contextError=results.some(r=>r.status==='rejected')?'Noen forskningskilder er utilgjengelige.':'';earlyByTicker=new Map(list(early).map(x=>[String(x.ticker||'').toUpperCase(),x]));ipoByTicker=new Map();for(const x of list(ipo)){if(x.ticker&&x.official&&x.source_url)ipoByTicker.set(String(x.ticker).toUpperCase(),{...x,display_status:'PRE-IPO'})}for(const x of list(registry)){const age=(Date.now()-Date.parse(x.listing_date))/86400000;if(x.ticker&&x.source_url&&age>=0&&age<=90)ipoByTicker.set(String(x.ticker).toUpperCase(),{...x,display_status:'NEW'})}renderDashboard()}
async function init(){try{const s=await get('/api/market-snapshot');universe=list(s).sort((a,b)=>(b.score??-1)-(a.score??-1)||String(a.ticker).localeCompare(String(b.ticker))).map((x,i)=>({...x,market_rank:i+1}));opportunityByTicker=new Map(universe.filter(x=>x.opportunity).map(x=>[x.ticker,x.opportunity]));marketUpdatedAt=universe.map(x=>x.score_updated_at).filter(Boolean).sort().at(-1)||null;renderDashboard();loadMarketContext().catch(()=>{contextError='Forskningsdata utilgjengelig';renderDashboard()})}catch(e){appview.innerHTML='<div class="notice">Markedsdata er midlertidig utilgjengelig. Oppdater siden for å prøve igjen.</div>';console.error(e)}}
function filteredMarket(){let sorted=[...universe];if(marketFilter==='early')sorted=sorted.filter(x=>earlyByTicker.get(x.ticker)?.label==='EARLY_BUILDUP');if(marketFilter==='opportunity')sorted=sorted.filter(x=>activeOpportunity(opportunityByTicker.get(x.ticker)));if(marketFilter==='ipo')sorted=sorted.filter(x=>ipoByTicker.has(x.ticker));if(marketFilter==='owner')sorted=sorted.filter(x=>x.insider_coverage===true);return sorted.sort((a,b)=>marketSort==='name'?a.name.localeCompare(b.name,'no'):(b[marketSort]??-Infinity)-(a[marketSort]??-Infinity)||a.market_rank-b.market_rank)}

function setMarketFilter(v){marketFilter=v;renderDashboard()}
async function renderDashboard(){const updated=marketUpdatedAt?new Date(marketUpdatedAt).toLocaleTimeString("no-NO",{timeZone:"Europe/Oslo",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";setTitle("Marked",universe.length+" aksjer dekket · siste scoreobservasjon "+updated);const items=filteredMarket();appview.innerHTML='<div class="notice">Lagrede kurs- og modellobservasjoner. Early/IPO er forskning uten score-effekt. Eier/Insider viser verifiserte insideropplysninger, ikke en daglig eierfeed.</div>'+ (contextError?'<div role="status">'+esc(contextError)+'</div>':'')+'<label>Sorter <select class="btn" aria-label="Sorter marked" onchange="marketSort=this.value;renderDashboard()">'+[['score','Score'],['name','Selskap'],['change_pct','Dag']].map(([v,l])=>'<option value="'+v+'" '+(marketSort===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label><div class="marketMeta"><button class="btn filter '+(marketFilter==="all"?"active":"")+'" onclick="setMarketFilter(\'all\')">Alle</button><button class="btn filter '+(marketFilter==="early"?"active":"")+'" onclick="setMarketFilter(\'early\')">Early</button><button class="btn filter '+(marketFilter==="opportunity"?"active":"")+'" onclick="setMarketFilter(\'opportunity\')">Opportunity</button><button class="btn filter '+(marketFilter==="ipo"?"active":"")+'" onclick="setMarketFilter(\'ipo\')">Nye/IPO</button><button class="btn filter '+(marketFilter==="owner"?"active":"")+'" onclick="setMarketFilter(\'owner\')">Eier/Insider</button></div><section class="section marketTable"><div class="toolbar"><div><h2>Markedsrangering</h2><span class="sub">Høyeste score først · rangering er analysegrunnlag, ikke kjøpssignal</span></div><span class="sub">'+items.length+' vist</span></div><div class="row head"><span>#</span><span>Selskap</span><span>Kurs</span><span>Dag</span><span>Score</span><span>Trend</span><span>Volum</span><span>Rel. styrke</span><span>Status</span></div>'+(items.length?rows(items):'<div class="notice">Ingen aksjer med dokumentert dekning i dette filteret.</div>')+'</section>'}
function shortPercent(p){return p==null?'—':Number(p).toFixed(2)+'%'}
function shortElevated(p){return p!=null&&Number(p)>=3}
search.addEventListener("input",e=>{const q=e.target.value.trim(),version=++searchVersion;clearTimeout(searchTimer);if(!q){searchResults.style.display="none";return}searchTimer=setTimeout(async()=>{try{const d=await get("/api/search?q="+encodeURIComponent(q));if(version!==searchVersion)return;searchResultsList.innerHTML=list(d).filter(supportedStock).map(x=>`<a class="result" style="display:block" href="/stock?ticker=${encodeURIComponent(x.ticker||x.symbol||'')}"><strong>${esc(x.name)}</strong><div class="sub">${esc(x.ticker)} · ${esc(x.sector||"")}</div></a>`).join("")||'<div class="sub" style="padding:12px">Ingen aksjer funnet.</div>';searchResults.style.display="block"}catch(e){if(version!==searchVersion)return;searchResultsList.innerHTML='<div class="sub" style="padding:12px">Søk er utilgjengelig.</div>';searchResults.style.display="block"}},250)});
init();
</script>
</body>
</html>
