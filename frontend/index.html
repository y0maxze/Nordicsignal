<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NordicSignal</title>
<style>
:root{--bg:#07111f;--p:#0d1b2d;--p2:#10243a;--line:#20354d;--t:#eef5ff;--m:#91a5bd;--g:#35d49a;--y:#f3c95b;--r:#fb7185;--b:#65a9ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#112942,#07111f 45%);color:var(--t);font:14px system-ui,-apple-system,sans-serif}.app{display:flex;min-height:100vh}.side{width:235px;position:fixed;inset:0 auto 0 0;background:#081423;border-right:1px solid var(--line);padding:24px 15px;z-index:30}.logo{font-size:21px;font-weight:850;margin:0 10px 28px}.logo span{color:var(--g)}nav a{display:block;color:var(--m);padding:11px 13px;border-radius:10px;margin:4px 0;cursor:pointer}nav a.active,nav a:hover{background:var(--p2);color:#fff}.main{margin-left:235px;flex:1;padding:30px;max-width:1550px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}.search{background:var(--p);border:1px solid var(--line);border-radius:10px;padding:12px;color:#fff;width:300px;outline:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0 17px}.card,.section{background:rgba(13,27,45,.94);border:1px solid var(--line);border-radius:14px;padding:18px}.label,.sub{color:var(--m);font-size:12px}.value{font-size:25px;font-weight:800;margin-top:6px}.g{color:var(--g)}.y{color:var(--y)}.r{color:var(--r)}.grid{display:grid;grid-template-columns:1.35fr .85fr;gap:17px}.row{display:grid;grid-template-columns:1.4fr .6fr .8fr .6fr;gap:10px;padding:13px 0;border-top:1px solid var(--line);align-items:center}.head{border:0;color:var(--m);font-size:11px}.stock{font-weight:750;cursor:pointer}.stock:hover{color:var(--g)}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#0c3027;color:var(--g);font-size:11px;font-weight:750}.watch{color:var(--y);background:#30270d}.risk{color:var(--r);background:#351522}.bar{height:6px;background:#1b2b40;border-radius:8px}.fill{height:100%;background:var(--g);border-radius:8px}.signal{padding:13px 0;border-top:1px solid var(--line)}.signal:first-child{border:0}.back{color:var(--b);cursor:pointer;margin-bottom:16px}.big{font-size:44px;font-weight:850}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.metric{background:#0a1727;border:1px solid var(--line);border-radius:12px;padding:15px}.metric b{font-size:19px}.chart{height:330px;margin-top:15px;background:linear-gradient(180deg,rgba(53,212,154,.08),transparent);border-radius:10px;overflow:hidden;position:relative}.chart svg{width:100%;height:100%;display:block}.chart-tooltip{position:absolute;display:none;pointer-events:none;z-index:5;min-width:155px;padding:9px 11px;background:#07111f;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:12px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.btn{border:1px solid var(--line);background:var(--p2);color:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}.btn.active{border-color:#4d7599;background:#17324d}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}.table th{font-size:11px;color:var(--m)}.searchbox{position:relative}.searchResults{display:none;position:absolute;right:0;top:48px;width:380px;z-index:40}.result{padding:13px;border-top:1px solid var(--line);cursor:pointer}.result:hover{background:var(--p2)}.notice{padding:12px;border:1px solid var(--line);border-radius:10px;background:#0a1727;color:var(--m);margin-bottom:14px}.quote{display:flex;justify-content:space-between;align-items:center;gap:20px}.quote-price{font-size:21px;font-weight:800}.small{font-size:11px;color:var(--m)}.chartbar{display:flex;flex-wrap:wrap;gap:6px}.controls{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:900px){.side{display:none}.main{margin:0;padding:20px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.cards,.metrics{grid-template-columns:1fr}.top{flex-direction:column;align-items:stretch}.search{width:100%}.row{grid-template-columns:1.5fr .6fr .7fr}.row>:nth-child(3){display:none}.searchResults{width:100%}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="logo">Nordic<span>Signal</span></div><nav id="nav"><a class="active" data-page="Dashboard">Dashboard</a><a data-page="Stock Radar">Stock Radar</a><a data-page="Watchlist">Watchlist</a><a href="/frontend/holdings.html">Beholdning</a><a data-page="Insider Activity">Insider Activity</a><a data-page="Short Radar">Short Radar</a><a data-page="Markets">Markets</a></nav></aside>
<main class="main"><div class="top"><div><h1 id="title">Market Dashboard</h1><div class="sub" id="sub">Live signal-driven stock intelligence</div></div><div class="searchbox"><input id="search" class="search" placeholder="Search ticker or company…"><div id="searchResults" class="section searchResults"><div class="sub" style="padding:4px 10px 10px">Search results</div><div id="searchResultsList"></div></div></div></div><div id="appview"></div></main></div>
<script>
const API="";let universe=[];let watchlist=new Set();let searchTimer;
const esc=s=>String(s??"").replace(/[&<>\\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
const num=n=>n==null?"—":Number(n).toLocaleString("no-NO",{maximumFractionDigits:2});
const badge=s=>`<span class="badge${s==="Risk"?" risk":s==="Strong"?"":" watch"}">${esc(s||"—")}</span>`;
const coverageBadge=x=>x.live_verified?'<span class="badge">LIVE</span>':x.partial_live?'<span class="badge watch">PARTIAL LIVE</span>':'<span class="badge risk">STORED</span>';
async function get(path){const r=await fetch(API+path);if(!r.ok)throw Error(path+" failed");return r.json()}
function setTitle(a,b){document.getElementById("title").textContent=a;document.getElementById("sub").textContent=b}
function rows(items){return items.map(x=>`<div class="row"><span class="stock" onclick="showStock('${esc(x.ticker)}')">${esc(x.name)}<span class="sub">${esc(x.ticker)} · ${esc(x.sector)}</span></span><span class="${x.score>=80?'g':x.score<60?'r':'y'}">${x.score}</span><span><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,x.score))}%"></div></div></span><span>${badge(x.signal)}<div class="small" style="margin-top:5px">${coverageBadge(x)}</div></span></div>`).join("")}
async function init(){try{const [s,w]=await Promise.all([get("/api/stocks"),get("/api/watchlist")]);universe=s.items||[];watchlist=new Set((w.items||[]).map(x=>x.ticker));renderDashboard()}catch(e){appview.innerHTML='<div class="notice">API is temporarily unavailable. Refresh to retry.</div>';console.error(e)}}
async function refreshData(){appview.innerHTML='<div class="notice">Refreshing live market data for the expanded universe…</div>';try{await get("/api/refresh?all=true");const [s,w]=await Promise.all([get("/api/stocks"),get("/api/watchlist")]);universe=s.items||[];watchlist=new Set((w.items||[]).map(x=>x.ticker));renderDashboard()}catch(e){appview.innerHTML='<div class="notice">Refresh failed. Existing data is still available.</div>'}}
async function renderDashboard(){setTitle("Market Dashboard","Live signal-driven stock intelligence");let radar=[],verification=[];try{[radar,verification]=await Promise.all([get("/api/radar").then(x=>x.items||[]),get("/api/verification").then(x=>x.items||[])])}catch(e){}const live=verification.filter(x=>x.live_verified).length,partial=verification.filter(x=>x.partial_live).length,strong=universe.filter(x=>x.score>=80).length;appview.innerHTML=`<section class="cards"><div class="card"><div class="label">Stocks tracked</div><div class="value">${universe.length}</div><div class="sub">Expanded Oslo Børs universe</div></div><div class="card"><div class="label">Strong signals</div><div class="value g">${strong}</div><div class="sub">Score ≥ 80</div></div><div class="card"><div class="label">Live verified</div><div class="value g">${live}</div><div class="sub">100/100 coverage</div></div><div class="card"><div class="label">Partial live</div><div class="value y">${partial}</div><div class="sub">75/100 coverage</div></div></section><section class="section" style="margin-bottom:17px"><div class="toolbar"><div><h2 style="margin:0">Data engine</h2><div class="sub">Yahoo Finance · Finanstilsynet SSR · Euronext Oslo Børs</div></div><button class="btn" onclick="refreshData()">Refresh live data</button></div><div class="notice">Scores stay on a 0–100 scale. Coverage is shown separately, so a score such as 56/100 with 75/100 coverage is not presented as 56/75.</div></section><div class="grid"><section class="section"><div class="toolbar"><h2>Top Stock Signals</h2><span class="sub">Highest score first</span></div><div class="row head"><span>Company</span><span>Score</span><span>Strength</span><span>Signal</span></div>${rows([...universe].sort((a,b)=>b.score-a.score))}</section><section class="section"><h2>Latest Signals</h2>${radar.map(x=>`<div class="signal"><strong class="${x.strength==='risk'?'r':x.strength==='watch'?'y':'g'}">${esc(x.ticker)} · ${esc(x.event)}</strong><div class="sub">Score ${x.score}/100 · Model signal</div></div>`).join("")}</section></div>`}
async function renderRadar(){setTitle("Stock Radar","Market-wide ranking of model signals");appview.innerHTML=`<section class="section"><div class="toolbar"><div><h2>Stock Radar</h2><div class="sub">Sortable market-wide conviction ranking</div></div><div class="controls"><button class="btn active" onclick="renderRadar()">Score</button><button class="btn" onclick="renderRadarBy('fundamentals')">Fundamentals</button><button class="btn" onclick="renderRadarBy('sentiment')">Sentiment</button></div></div><div class="row head"><span>Company</span><span>Score</span><span>Strength</span><span>Signal</span></div>${rows([...universe].sort((a,b)=>b.score-a.score))}</section>`}
async function renderRadarBy(field){setTitle("Stock Radar","Market-wide ranking of model signals");const items=[...universe].sort((a,b)=>(b[field]??-1)-(a[field]??-1));appview.innerHTML=`<section class="section"><div class="toolbar"><h2>Stock Radar · ${esc(field)}</h2><button class="btn" onclick="renderRadar()">Overall score</button></div><div class="row head"><span>Company</span><span>Component</span><span>Score</span><span>Coverage</span></div>${items.map(x=>`<div class="row"><span class="stock" onclick="showStock('${esc(x.ticker)}')">${esc(x.name)}<span class="sub">${esc(x.ticker)}</span></span><span>${x[field]??'—'}</span><span>${x.score}/100</span><span>${coverageBadge(x)}</span></div>`).join("")}</section>`}
async function renderWatchlist(){setTitle("Watchlist","Saved companies and score changes");const items=universe.filter(x=>watchlist.has(x.ticker));appview.innerHTML=`<section class="section"><div class="toolbar"><h2>Watchlist</h2><span class="sub">${items.length} saved</span></div>${items.length?items.map(x=>`<div class="row"><span class="stock" onclick="showStock('${esc(x.ticker)}')">${esc(x.name)}<span class="sub">${esc(x.ticker)} · ${esc(x.sector)}</span></span><span class="${x.score>=80?'g':x.score<60?'r':'y'}">${x.score}</span><span>${badge(x.signal)}</span><button class="btn" onclick="toggleWatch('${esc(x.ticker)}')">Remove</button></div>`).join(""):'<div class="notice">No stocks saved yet. Open a stock and add it to your watchlist.</div>'}</section>`}
async function renderInsider(){setTitle("Insider Activity","Recent primary-insider disclosures from Euronext Oslo Børs");appview.innerHTML='<section class="section"><h2>Insider Activity</h2><div class="notice">Loading live regulatory disclosures…</div><div id="insiderTable"></div></section>';const out=[];for(const x of universe){try{out.push({x,d:await get("/api/insider/"+encodeURIComponent(x.ticker))})}catch{out.push({x,d:{items:[],status:"unavailable"}})}}insiderTable.innerHTML=`<table class="table"><thead><tr><th>Company</th><th>Latest disclosure</th><th>Direction</th><th>Source</th></tr></thead><tbody>${out.map(o=>{const d=o.d||{},item=(d.items||[])[0];return `<tr><td><strong class="stock" onclick="showStock('${esc(o.x.ticker)}')">${esc(o.x.name)}</strong><div class="sub">${esc(o.x.ticker)}</div></td><td>${item?esc(item.title||"Primary insider disclosure"):'No recent public disclosure found'}</td><td class="${d.signal==='buying'?'g':d.signal==='selling'?'r':'y'}">${esc(d.signal||'unavailable')}</td><td><span class="small">${esc(d.source||'Unavailable')}</span></td></tr>`}).join("")}</tbody></table>`}
async function renderShort(){setTitle("Short Radar","Public net short positions from Finanstilsynet");appview.innerHTML='<section class="section"><h2>Short Radar</h2><div class="notice">Loading the official Short Sale Register…</div><div id="shortTable"></div></section>';const out=[];for(const x of universe){try{out.push({x,d:await get("/api/short/"+encodeURIComponent(x.ticker))})}catch{out.push({x,d:{status:"unavailable"}})}}shortTable.innerHTML=`<table class="table"><thead><tr><th>Company</th><th>Short % float</th><th>Short shares</th><th>Pressure</th><th>Latest</th></tr></thead><tbody>${out.map(o=>{const d=o.d||{},p=d.short_percent_float,pressure=p==null?"No public position":Number(p)>=3?"High":Number(p)>=1?"Elevated":"Low";return `<tr><td><strong class="stock" onclick="showStock('${esc(o.x.ticker)}')">${esc(o.x.name)}</strong><div class="sub">${esc(o.x.ticker)}</div></td><td>${p==null?'—':Number(p).toFixed(2)+'%'}</td><td>${d.shares==null?'—':Number(d.shares).toLocaleString('no-NO')}</td><td class="${pressure==='High'?'r':pressure==='Low'?'g':'y'}">${pressure}</td><td>${esc(d.latest_date||'—')}</td></tr>`}).join("")}</tbody></table>`}
async function renderMarkets(){setTitle("Markets","Sector overview and model strength");let items=[];try{items=(await get("/api/markets")).items||[]}catch(e){}appview.innerHTML=`<section class="section"><div class="toolbar"><h2>Sector Overview</h2><span class="sub">Average NordicSignal score</span></div><table class="table"><thead><tr><th>Sector</th><th>Stocks</th><th>Average score</th><th>Strength</th></tr></thead><tbody>${items.map(x=>`<tr><td><strong>${esc(x.sector)}</strong></td><td>${x.count}</td><td class="${x.avg_score>=80?'g':x.avg_score>=60?'y':'r'}">${x.avg_score}</td><td>${x.avg_score>=80?'Strong':x.avg_score>=70?'Watch':x.avg_score>=60?'Neutral':'Risk'}</td></tr>`).join("")}</tbody></table></section>`}
function chartSvg(items){if(!items.length)return '<div class="notice">No historical data available for this period.</div>';const vals=items.map(x=>Number(x.close)).filter(Number.isFinite),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1,w=1000,h=300,p=25,points=items.filter(x=>Number.isFinite(Number(x.close))),pts=points.map((x,i)=>`${p+(i/Math.max(1,points.length-1))*(w-2*p)},${h-p-((Number(x.close)-min)/span)*(h-2*p)}`).join(" ");return `<svg id="priceSvg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" data-min="${min}" data-max="${max}"><polyline fill="none" stroke="var(--g)" stroke-width="3" points="${pts}"/><line id="crosshair" x1="0" x2="0" y1="0" y2="${h}" stroke="var(--m)" stroke-width="1" stroke-dasharray="4 4" opacity="0"/><circle id="dot" r="5" fill="var(--g)" opacity="0"/></svg><div id="tooltip" class="chart-tooltip"></div>`}
function bindChart(items){const box=document.getElementById("chart"),svg=document.getElementById("priceSvg"),tip=document.getElementById("tooltip");if(!svg)return;const cross=document.getElementById("crosshair"),dot=document.getElementById("dot"),points=items.filter(x=>Number.isFinite(Number(x.close)));box.onmousemove=e=>{if(!points.length)return;const r=svg.getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),idx=Math.round(ratio*(points.length-1)),x=points[idx],sx=25+(idx/Math.max(1,points.length-1))*950,min=Number(svg.dataset.min),max=Number(svg.dataset.max),sy=275-((Number(x.close)-min)/(max-min||1))*250;cross.setAttribute("x1",sx);cross.setAttribute("x2",sx);cross.setAttribute("opacity",".65");dot.setAttribute("cx",sx);dot.setAttribute("cy",sy);dot.setAttribute("opacity","1");tip.style.display="block";tip.style.left=Math.min(box.clientWidth-175,Math.max(8,e.clientX-r.left+12))+"px";tip.style.top=Math.max(8,e.clientY-r.top-75)+"px";tip.innerHTML=`<strong>${num(x.close)} NOK</strong><br><span class="small">${new Date(x.timestamp*1000).toLocaleString("no-NO")}</span><br><span class="small">Volum: ${x.volume==null?'—':Number(x.volume).toLocaleString('no-NO')}</span>`};box.onmouseleave=()=>{tip.style.display="none";cross.setAttribute("opacity","0");dot.setAttribute("opacity","0")}}
async function loadChart(t,p){const c=document.getElementById("chart");c.innerHTML='<div class="notice">Loading price history…</div>';try{const d=await get("/api/history/"+encodeURIComponent(t)+"?period="+encodeURIComponent(p));c.innerHTML=chartSvg(d.items||[]);bindChart(d.items||[])}catch(e){c.innerHTML='<div class="notice">Price history unavailable.</div>'}}
async function showStock(t){const x=universe.find(a=>a.ticker===t);if(!x)return;setTitle(x.name,"Stock intelligence · "+x.ticker);appview.innerHTML=`<section class="section"><div class="back" onclick="renderDashboard()">← Back to dashboard</div><div class="toolbar"><div><h1>${esc(x.name)}</h1><div class="sub">${esc(x.ticker)} · ${esc(x.sector)} · Oslo Børs</div></div><div style="text-align:right"><div class="big ${x.score>=80?'g':x.score<60?'r':'y'}">${x.score}</div><div class="sub">/100</div></div></div><div id="quoteBox" class="notice">Loading live quote…</div><div class="toolbar" style="margin-top:15px;margin-bottom:0"><strong>Price history</strong><div class="chartbar" id="periods">${[['now','Nå'],['1d','Dag'],['1w','Uke'],['1m','Måned'],['3m','3 mnd'],['6m','6 mnd'],['1y','År'],['5y','5 år'],['10y','10 år'],['max','Max']].map((p,i)=>`<button class="btn ${i===6?'active':''}" onclick="selectPeriod('${esc(x.ticker)}','${p[0]}',this)">${p[1]}</button>`).join("")}</div></div><div id="chart" class="chart"></div><div class="metrics"><div class="metric"><div class="label">Fundamentals</div><b>${x.fundamentals}/40</b></div><div class="metric"><div class="label">Insider</div><b>${x.insider==null?'—':x.insider+'/25'}</b></div><div class="metric"><div class="label">Valuation</div><b>${x.valuation}/20</b></div><div class="metric"><div class="label">Sentiment</div><b>${x.sentiment}/15</b></div></div><div style="margin-top:18px"><button class="btn" onclick="toggleWatch('${esc(x.ticker)}')">${watchlist.has(x.ticker)?'Remove from watchlist':'Add to watchlist'}</button></div><div id="scoreAnalysis"></div></section>`;try{const q=await get("/api/quote/"+encodeURIComponent(t));quoteBox.innerHTML=`<div class="quote"><div><div class="quote-price">${num(q.price)} ${esc(q.currency||"NOK")}</div><div class="small">Volume ${q.volume==null?'—':Number(q.volume).toLocaleString('no-NO')} · ${esc(q.source||'Market data')}</div></div><div class="${q.change_pct>=0?'g':'r'}">${q.change_pct==null?'—':(q.change_pct>=0?'+':'')+Number(q.change_pct).toFixed(2)+'%'}</div></div>`}catch(e){quoteBox.textContent="Live quote unavailable."}loadChart(x.ticker,"1y")}
async function selectPeriod(t,p,el){document.querySelectorAll("#periods .btn").forEach(b=>b.classList.remove("active"));el.classList.add("active");loadChart(t,p)}
async function toggleWatch(t){try{if(watchlist.has(t)){await fetch(API+"/api/watchlist/"+encodeURIComponent(t),{method:"DELETE"});watchlist.delete(t)}else{await fetch(API+"/api/watchlist/"+encodeURIComponent(t),{method:"POST"});watchlist.add(t)}}catch(e){console.error(e)}if(document.getElementById("title").textContent==="Watchlist")renderWatchlist();else if(document.getElementById("appview").querySelector(".back"))showStock(t)}
nav.addEventListener("click",e=>{const a=e.target.closest("a");if(!a)return;if(a.getAttribute('href'))return;document.querySelectorAll("#nav a").forEach(x=>x.classList.remove("active"));a.classList.add("active");const p=a.dataset.page;if(p==="Dashboard")renderDashboard();else if(p==="Stock Radar")renderRadar();else if(p==="Watchlist")renderWatchlist();else if(p==="Insider Activity")renderInsider();else if(p==="Short Radar")renderShort();else renderMarkets()});
search.addEventListener("input",e=>{const q=e.target.value.trim();clearTimeout(searchTimer);if(!q){searchResults.style.display="none";return}searchTimer=setTimeout(async()=>{try{const d=await get("/api/search?q="+encodeURIComponent(q));searchResultsList.innerHTML=(d.items||[]).map(x=>`<div class="result" onclick="searchResults.style.display='none';showStock('${esc(x.ticker)}')"><strong>${esc(x.name)}</strong><div class="sub">${esc(x.ticker)} · ${esc(x.sector||"")}</div></div>`).join("")||'<div class="sub" style="padding:12px">No stocks found.</div>';searchResults.style.display="block"}catch(e){searchResultsList.innerHTML='<div class="sub" style="padding:12px">Search unavailable.</div>';searchResults.style.display="block"}},250)});
init();
</script>
<script src="/frontend/analysis.js"></script>
</body>
</html>
