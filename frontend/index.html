<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aksjer</title>
<style>
:root{--bg:#07111f;--p:#0d1b2d;--p2:#10243a;--line:#20354d;--t:#eef5ff;--m:#91a5bd;--g:#35d49a;--y:#f3c95b;--r:#fb7185;--b:#65a9ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#112942,#07111f 45%);color:var(--t);font:14px system-ui,-apple-system,sans-serif}.app{display:flex;min-height:100vh}.side{width:235px;position:fixed;inset:0 auto 0 0;background:#081423;border-right:1px solid var(--line);padding:24px 15px;z-index:30}.logo{font-size:21px;font-weight:850;margin:0 10px 28px}.logo span{color:var(--g)}nav a{display:block;color:var(--m);padding:11px 13px;border-radius:10px;margin:4px 0;cursor:pointer}nav a.active,nav a:hover{background:var(--p2);color:#fff}.main{margin-left:235px;flex:1;padding:30px;max-width:1550px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}.search{background:var(--p);border:1px solid var(--line);border-radius:10px;padding:12px;color:#fff;width:300px;outline:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0 17px}.card,.section{background:rgba(13,27,45,.94);border:1px solid var(--line);border-radius:14px;padding:18px}.label,.sub{color:var(--m);font-size:12px}.value{font-size:25px;font-weight:800;margin-top:6px}.g{color:var(--g)}.y{color:var(--y)}.r{color:var(--r)}.grid{display:grid;grid-template-columns:1.35fr .85fr;gap:17px}.row{display:grid;grid-template-columns:46px minmax(190px,1.5fr) 90px 80px 74px 100px 96px 110px minmax(130px,.8fr);gap:10px;padding:13px 8px;border-top:1px solid var(--line);align-items:center}.row:not(.head){cursor:pointer}.row:not(.head):hover{background:rgba(101,169,255,.045)}.head{border:0;color:var(--m);font-size:11px}.stock{font-weight:750;cursor:pointer}.stock:hover{color:var(--g)}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#0c3027;color:var(--g);font-size:11px;font-weight:750}.watch{color:var(--y);background:#30270d}.risk{color:var(--r);background:#351522}.bar{height:6px;background:#1b2b40;border-radius:8px}.fill{height:100%;background:var(--g);border-radius:8px}.signal{padding:13px 0;border-top:1px solid var(--line)}.signal:first-child{border:0}.back{color:var(--b);cursor:pointer;margin-bottom:16px}.big{font-size:44px;font-weight:850}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.metric{background:#0a1727;border:1px solid var(--line);border-radius:12px;padding:15px}.metric b{font-size:19px}.chart{height:330px;margin-top:15px;background:linear-gradient(180deg,rgba(53,212,154,.08),transparent);border-radius:10px;overflow:hidden;position:relative}.chart svg{width:100%;height:100%;display:block}.chart-tooltip{position:absolute;display:none;pointer-events:none;z-index:5;min-width:155px;padding:9px 11px;background:#07111f;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:12px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.btn{border:1px solid var(--line);background:var(--p2);color:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}.btn.active{border-color:#4d7599;background:#17324d}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}.table th{font-size:11px;color:var(--m)}.searchbox{position:relative}.searchResults{display:none;position:absolute;right:0;top:48px;width:380px;z-index:40}.result{padding:13px;border-top:1px solid var(--line);cursor:pointer}.result:hover{background:var(--p2)}.notice{padding:12px;border:1px solid var(--line);border-radius:10px;background:#0a1727;color:var(--m);margin-bottom:14px}.quote{display:flex;justify-content:space-between;align-items:center;gap:20px}.quote-price{font-size:21px;font-weight:800}.small{font-size:11px;color:var(--m)}.chartbar{display:flex;flex-wrap:wrap;gap:6px}.controls{display:flex;gap:8px;flex-wrap:wrap}.marketMeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 16px}.filter{min-height:40px}.rank{color:var(--m);font-variant-numeric:tabular-nums}.delta{font-variant-numeric:tabular-nums;font-weight:750}.marketTable{overflow-x:auto}.statusStack{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
@media(max-width:900px){.side{display:none}.main{margin:0;padding:20px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.cards,.metrics{grid-template-columns:1fr}.top{flex-direction:column;align-items:stretch}.search{width:100%}.marketTable{overflow:visible}.row{grid-template-columns:34px minmax(0,1fr) 62px 86px;padding:12px 2px}.row>:nth-child(3),.row>:nth-child(4),.row>:nth-child(6),.row>:nth-child(7),.row>:nth-child(8){display:none}.row .stock .sub{display:block}.searchResults{width:100%}.filter{min-height:44px;padding:9px 11px}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="logo">AKSJER</div><nav id="nav"><a class="active" data-page="Dashboard">Marked</a><a href="/morning">Før børs</a></nav></aside>
<main class="main"><div class="top"><div><h1 id="title">Marked</h1><div class="sub" id="sub">Rangert marked · ${universe.length} dekkede aksjer · klikk for analyse</div></div><div class="searchbox"><input id="search" class="search" placeholder="Søk ticker eller selskap…"><div id="searchResults" class="section searchResults"><div class="sub" style="padding:4px 10px 10px">Søkeresultater</div><div id="searchResultsList"></div></div></div></div><div id="appview"></div></main></div>
<script>
const API="";let universe=[];let watchlist=new Set();let earlyByTicker=new Map(),opportunityByTicker=new Map(),ipoByTicker=new Map(),marketFilter="all",marketUpdatedAt=null;let searchTimer;
const esc=s=>String(s??"").replace(/[&<>\\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
const num=n=>n==null?"—":Number(n).toLocaleString("no-NO",{maximumFractionDigits:2});
const badge=s=>`<span class="badge${s==="Risk"?" risk":s==="Strong"?"":" watch"}">${esc(s||"—")}</span>`;
const coverageBadge=x=>x.live_verified?'<span class="badge">LIVE</span>':x.partial_live?'<span class="badge watch">PARTIAL LIVE</span>':'<span class="badge risk">STORED</span>';
async function get(path){const r=await fetch(API+path);if(!r.ok)throw Error(path+" failed");return r.json()}
function setTitle(a,b){document.getElementById("title").textContent=a;document.getElementById("sub").textContent=b}
function openStock(t){location.href='/stock?ticker='+encodeURIComponent(t)}
function statusLabel(x){const opp=opportunityByTicker.get(x.ticker),early=earlyByTicker.get(x.ticker),ipo=ipoByTicker.get(x.ticker);const out=[];if(opp&&opp.label&&opp.label!=="NO_OPPORTUNITY")out.push('<span class="badge">OPPORTUNITY</span>');if(early&&early.label==="EARLY_BUILDUP")out.push('<span class="badge watch">EARLY</span>');if(ipo)out.push('<span class="badge watch">'+esc(ipo.status==="pre_ipo"?"PRE-IPO":"NEW")+'</span>');if(!out.length)out.push(badge(x.signal));return '<span class="statusStack">'+out.join("")+'</span>'}
function trendText(x){const v=x.trend??x.trend_label??x.momentum_label;return v==null?"—":String(v).replaceAll("_"," ")}
function volumeText(x){const v=x.volume_ratio??x.relative_volume??x.volume_vs_20d;return Number.isFinite(Number(v))?Number(v).toLocaleString("no-NO",{maximumFractionDigits:1})+"×":"—"}
function relativeText(x){const v=x.relative_strength??x.relative_strength_20d??x.excess_return_20d;return Number.isFinite(Number(v))?(Number(v)>0?"+":"")+Number(v).toLocaleString("no-NO",{maximumFractionDigits:1})+"%":"—"}
function priceText(x){const v=x.price??x.last_price;return Number.isFinite(Number(v))?Number(v).toLocaleString("no-NO",{maximumFractionDigits:2}):"—"}
function dayText(x){const v=x.change_pct??x.day_change_pct;return Number.isFinite(Number(v))?'<span class="delta '+(Number(v)>=0?"g":"r")+'">'+(Number(v)>=0?"+":"")+Number(v).toLocaleString("no-NO",{maximumFractionDigits:2})+'%</span>':"—"}
function rows(items){return items.slice(0,100).map((x,i)=>'<div class="row" role="link" tabindex="0" onclick="openStock(\''+esc(x.ticker)+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openStock(\''+esc(x.ticker)+'\')}"><span class="rank">'+(i+1)+'</span><span class="stock">'+esc(x.name)+'<span class="sub">'+esc(x.ticker)+' · '+esc(x.sector||"—")+'</span></span><span>'+priceText(x)+'</span><span>'+dayText(x)+'</span><span class="'+(x.score>=80?"g":x.score<60?"r":"y")+'"><b>'+esc(x.score??"—")+'</b></span><span>'+esc(trendText(x))+'</span><span>'+volumeText(x)+'</span><span>'+relativeText(x)+'</span><span>'+statusLabel(x)+'</span></div>').join("")}
async function loadMarketContext(){const jobs=[get("/api/early-discovery?limit=100").catch(()=>({items:[]})),get("/api/ipo-radar?limit=50").catch(()=>({items:[]}))];const [early,ipo]=await Promise.all(jobs);earlyByTicker=new Map((early.items||[]).map(x=>[String(x.ticker||"").toUpperCase(),x]));ipoByTicker=new Map((ipo.items||[]).filter(x=>x.ticker).map(x=>[String(x.ticker).toUpperCase(),x]));marketUpdatedAt=early.generated_at||ipo.generated_at||new Date().toISOString()}
async function loadOpportunities(items){const shortlist=[...items].sort((a,b)=>(b.score??0)-(a.score??0)).slice(0,30);const out=await Promise.all(shortlist.map(x=>get("/api/opportunity/"+encodeURIComponent(x.ticker)).catch(()=>null)));opportunityByTicker=new Map(out.filter(Boolean).map(x=>[String(x.ticker||"").toUpperCase(),x.opportunity||{}]))}
async function init(){try{const [s,w]=await Promise.all([get("/api/stocks"),get("/api/watchlist")]);universe=s.items||[];watchlist=new Set((w.items||[]).map(x=>x.ticker));await loadMarketContext();renderDashboard();loadOpportunities(universe).then(()=>renderDashboard()).catch(()=>{})}catch(e){appview.innerHTML='<div class="notice">Markedsdata er midlertidig utilgjengelig. Oppdater siden for å prøve igjen.</div>';console.error(e)}}
async function refreshData(){appview.innerHTML='<div class="notice">Refreshing live market data for the expanded universe…</div>';try{await get("/api/refresh?all=true");const [s,w]=await Promise.all([get("/api/stocks"),get("/api/watchlist")]);universe=s.items||[];watchlist=new Set((w.items||[]).map(x=>x.ticker));renderDashboard()}catch(e){appview.innerHTML='<div class="notice">Refresh failed. Existing data is still available.</div>'}}
function filteredMarket(){const sorted=[...universe].sort((a,b)=>(b.score??-1)-(a.score??-1));if(marketFilter==="early")return sorted.filter(x=>earlyByTicker.get(x.ticker)?.label==="EARLY_BUILDUP");if(marketFilter==="opportunity")return sorted.filter(x=>{const l=opportunityByTicker.get(x.ticker)?.label;return l&&l!=="NO_OPPORTUNITY"});if(marketFilter==="ipo")return sorted.filter(x=>ipoByTicker.has(x.ticker));if(marketFilter==="owner")return sorted.filter(x=>x.insider!=null||x.insider_signal||x.ownership_status==="available");return sorted}
function setMarketFilter(v){marketFilter=v;renderDashboard()}
async function renderDashboard(){const updated=marketUpdatedAt?new Date(marketUpdatedAt).toLocaleTimeString("no-NO",{hour:"2-digit",minute:"2-digit"}):"—";setTitle("Marked",universe.length+" aksjer dekket · oppdatert "+updated);const items=filteredMarket();appview.innerHTML='<div class="marketMeta"><button class="btn filter '+(marketFilter==="all"?"active":"")+'" onclick="setMarketFilter(\'all\')">Alle</button><button class="btn filter '+(marketFilter==="early"?"active":"")+'" onclick="setMarketFilter(\'early\')">Early</button><button class="btn filter '+(marketFilter==="opportunity"?"active":"")+'" onclick="setMarketFilter(\'opportunity\')">Opportunity</button><button class="btn filter '+(marketFilter==="ipo"?"active":"")+'" onclick="setMarketFilter(\'ipo\')">Nye/IPO</button><button class="btn filter '+(marketFilter==="owner"?"active":"")+'" onclick="setMarketFilter(\'owner\')">Eier/Insider</button></div><section class="section marketTable"><div class="toolbar"><div><h2>Markedsrangering</h2><span class="sub">Høyeste score først · rangering er analysegrunnlag, ikke kjøpssignal</span></div><span class="sub">'+items.length+' vist</span></div><div class="row head"><span>#</span><span>Selskap</span><span>Kurs</span><span>Dag</span><span>Score</span><span>Trend</span><span>Volum</span><span>Rel. styrke</span><span>Status</span></div>'+rows(items)+'</section>'}
async function renderRadar(){setTitle("Stock Radar","Market-wide ranking of model signals");appview.innerHTML=`<section class="section"><div class="toolbar"><div><h2>Stock Radar</h2><div class="sub">Sortable market-wide conviction ranking</div></div><div class="controls"><button class="btn active" onclick="renderRadar()">Score</button><button class="btn" onclick="renderRadarBy('fundamentals')">Fundamentals</button><button class="btn" onclick="renderRadarBy('sentiment')">Sentiment</button></div></div><div class="row head"><span>Company</span><span>Score</span><span>Strength</span><span>Signal</span></div>${rows([...universe].sort((a,b)=>b.score-a.score))}</section>`}
async function renderRadarBy(field){setTitle("Stock Radar","Market-wide ranking of model signals");const items=[...universe].sort((a,b)=>(b[field]??-1)-(a[field]??-1));appview.innerHTML=`<section class="section"><div class="toolbar"><h2>Stock Radar · ${esc(field)}</h2><button class="btn" onclick="renderRadar()">Overall score</button></div><div class="row head"><span>Company</span><span>Component</span><span>Score</span><span>Coverage</span></div>${items.map(x=>`<div class="row"><span class="stock" onclick="openStock('${esc(x.ticker)}')">${esc(x.name)}<span class="sub">${esc(x.ticker)}</span></span><span>${x[field]??'—'}</span><span>${x.score}/100</span><span>${coverageBadge(x)}</span></div>`).join("")}</section>`}
async function renderWatchlist(){setTitle("Watchlist","Saved companies and score changes");const items=universe.filter(x=>watchlist.has(x.ticker));appview.innerHTML=`<section class="section"><div class="toolbar"><h2>Watchlist</h2><span class="sub">${items.length} saved</span></div>${items.length?items.map(x=>`<div class="row"><span class="stock" onclick="showStock('${esc(x.ticker)}')">${esc(x.name)}<span class="sub">${esc(x.ticker)} · ${esc(x.sector)}</span></span><span class="${x.score>=80?'g':x.score<60?'r':'y'}">${x.score}</span><span>${badge(x.signal)}</span><button class="btn" onclick="toggleWatch('${esc(x.ticker)}')">Remove</button></div>`).join(""):'<div class="notice">No stocks saved yet. Open a stock and add it to your watchlist.</div>'}</section>`}
async function renderInsider(){setTitle("Insider Activity","Recent primary-insider disclosures from Euronext Oslo Børs");appview.innerHTML='<section class="section"><h2>Insider Activity</h2><div class="notice">Loading live regulatory disclosures…</div><div id="insiderTable"></div></section>';const out=[];for(const x of universe){try{out.push({x,d:await get("/api/insider/"+encodeURIComponent(x.ticker))})}catch{out.push({x,d:{items:[],status:"unavailable"}})}}insiderTable.innerHTML=`<table class="table"><thead><tr><th>Company</th><th>Latest disclosure</th><th>Direction</th><th>Source</th></tr></thead><tbody>${out.map(o=>{const d=o.d||{},item=(d.items||[])[0];return `<tr><td><strong class="stock" onclick="showStock('${esc(o.x.ticker)}')">${esc(o.x.name)}</strong><div class="sub">${esc(o.x.ticker)}</div></td><td>${item?esc(item.title||"Primary insider disclosure"):'No recent public disclosure found'}</td><td class="${d.signal==='buying'?'g':d.signal==='selling'?'r':'y'}">${esc(d.signal||'unavailable')}</td><td><span class="small">${esc(d.source||'Unavailable')}</span></td></tr>`}).join("")}</tbody></table>`}
async function renderShort(){setTitle("Short Radar","Public net short positions from Finanstilsynet");appview.innerHTML='<section class="section"><h2>Short Radar</h2><div class="notice">Loading the official Short Sale Register…</div><div id="shortTable"></div></section>';const out=[];for(const x of universe){try{out.push({x,d:await get("/api/short/"+encodeURIComponent(x.ticker))})}catch{out.push({x,d:{status:"unavailable"}})}}shortTable.innerHTML=`<table class="table"><thead><tr><th>Company</th><th>Short % float</th><th>Short shares</th><th>Pressure</th><th>Latest</th></tr></thead><tbody>${out.map(o=>{const d=o.d||{},p=d.short_percent_float,pressure=p==null?"No public position":Number(p)>=3?"High":Number(p)>=1?"Elevated":"Low";return `<tr><td><strong class="stock" onclick="showStock('${esc(o.x.ticker)}')">${esc(o.x.name)}</strong><div class="sub">${esc(o.x.ticker)}</div></td><td>${p==null?'—':Number(p).toFixed(2)+'%'}</td><td>${d.shares==null?'—':Number(d.shares).toLocaleString('no-NO')}</td><td class="${pressure==='High'?'r':pressure==='Low'?'g':'y'}">${pressure}</td><td>${esc(d.latest_date||'—')}</td></tr>`}).join("")}</tbody></table>`}
async function renderMarkets(){setTitle("Markets","Sector overview and model strength");let items=[];try{items=(await get("/api/markets")).items||[]}catch(e){}appview.innerHTML=`<section class="section"><div class="toolbar"><h2>Sector Overview</h2><span class="sub">Average NordicSignal score</span></div><table class="table"><thead><tr><th>Sector</th><th>Stocks</th><th>Average score</th><th>Strength</th></tr></thead><tbody>${items.map(x=>`<tr><td><strong>${esc(x.sector)}</strong></td><td>${x.count}</td><td class="${x.avg_score>=80?'g':x.avg_score>=60?'y':'r'}">${x.avg_score}</td><td>${x.avg_score>=80?'Strong':x.avg_score>=70?'Watch':x.avg_score>=60?'Neutral':'Risk'}</td></tr>`).join("")}</tbody></table></section>`}
function chartSvg(items){if(!items.length)return '<div class="notice">No historical data available for this period.</div>';const vals=items.map(x=>Number(x.close)).filter(Number.isFinite),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1,w=1000,h=300,p=25,points=items.filter(x=>Number.isFinite(Number(x.close))),pts=points.map((x,i)=>`${p+(i/Math.max(1,points.length-1))*(w-2*p)},${h-p-((Number(x.close)-min)/span)*(h-2*p)}`).join(" ");return `<svg id="priceSvg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" data-min="${min}" data-max="${max}"><polyline fill="none" stroke="var(--g)" stroke-width="3" points="${pts}"/><line id="crosshair" x1="0" x2="0" y1="0" y2="${h}" stroke="var(--m)" stroke-width="1" stroke-dasharray="4 4" opacity="0"/><circle id="dot" r="5" fill="var(--g)" opacity="0"/></svg><div id="tooltip" class="chart-tooltip"></div>`}
function bindChart(items){const box=document.getElementById("chart"),svg=document.getElementById("priceSvg"),tip=document.getElementById("tooltip");if(!svg)return;const cross=document.getElementById("crosshair"),dot=document.getElementById("dot"),points=items.filter(x=>Number.isFinite(Number(x.close)));box.onmousemove=e=>{if(!points.length)return;const r=svg.getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),idx=Math.round(ratio*(points.length-1)),x=points[idx],sx=25+(idx/Math.max(1,points.length-1))*950,min=Number(svg.dataset.min),max=Number(svg.dataset.max),sy=275-((Number(x.close)-min)/(max-min||1))*250;cross.setAttribute("x1",sx);cross.setAttribute("x2",sx);cross.setAttribute("opacity",".65");dot.setAttribute("cx",sx);dot.setAttribute("cy",sy);dot.setAttribute("opacity","1");tip.style.display="block";tip.style.left=Math.min(box.clientWidth-175,Math.max(8,e.clientX-r.left+12))+"px";tip.style.top=Math.max(8,e.clientY-r.top-75)+"px";tip.innerHTML=`<strong>${num(x.close)} NOK</strong><br><span class="small">${new Date(x.timestamp*1000).toLocaleString("no-NO")}</span><br><span class="small">Volum: ${x.volume==null?'—':Number(x.volume).toLocaleString('no-NO')}</span>`};box.onmouseleave=()=>{tip.style.display="none";cross.setAttribute("opacity","0");dot.setAttribute("opacity","0")}}
async function loadChart(t,p){const c=document.getElementById("chart");c.innerHTML='<div class="notice">Loading price history…</div>';try{const d=await get("/api/history/"+encodeURIComponent(t)+"?period="+encodeURIComponent(p));c.innerHTML=chartSvg(d.items||[]);bindChart(d.items||[])}catch(e){c.innerHTML='<div class="notice">Price history unavailable.</div>'}}
async function openStock(t){const x=universe.find(a=>a.ticker===t);if(!x)return;setTitle(x.name,"Stock intelligence · "+x.ticker);appview.innerHTML=`<section class="section"><div class="back" onclick="renderDashboard()">← Back to dashboard</div><div class="toolbar"><div><h1>${esc(x.name)}</h1><div class="sub">${esc(x.ticker)} · ${esc(x.sector)} · Oslo Børs</div></div><div style="text-align:right"><div class="big ${x.score>=80?'g':x.score<60?'r':'y'}">${x.score}</div><div class="sub">/100</div></div></div><div id="quoteBox" class="notice">Loading live quote…</div><div class="toolbar" style="margin-top:15px;margin-bottom:0"><strong>Price history</strong><div class="chartbar" id="periods">${[['now','Nå'],['1d','Dag'],['1w','Uke'],['1m','Måned'],['3m','3 mnd'],['6m','6 mnd'],['1y','År'],['5y','5 år'],['10y','10 år'],['max','Max']].map((p,i)=>`<button class="btn ${i===6?'active':''}" onclick="selectPeriod('${esc(x.ticker)}','${p[0]}',this)">${p[1]}</button>`).join("")}</div></div><div id="chart" class="chart"></div><div class="metrics"><div class="metric"><div class="label">Fundamentals</div><b>${x.fundamentals}/40</b></div><div class="metric"><div class="label">Insider</div><b>${x.insider==null?'—':x.insider+'/25'}</b></div><div class="metric"><div class="label">Valuation</div><b>${x.valuation}/20</b></div><div class="metric"><div class="label">Sentiment</div><b>${x.sentiment}/15</b></div></div><div style="margin-top:18px"><button class="btn" onclick="toggleWatch('${esc(x.ticker)}')">${watchlist.has(x.ticker)?'Remove from watchlist':'Add to watchlist'}</button></div><div id="scoreAnalysis"></div></section>`;try{const q=await get("/api/quote/"+encodeURIComponent(t));quoteBox.innerHTML=`<div class="quote"><div><div class="quote-price">${num(q.price)} ${esc(q.currency||"NOK")}</div><div class="small">Volume ${q.volume==null?'—':Number(q.volume).toLocaleString('no-NO')} · ${esc(q.source||'Market data')}</div></div><div class="${q.change_pct>=0?'g':'r'}">${q.change_pct==null?'—':(q.change_pct>=0?'+':'')+Number(q.change_pct).toFixed(2)+'%'}</div></div>`}catch(e){quoteBox.textContent="Live quote unavailable."}loadChart(x.ticker,"1y")}
async function selectPeriod(t,p,el){document.querySelectorAll("#periods .btn").forEach(b=>b.classList.remove("active"));el.classList.add("active");loadChart(t,p)}
async function toggleWatch(t){try{if(watchlist.has(t)){await fetch(API+"/api/watchlist/"+encodeURIComponent(t),{method:"DELETE"});watchlist.delete(t)}else{await fetch(API+"/api/watchlist/"+encodeURIComponent(t),{method:"POST"});watchlist.add(t)}}catch(e){console.error(e)}if(document.getElementById("title").textContent==="Watchlist")renderWatchlist();else if(document.getElementById("appview").querySelector(".back"))showStock(t)}
nav.addEventListener("click",e=>{const a=e.target.closest("a");if(!a)return;if(a.getAttribute('href'))return;document.querySelectorAll("#nav a").forEach(x=>x.classList.remove("active"));a.classList.add("active");const p=a.dataset.page;if(p==="Dashboard")renderDashboard();else if(p==="Stock Radar")renderRadar();else if(p==="Watchlist")renderWatchlist();else if(p==="Insider Activity")renderInsider();else if(p==="Short Radar")renderShort();else renderMarkets()});
search.addEventListener("input",e=>{const q=e.target.value.trim();clearTimeout(searchTimer);if(!q){searchResults.style.display="none";return}searchTimer=setTimeout(async()=>{try{const d=await get("/api/search?q="+encodeURIComponent(q));searchResultsList.innerHTML=(d.items||[]).map(x=>`<div class="result" onclick="searchResults.style.display='none';showStock('${esc(x.ticker)}')"><strong>${esc(x.name)}</strong><div class="sub">${esc(x.ticker)} · ${esc(x.sector||"")}</div></div>`).join("")||'<div class="sub" style="padding:12px">Ingen aksjer funnet.</div>';searchResults.style.display="block"}catch(e){searchResultsList.innerHTML='<div class="sub" style="padding:12px">Søk er utilgjengelig.</div>';searchResults.style.display="block"}},250)});
init();
</script>
</body>
</html>
