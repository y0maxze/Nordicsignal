<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NordicSignal · Signal Performance</title>
<link rel="stylesheet" href="/theme.css">
<style>
:root{--bg:#070707;--panel:#0e0e0e;--panel2:#121212;--line:#292929;--text:#f4f4f4;--muted:#929292;--green:#35d99b;--yellow:#f2c45c;--red:#fb7185;--blue:#65a9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1220px;margin:auto;padding:34px 28px 72px}.top{display:flex;justify-content:space-between;gap:22px;align-items:flex-end}.logo{font-size:20px;font-weight:850;letter-spacing:-.04em;text-decoration:none;color:var(--text)}.logo span{color:#18c984}h1{font-size:31px;margin:18px 0 7px;letter-spacing:-.035em}.sub,.small{color:var(--muted)}.sub{font-size:11px;line-height:1.55}.small{font-size:10px}.btn{border:1px solid #303030;background:#151515;color:#eee;border-radius:9px;padding:10px 12px;text-decoration:none;font-weight:650;cursor:pointer}.hero{display:grid;grid-template-columns:1.45fr .75fr;gap:14px;margin-top:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}.statusPanel{display:flex;flex-direction:column;justify-content:space-between;min-height:190px}.eyebrow{font-size:10px;color:#7f7f7f;text-transform:uppercase;letter-spacing:.09em}.status{font-size:27px;font-weight:850;margin:7px 0 5px;letter-spacing:-.035em}.status.ready{color:var(--green)}.status.notReady{color:var(--yellow)}.rule{border-top:1px solid #252525;margin-top:14px;padding-top:12px;color:#7f7f7f;font-size:10px;line-height:1.55}.progress{height:8px;background:#1e1e1e;border-radius:99px;overflow:hidden;margin-top:12px}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#258c67,#35d99b);border-radius:99px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px}.metric span{display:block;color:#858585;font-size:10px}.metric b{display:block;font-size:23px;margin-top:6px}.metric small{display:block;color:#6f6f6f;font-size:9px;margin-top:5px;line-height:1.45}.section{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}.sectionHead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:15px}.sectionHead h2{font-size:17px;margin:0}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid #252525;white-space:nowrap}.table th{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:.06em}.table td{font-size:11px}.table tr:last-child td{border-bottom:0}.pos{color:var(--green)}.neg{color:var(--red)}.neutral{color:var(--muted)}.pill{display:inline-flex;align-items:center;padding:5px 8px;border-radius:99px;font-size:9px;font-weight:800;letter-spacing:.03em;background:#282109;color:var(--yellow);border:1px solid #4b4020}.pill.ready{background:#0b2a20;color:var(--green);border-color:#174c39}.pill.muted{background:#161616;color:#8a8a8a;border-color:#2d2d2d}.labelGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.labelCard{background:var(--panel2);border:1px solid #292929;border-radius:11px;padding:15px}.labelTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.labelCard h3{font-size:12px;margin:0;letter-spacing:-.01em}.labelCard .events{color:#777;font-size:9px;margin-top:4px}.miniRows{margin-top:12px}.miniRow{display:grid;grid-template-columns:38px 42px 1fr 56px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #242424;font-size:9px}.miniRow:first-child{border-top:0}.miniBar{height:5px;border-radius:99px;background:#242424;overflow:hidden}.miniBar span{display:block;height:100%;background:#4d8b72}.eventLink{color:#eee;text-decoration:none;font-weight:750}.eventLink:hover{color:var(--green)}.empty{padding:26px 12px;text-align:center;color:#777;font-size:11px}.notice{margin-top:14px;padding:13px 14px;border-radius:10px;border:1px solid #2c2c2c;background:#0b0b0b;color:#858585;font-size:10px;line-height:1.55}.loading{display:flex;align-items:center;gap:10px;color:#8b8b8b;font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.1s infinite alternate}@keyframes pulse{from{opacity:.25}to{opacity:1}}@media(max-width:900px){.hero{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.labelGrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:580px){.wrap{padding:22px 15px 52px}.metrics{grid-template-columns:1fr 1fr}h1{font-size:27px}.panel,.section{padding:16px}.status{font-size:24px}}@media(max-width:390px){.metrics{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div><a class="logo" href="/app">Nordic<span>Signal</span></a><h1>Signal Performance</h1><div class="sub">Forward-validering av Early Opportunity. Systemet måler faktiske resultater før terskler kan vurderes på nytt.</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="refreshBtn" type="button">Oppdater</button><a class="btn" href="/app">← Min oversikt</a></div></div>
<div id="content"><section class="section"><div class="loading"><span class="dot"></span>Laster performance-data…</div></section></div>
</main>
<script>
const API='';
const HORIZONS=[1,5,10,20,60];
const REQUIRED=[5,10,20];
const LABELS=['WATCH_CONFLUENCE','EARLY_OPPORTUNITY','EARLY_OPPORTUNITY_HIGH'];
const esc=value=>String(value??'').replace(/[&<>\"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[char]));
const fmtNumber=value=>value==null?'—':Number(value).toLocaleString('no-NO',{maximumFractionDigits:1});
const fmtPct=value=>value==null?'—':`${Number(value)>=0?'+':''}${Number(value).toLocaleString('no-NO',{minimumFractionDigits:1,maximumFractionDigits:1})}%`;
const fmtRate=value=>value==null?'—':`${Number(value).toLocaleString('no-NO',{maximumFractionDigits:1})}%`;
const returnClass=value=>value==null?'neutral':Number(value)>0?'pos':Number(value)<0?'neg':'neutral';
const labelName=value=>({WATCH_CONFLUENCE:'Watch Confluence',EARLY_OPPORTUNITY:'Early Opportunity',EARLY_OPPORTUNITY_HIGH:'Early Opportunity High'})[value]||String(value||'—').replaceAll('_',' ');
const formatDate=value=>{if(!value)return '—';const date=new Date(value);return Number.isNaN(date.getTime())?String(value).slice(0,16):date.toLocaleString('no-NO',{dateStyle:'short',timeStyle:'short'})};
async function getPerformance(){const response=await fetch(API+'/api/opportunity-performance?limit=100',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()}
function horizonStats(data,h){return (data.horizons||{})[String(h)]||{}}
function calibrationProgress(data){const min=Number(data.calibration?.minimum_sample_size||20);const counts=REQUIRED.map(h=>Number(horizonStats(data,h).n||0));const weakest=counts.length?Math.min(...counts):0;return {min,weakest,pct:Math.max(0,Math.min(100,weakest/min*100)),missing:Math.max(0,min-weakest)}}
function horizonTable(data){return HORIZONS.map(h=>{const s=horizonStats(data,h);const required=REQUIRED.includes(h);return `<tr><td><strong>${h}d</strong>${required?'<div class="small">kalibreringsgate</div>':''}</td><td>${fmtNumber(s.n)} / ${fmtNumber(s.event_count)}</td><td class="${returnClass(s.mean_return_pct)}">${fmtPct(s.mean_return_pct)}</td><td class="${returnClass(s.median_return_pct)}">${fmtPct(s.median_return_pct)}</td><td>${fmtRate(s.positive_rate_pct)}</td><td>${fmtRate(s.settled_event_pct)}</td><td><span class="pill ${s.sample_status==='usable'?'ready':''}">${s.sample_status==='usable'?'USABLE':'INSUFFICIENT'}</span></td></tr>`}).join('')}
function labelCards(data){const source=data.by_label||{};return LABELS.map(label=>{const item=source[label]||{events:0,horizons:{},calibration_ready:false};const min=Number(data.calibration?.minimum_sample_size||20);const rows=REQUIRED.map(h=>{const s=(item.horizons||{})[String(h)]||{};const n=Number(s.n||0);const pct=Math.min(100,n/min*100);return `<div class="miniRow"><strong>${h}d</strong><span>${n}/${min}</span><div class="miniBar"><span style="width:${pct}%"></span></div><span class="${returnClass(s.median_return_pct)}">${fmtPct(s.median_return_pct)}</span></div>`}).join('');return `<article class="labelCard"><div class="labelTop"><div><h3>${esc(labelName(label))}</h3><div class="events">${fmtNumber(item.events)} registrerte events</div></div><span class="pill ${item.calibration_ready?'ready':''}">${item.calibration_ready?'READY':'NOT READY'}</span></div><div class="miniRows">${rows}</div></article>`}).join('')}
function recentEvents(data){const items=data.recent_events||[];if(!items.length)return '<div class="empty">Ingen Opportunity-overganger er registrert ennå. Siden fylles automatisk når live-signaler skifter nivå.</div>';return `<div class="tableWrap"><table class="table"><thead><tr><th>Tid</th><th>Aksje</th><th>Overgang</th><th>Opportunity</th><th>Reversal</th><th>Volum</th><th>Insider</th></tr></thead><tbody>${items.map(event=>`<tr><td>${esc(formatDate(event.observed_at||event.created_at))}</td><td><a class="eventLink" href="/stock?ticker=${encodeURIComponent(event.ticker||'')}">${esc(event.name||event.ticker||'—')}</a><div class="small">${esc(event.ticker||'')}</div></td><td>${esc(labelName(event.previous_label))} → <strong>${esc(labelName(event.label))}</strong></td><td>${fmtNumber(event.score)}/100</td><td>${fmtNumber(event.reversal_score)}/100</td><td>${event.volume_ratio==null?'—':`${fmtNumber(event.volume_ratio)}×`}</td><td>${esc(event.insider_label||'NONE')}</td></tr>`).join('')}</tbody></table></div>`}
function render(data){const calibration=data.calibration||{};const progress=calibrationProgress(data);const ready=Boolean(calibration.ready);const readyLabels=LABELS.filter(label=>Boolean(data.by_label?.[label]?.calibration_ready)).length;const five=horizonStats(data,5);document.getElementById('content').innerHTML=`<section class="hero"><div class="panel"><div class="eyebrow">Calibration gate</div><div class="status ${ready?'ready':'notReady'}">${ready?'READY FOR CALIBRATION':'NOT READY FOR CALIBRATION'}</div><div class="sub">Kravet er minst ${progress.min} ferdig målte observasjoner på hver av 5d, 10d og 20d. NordicSignal justerer ikke terskler automatisk.</div><div class="progress"><span style="width:${progress.pct}%"></span></div><div class="small" style="margin-top:8px">Svakeste påkrevde horizon: ${progress.weakest}/${progress.min}${ready?' · minimumskrav nådd':` · ${progress.missing} mangler`}</div><div class="rule">${esc(calibration.rule||'Forward-data er informativ inntil minimumsutvalget er nådd.')}</div></div><div class="panel statusPanel"><div><div class="eyebrow">Live sample</div><div style="font-size:42px;font-weight:850;margin-top:8px">${fmtNumber(data.events||0)}</div><div class="sub">registrerte Opportunity-events</div></div><div><span class="pill ${ready?'ready':''}">${ready?'READY':'COLLECTING DATA'}</span><div class="small" style="margin-top:9px">Oppdatert ${esc(formatDate(data.updated_at))}</div></div></div></section><section class="metrics"><div class="metric"><span>5d observations</span><b>${fmtNumber(five.n||0)}</b><small>${fmtRate(five.settled_event_pct)} av registrerte events ferdig målt.</small></div><div class="metric"><span>5d median</span><b class="${returnClass(five.median_return_pct)}">${fmtPct(five.median_return_pct)}</b><small>Median er mindre følsom for enkeltutslag enn snitt.</small></div><div class="metric"><span>5d positive rate</span><b>${fmtRate(five.positive_rate_pct)}</b><small>Andel ferdige 5d-observasjoner med positiv avkastning.</small></div><div class="metric"><span>Signalnivåer klare</span><b>${readyLabels}/${LABELS.length}</b><small>Separate gates for Watch, Early og High.</small></div></section><section class="section"><div class="sectionHead"><div><h2>Forward performance</h2><div class="sub">1/5/10/20/60 handelsdager etter registrert Opportunity-overgang.</div></div><span class="pill muted">MEASUREMENT ONLY</span></div><div class="tableWrap"><table class="table"><thead><tr><th>Horizon</th><th>Settled / events</th><th>Mean</th><th>Median</th><th>Positive rate</th><th>Coverage</th><th>Sample</th></tr></thead><tbody>${horizonTable(data)}</tbody></table></div></section><section class="section"><div class="sectionHead"><div><h2>Resultat per signalnivå</h2><div class="sub">Kalibrering skal vurderes per nivå, ikke bare på samlet gjennomsnitt.</div></div></div><div class="labelGrid">${labelCards(data)}</div></section><section class="section"><div class="sectionHead"><div><h2>Siste Opportunity-events</h2><div class="sub">Kun reelle tilstandsoverganger lagres. Klikk aksjen for å åpne Stock Intelligence.</div></div></div>${recentEvents(data)}</section><div class="notice"><strong>Viktig:</strong> denne siden er en validerings- og læringslogg. Opportunity er fortsatt separat fra NordicSignal sin ordinære 0–100-score, og dataene her endrer ikke vekter eller terskler automatisk.</div>`}
async function load(){const button=document.getElementById('refreshBtn');button.disabled=true;button.textContent='Laster…';try{render(await getPerformance())}catch(error){document.getElementById('content').innerHTML=`<section class="section"><h2 style="margin-top:0">Performance-data utilgjengelig</h2><div class="notice">Kunne ikke hente /api/opportunity-performance akkurat nå. Ingen signalregler er påvirket. Prøv Oppdater igjen.</div><div class="small">${esc(error.message)}</div></section>`}finally{button.disabled=false;button.textContent='Oppdater'}}
document.getElementById('refreshBtn').addEventListener('click',load);load();
</script>
</body>
</html>
