<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NordicSignal · Fant ikke siden</title>
  <style>
    :root{--bg:#070707;--panel:#0f0f0f;--line:#2a2a2a;--text:#f5f5f5;--muted:#9b9b9b;--green:#18c984}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070707;color:var(--text);font:15px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(680px,calc(100% - 32px));padding:36px;background:var(--panel);border:1px solid var(--line);border-radius:14px;text-align:center}h1{margin:0 0 10px;font-size:30px;letter-spacing:-.04em}.brand span{color:var(--green)}.sub{color:var(--muted);line-height:1.6}.links{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}.links a{color:#fff;text-decoration:none;padding:10px 14px;border:1px solid #333;border-radius:8px;background:#151515}.links a:hover{background:#202020;border-color:#555}.code{font-size:12px;color:#777;margin-bottom:12px;letter-spacing:.08em}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1 class="brand">Nordic<span>Signal</span></h1>
    <div class="sub">Siden finnes ikke, eller adressen er ikke lenger i bruk. Gå tilbake til dashboardet eller åpne et av hovedverktøyene.</div>
    <div class="links"><a href="/app">Dashboard</a><a href="/stock">Stock Intelligence</a><a href="/paper">Paper Trading</a><a href="/news">News</a><a href="/history">History</a></div>
  </main>
</body>
</html>
