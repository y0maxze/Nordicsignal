<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NordicSignal · News</title>
<style>
:root{--bg:#07111f;--p:#0d1b2d;--p2:#10243a;--line:#20354d;--t:#eef5ff;--m:#91a5bd;--g:#35d49a;--y:#f3c95b;--r:#fb7185;--b:#65a9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#112942,#07111f 45%);color:var(--t);font:14px system-ui,-apple-system,sans-serif}.main{max-width:1200px;margin:auto;padding:30px}.top,.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center}.logo{font-size:21px;font-weight:850}.logo span{color:var(--g)}.sub,.label,.small{color:var(--m);font-size:12px}.controls{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--p2);color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.input{background:#0a1727;border:1px solid var(--line);color:#fff;border-radius:9px;padding:10px;width:180px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:17px}.section{background:rgba(13,27,45,.94);border:1px solid var(--line);border-radius:14px;padding:18px}.news{padding:14px 0;border-top:1px solid var(--line)}.news:first-child{border-top:0}.tag{display:inline-block;padding:4px 7px;border-radius:99px;background:#0c3027;color:var(--g);font-size:10px;font-weight:750}.tag.report{background:#30270d;color:var(--y)}.tag.insider{background:#30203b;color:#d6a9ff}.tag.company{background:#132d45;color:var(--b)}a{color:#fff;text-decoration:none}a:hover{color:var(--g)}.notice{padding:12px;border:1px solid var(--line);border-radius:10px;background:#0a1727;color:var(--m);margin-top:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.main{padding:20px}.top{align-items:flex-start;flex-direction:column}}
</style></head>
<body><main class="main">
<div class="top"><div><div class="logo">Nordic<span>Signal</span></div><h1>Aksjenyheter & hendelser</h1><div class="sub">Nyheter, rapporter og relevante offentlige hendelser samlet per aksje.</div></div><div class="controls"><input id="ticker" class="input" value="LSG" maxlength="12"><button class="btn" onclick="loadAll()">Oppdater</button><button class="btn" onclick="location.href='/app'">← Dashboard</button></div></div>
<div id="status" class="notice">Laster…</div><div class="grid"><section class="section"><div class="toolbar"><h2>Hva er nytt?</h2><span id="count" class="sub">—</span></div><div id="news"></div></section><section class="section"><div class="toolbar"><h2>Insider</h2><span id="insiderStatus" class="sub">—</span></div><div id="insider"></div><div style="height:20px"></div><div class="toolbar"><h2>Short</h2><span id="shortStatus" class="sub">—</span></div><div id="short"></div></section></div>
<script>
const API='';
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const get=async p=>{const r=await fetch(API+p);if(!r.ok)throw Error(await r.text());return r.json()};
function tag(c){return `<span class="tag ${c==='Rapport'?'report':c==='Insider'?'insider':c==='Selskap'?'company':''}">${esc(c||'Nyhet')}</span>`}
async function loadAll(){const t=ticker.value.trim().toUpperCase();if(!t)return;status.textContent='Henter live hendelser…';news.innerHTML='<div class="notice">Laster nyheter…</div>';insider.innerHTML='<div class="notice">Laster insiderdata…</div>';short.innerHTML='<div class="notice">Laster shortdata…</div>';try{const [n,i,s]=await Promise.all([get('/api/news/'+encodeURIComponent(t)+'?limit=20'),get('/api/insider/'+encodeURIComponent(t)),get('/api/short/'+encodeURIComponent(t))]);renderNews(n);renderInsider(i);renderShort(s);status.textContent=`${t} · data hentet fra tilgjengelige live/offentlige kilder`; }catch(e){status.textContent='Noe av datagrunnlaget er midlertidig utilgjengelig.';news.innerHTML='<div class="notice">Nyhetsdata kunne ikke hentes.</div>'}}
function renderNews(d){const items=d.items||[];count.textContent=`${items.length} treff`;news.innerHTML=items.length?items.map(x=>`<article class="news">${tag(x.category)} <span class="small">${x.published_at?new Date(x.published_at).toLocaleString('no-NO'):''} · ${esc(x.publisher)}</span><h3 style="margin:8px 0 5px">${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`:esc(x.title)}</h3><div class="small">${esc(x.summary||x.title)}</div></article>`).join(''):'<div class="notice">Ingen nye offentlige nyheter funnet.</div>'}
function renderInsider(d){const items=d.items||[];insiderStatus.textContent=d.status||'—';insider.innerHTML=items.length?items.slice(0,10).map(x=>`<article class="news"><b class="${x.direction==='buy'?'g':x.direction==='sell'?'r':'y'}">${esc(x.direction||x.transaction_type||'ukjent')}</b><span class="small"> · ${esc(x.date||x.trade_date||'dato ukjent')}</span><div style="margin-top:6px">${esc(x.title||'Primærinnsidermelding')}</div><div class="small">${esc(x.summary||'')}</div></article>`).join(''):`<div class="notice">Ingen verifiserte nylige insiderhendelser funnet.</div>`}
function renderShort(d){shortStatus.textContent=d.status||'—';const pct=d.short_percent_float;short.innerHTML=`<div class="news"><div class="label">Offentlig shortandel</div><h2 style="margin:6px 0">${pct==null?'—':Number(pct).toLocaleString('no-NO',{minimumFractionDigits:2,maximumFractionDigits:4})+'%'}</h2><div class="small">${esc(d.source||'Finanstilsynet SSR')}</div></div>`}
loadAll();
</script></main></body></html>
