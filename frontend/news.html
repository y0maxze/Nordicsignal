<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NordicSignal · Nyheter</title>
<style>
:root{--bg:#070707;--panel:#101010;--panel2:#0b0b0b;--line:#292929;--text:#f4f4f4;--muted:#8f8f8f;--green:#35d49a;--yellow:#e7c16b;--red:#fb7185;--blue:#87b8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.main{max-width:1320px;margin:auto;padding:30px 28px 60px}.top{display:flex;justify-content:space-between;gap:28px;align-items:flex-end;margin-bottom:22px}.logo{font-size:20px;font-weight:850;letter-spacing:-.04em}.logo span{color:var(--green)}h1{font-size:30px;margin:20px 0 7px;letter-spacing:-.035em}.sub,.small,.label{color:var(--muted);font-size:11px}.controls{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}.searchBox{position:relative;width:min(380px,58vw)}.searchBox label{display:block;color:#888;font-size:10px;margin:0 0 6px 2px}.input{width:100%;background:#0a0a0a;border:1px solid #303030;color:#fff;border-radius:9px;padding:11px 12px;font:inherit;outline:none}.input:focus{border-color:#555}.searchResults{display:none;position:absolute;z-index:50;left:0;right:0;top:100%;margin-top:6px;background:#0b0b0b;border:1px solid #343434;border-radius:10px;box-shadow:0 20px 50px #000b;max-height:350px;overflow:auto}.searchResults.open{display:block}.searchItem{display:block;width:100%;border:0;border-bottom:1px solid #222;background:transparent;color:#eee;text-align:left;padding:11px 12px;cursor:pointer}.searchItem:last-child{border-bottom:0}.searchItem:hover{background:#151515}.searchName{font-weight:750}.searchMeta{color:#858585;font-size:10px;margin-top:3px}.btn{border:1px solid #303030;background:#151515;color:#eee;border-radius:9px;padding:10px 12px;cursor:pointer;font-weight:650}.btn:hover{border-color:#4a4a4a;background:#1a1a1a}.btn.primary{background:#eee;color:#090909;border-color:#eee}.btn.hidden{display:none}.status{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#0c0c0c;color:#aaa;margin-bottom:16px}.scope{font-weight:800;color:#eee}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);gap:16px}.grid.general{grid-template-columns:1fr}.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:8px}.toolbar h2{font-size:17px;margin:0}.news{padding:14px 0;border-top:1px solid #252525}.news:first-of-type{border-top:0}.newsTop{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.tag{display:inline-flex;padding:4px 7px;border-radius:99px;border:1px solid #333;background:#151515;color:#aaa;font-size:9px;font-weight:850;letter-spacing:.02em}.tag.report{background:#17150c;border-color:#554923;color:var(--yellow)}.tag.insider{background:#15101d;border-color:#49305d;color:#d6a9ff}.tag.company{background:#0d141b;border-color:#2a4054;color:var(--blue)}.tag.exchange{background:#0d1814;border-color:#24503f;color:var(--green)}.tickerTag{font-size:9px;font-weight:900;color:#d7d7d7}.news h3{font-size:14px;line-height:1.4;margin:8px 0 5px}.news a{color:#f3f3f3;text-decoration:none}.news a:hover{color:#fff;text-decoration:underline}.notice,.empty{padding:14px;border:1px solid #292929;border-radius:9px;background:#0b0b0b;color:#999}.empty{text-align:center;padding:30px 18px}.g{color:var(--green)}.r{color:var(--red)}.y{color:var(--yellow)}.stockSide.hidden{display:none}.sideGap{height:20px}.modeHint{font-size:10px;color:#777;margin-top:4px}.loadMore{display:block;margin:14px auto 0}.marketIntro{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:10px 0 4px}.marketIntro b{font-size:13px}.marketIntro span{color:#777;font-size:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.controls{width:100%}.searchBox{width:100%}.main{padding:22px 18px 50px}}@media(max-width:600px){h1{font-size:26px}.controls .btn{flex:1}.status{align-items:flex-start;flex-direction:column}}
</style></head>
<body><main class="main">
<div class="top"><div><div class="logo">Nordic<span>Signal</span></div><h1>Aksjenyheter & hendelser</h1><div class="sub">Generelle markedsnyheter først. Velg en aksje når du vil se nyheter, rapporter, insider og short for ett selskap.</div></div><div class="controls"><div class="searchBox"><label>SØK ETTER EN AKSJE</label><input id="stockSearch" class="input" autocomplete="off" placeholder="F.eks. MPCC, Lerøy, Equinor…"><div id="searchResults" class="searchResults"></div></div><button id="allBtn" class="btn hidden" onclick="loadGeneral()">Alle nyheter</button><button class="btn" onclick="refreshCurrent()">Oppdater</button><button class="btn" onclick="location.href='/app'">← Min oversikt</button></div></div>
<div id="status" class="status"><span><span id="scope" class="scope">Alle nyheter</span><span id="statusText"> · Laster siste markedshendelser…</span></span><span id="sourceText" class="small"></span></div>
<div id="contentGrid" class="grid general"><section class="section"><div class="toolbar"><div><h2 id="feedTitle">Siste nytt</h2><div id="feedSub" class="modeHint">Oslo Børs og relevante markedsnyheter</div></div><span id="count" class="sub">—</span></div><div id="news"><div class="notice">Laster nyheter…</div></div></section><section id="stockSide" class="section stockSide hidden"><div class="toolbar"><h2>Insider</h2><span id="insiderStatus" class="sub">—</span></div><div id="insider"></div><div class="sideGap"></div><div class="toolbar"><h2>Short</h2><span id="shortStatus" class="sub">—</span></div><div id="short"></div></section></div>
<script>
const API='';let currentTicker=null,searchTimer=null,searchSeq=0,lastSearchItems=[],loadSeq=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const get=async p=>{const r=await fetch(API+p,{cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||`Request failed (${r.status})`);return d};
const updated=source=>`${source||'Offentlige kilder'} · Oppdatert ${new Date().toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'})}`;
function tag(c,official=false){const cls=c==='Rapport'?'report':c==='Insider'?'insider':c==='Selskap'||c==='Børsmelding'?'company':official?'exchange':'';return `<span class="tag ${cls}">${esc(c||'Nyhet')}</span>`}
function niceDate(v){if(!v)return '';try{return new Date(v).toLocaleString('no-NO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch{return String(v)}}
function isGenericIr(x){if(x.source_type!=='issuer_ir')return false;const t=String(x.title||'').trim().toLowerCase();return ['annual reports','annual report','financial calendar','reports and webcast','reports & webcast','reports webcast','stock exchange notices','stock exchange announcements','sustainability reports','sustainability report','webcast','webcasts','presentations','financial reports','quarterly reports','investor relations'].includes(t)}
function mergeNewsAndReports(n,r){const out=[],seen=new Set();for(const x of [...(r?.items||[]),...(n?.items||[])]){if(isGenericIr(x))continue;const key=String(x.url||x.title||'').split('?')[0].toLowerCase();if(!key||seen.has(key))continue;seen.add(key);out.push(x)}return out.sort((a,b)=>String(b.published_at||'').localeCompare(String(a.published_at||'')))}
function renderNewsItems(items,emptyText){$('count').textContent=`${items.length} treff`;$('news').innerHTML=items.length?items.map(x=>`<article class="news"><div class="newsTop">${x.ticker?`<span class="tickerTag">${esc(String(x.ticker).replace('.OL',''))}</span>`:''}${tag(x.category,x.official)}<span class="small">${esc(niceDate(x.published_at))}${x.publisher?' · '+esc(x.publisher):''}</span></div><h3>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`:esc(x.title)}</h3>${x.summary&&x.summary!==x.title?`<div class="small">${esc(x.summary)}</div>`:''}</article>`).join(''):`<div class="empty">${esc(emptyText)}</div>`}
function renderInsider(d){const items=d?.items||[];$('insiderStatus').textContent=d?.status||'—';$('insider').innerHTML=items.length?items.slice(0,10).map(x=>{const actor=x.person||x.entity||x.insider||'Ikke oppgitt i kilden',side=String(x.transaction_type||x.direction||'').toLowerCase(),action=side==='buy'?'KJØP':side==='sell'?'SALG':'ANNET',cls=side==='buy'?'g':side==='sell'?'r':'y';return `<article class="news"><b>${esc(actor)}</b>${x.role?`<div class="small">${esc(x.role)}</div>`:''}<div style="margin-top:7px"><b class="${cls}">${esc(action)}</b><span class="small"> · ${esc(x.trade_date||x.date||'dato ukjent')}</span></div><div style="margin-top:6px">${esc(x.title||'Primærinnsidermelding')}</div>${x.shares!=null?`<div class="small">${Number(x.shares).toLocaleString('no-NO')} aksjer${x.price!=null?' · '+Number(x.price).toLocaleString('no-NO',{maximumFractionDigits:2})+' kr':''}</div>`:''}</article>`}).join(''):'<div class="notice">Ingen verifiserte nylige insiderhendelser funnet.</div>'}
function renderShort(d){$('shortStatus').textContent=d?.status||'—';const pct=d?.short_percent_float;$('short').innerHTML=`<div class="news"><div class="label">Offentlig shortandel</div><h2 style="margin:6px 0">${pct==null?'—':Number(pct).toLocaleString('no-NO',{minimumFractionDigits:2,maximumFractionDigits:4})+'%'}</h2><div class="small">${esc(d?.source||'Finanstilsynet SSR')}</div></div>`}
function setMode(ticker){currentTicker=ticker||null;$('allBtn').classList.toggle('hidden',!currentTicker);$('stockSide').classList.toggle('hidden',!currentTicker);$('contentGrid').classList.toggle('general',!currentTicker);$('scope').textContent=currentTicker?currentTicker:'Alle nyheter';$('feedTitle').textContent=currentTicker?`Siste nytt · ${currentTicker}`:'Siste nytt';$('feedSub').textContent=currentTicker?'Nyheter og rapporter for valgt aksje':'Oslo Børs og relevante markedsnyheter';const url=currentTicker?`/news?ticker=${encodeURIComponent(currentTicker)}`:'/news';history.replaceState({},'',url)}
async function loadGeneral(silent=false){const mine=++loadSeq;setMode(null);if(!silent){$('stockSearch').value='';$('statusText').textContent=' · Henter generell markedsfeed…';$('sourceText').textContent='';$('news').innerHTML='<div class="notice">Laster siste nytt…</div>'}try{const d=await get('/api/news?limit=40');if(mine!==loadSeq)return;renderNewsItems((d.items||[]).filter(x=>!isGenericIr(x)),'Ingen generelle markedsnyheter funnet akkurat nå.');$('statusText').textContent=' · Generell feed';$('sourceText').textContent=updated(d.source)}catch(e){if(mine!==loadSeq)return;if(!silent){$('statusText').textContent=' · Generell feed er midlertidig utilgjengelig';$('news').innerHTML='<div class="notice">Kunne ikke hente den generelle nyhetsfeeden akkurat nå.</div>'}}}
async function loadStock(ticker,silent=false){const mine=++loadSeq,t=String(ticker||'').trim().toUpperCase().replace(/\.OL$/,'');if(!t)return;setMode(t);if(!silent){$('stockSearch').value=t;$('statusText').textContent=' · Henter selskapsdata…';$('sourceText').textContent='';$('news').innerHTML='<div class="notice">Laster nyheter og rapporter…</div>';$('insider').innerHTML='<div class="notice">Laster insiderdata…</div>';$('short').innerHTML='<div class="notice">Laster shortdata…</div>'}const results=await Promise.allSettled([get('/api/news/'+encodeURIComponent(t)+'?limit=24'),get('/api/reports/'+encodeURIComponent(t)+'?limit=12'),get('/api/insider/'+encodeURIComponent(t)),get('/api/short/'+encodeURIComponent(t))]);if(mine!==loadSeq)return;const [n,r,i,s]=results.map(x=>x.status==='fulfilled'?x.value:null);if(n||r){renderNewsItems(mergeNewsAndReports(n||{},r||{}),'Ingen nye offentlige nyheter funnet for denne aksjen.')}else if(!silent)$('news').innerHTML='<div class="notice">Nyhetsdata kunne ikke hentes akkurat nå.</div>';if(i||!silent)renderInsider(i||{status:'utilgjengelig',items:[]});if(s||!silent)renderShort(s||{status:'utilgjengelig'});$('statusText').textContent=' · Valgt aksje';$('sourceText').textContent=updated(n?.source||r?.source||'Tilgjengelige offentlige kilder')}
async function searchStocks(q){const seq=++searchSeq,res=$('searchResults'),text=q.trim();if(text.length<2){res.className='searchResults';res.innerHTML='';lastSearchItems=[];return}res.className='searchResults open';res.innerHTML='<div class="searchItem"><div class="searchMeta">Søker…</div></div>';try{const d=await get('/api/search?q='+encodeURIComponent(text)+'&limit=12');if(seq!==searchSeq)return;lastSearchItems=(d.items||[]).filter(x=>String(x.quote_type||'EQUITY').toUpperCase()==='EQUITY').slice(0,10);res.innerHTML=lastSearchItems.length?lastSearchItems.map((x,i)=>`<button type="button" class="searchItem" data-i="${i}"><div class="searchName">${esc(x.name||x.ticker||x.symbol)}</div><div class="searchMeta">${esc(x.ticker||x.symbol)}${x.exchange?' · '+esc(x.exchange):''}${x.tracked?' · NordicSignal':''}</div></button>`).join(''):'<div class="searchItem"><div class="searchMeta">Ingen aksjer funnet.</div></div>';[...res.querySelectorAll('[data-i]')].forEach(b=>b.onclick=()=>{const x=lastSearchItems[Number(b.dataset.i)];res.className='searchResults';loadStock(x.ticker||x.symbol)})}catch(e){if(seq!==searchSeq)return;res.innerHTML='<div class="searchItem"><div class="searchMeta">Søket er midlertidig utilgjengelig.</div></div>'}}
function refreshCurrent(silent=false){currentTicker?loadStock(currentTicker,silent):loadGeneral(silent)}
$('stockSearch').addEventListener('input',e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>searchStocks(e.target.value),220)});$('stockSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const first=lastSearchItems[0];if(first)loadStock(first.ticker||first.symbol);else if(e.target.value.trim())loadStock(e.target.value)}});document.addEventListener('click',e=>{if(!e.target.closest('.searchBox'))$('searchResults').className='searchResults'});
const initial=new URLSearchParams(location.search).get('ticker');initial?loadStock(initial):loadGeneral();setInterval(()=>{if(!document.hidden)refreshCurrent(true)},120000);
</script></main></body></html>
