<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NordicSignal · Stock Intelligence</title>
<style>
:root{--bg:#07111f;--p:#0d1b2d;--p2:#10243a;--line:#20354d;--t:#eef5ff;--m:#91a5bd;--g:#35d49a;--y:#f3c95b;--r:#fb7185;--b:#65a9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#112942,#07111f 45%);color:var(--t);font:14px system-ui,-apple-system,sans-serif}.wrap{max-width:1450px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}.muted{color:var(--m);font-size:12px}.card{background:rgba(13,27,45,.96);border:1px solid var(--line);border-radius:14px;padding:18px}.hero{margin-top:20px}.price{font-size:40px;font-weight:850}.green{color:var(--g)}.yellow{color:var(--y)}.red{color:var(--r)}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}.metric b{font-size:20px;display:block;margin-top:5px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 12px}.tab{border:1px solid var(--line);background:var(--p2);color:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.tab.active{border-color:#5b83a8;background:#17324d}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.item{border-top:1px solid var(--line);padding:14px 0}.item:first-child{border-top:0}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#0c3027;color:var(--g);font-size:11px;font-weight:750}.sell{background:#351522;color:var(--r)}.buy{background:#0c3027;color:var(--g)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--m)}a{color:var(--b)}button{font:inherit}.notice{padding:12px;background:#0a1727;border:1px solid var(--line);border-radius:10px;color:var(--m)}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:550px){.wrap{padding:16px}.metrics{grid-template-columns:1fr}.top{display:block}}
</style></head><body><main class="wrap"><div class="top"><div><div class="muted">NORDICSIGNAL · STOCK INTELLIGENCE</div><h1 id="name">Loading…</h1><div id="ticker" class="muted"></div></div><div id="price" class="price">—</div></div><section class="card hero"><div id="heroStatus" class="notice">Loading live stock data…</div><div class="metrics"><div class="metric"><span class="muted">NordicSignal score</span><b id="score">—</b></div><div class="metric"><span class="muted">Fundamentals</span><b id="fund">—</b></div><div class="metric"><span class="muted">Valuation</span><b id="val">—</b></div><div class="metric"><span class="muted">Sentiment</span><b id="sent">—</b></div><div class="metric"><span class="muted">Insider</span><b id="ins">—</b></div></div></section><nav class="tabs"><button class="tab active" data-tab="overview">Oversikt</button><button class="tab" data-tab="news">Nyheter</button><button class="tab" data-tab="insider">Insider</button><button class="tab" data-tab="reports">Rapporter</button><button class="tab" data-tab="dividend">Utbytte</button><button class="tab" data-tab="short">Short</button><button class="tab" data-tab="paper">Paper Trade</button><button class="tab" data-tab="backtest">Backtest</button></nav><section id="content"></section></main><script>
const API='https://nordicsignal-api.onrender.com';const q=new URLSearchParams(location.search);const ticker=(q.get('ticker')||'LSG').toUpperCase();const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));const money=n=>n==null?'—':Number(n).toLocaleString('no-NO',{maximumFractionDigits:2})+' kr';const get=async p=>{const r=await fetch(API+p);if(!r.ok)throw Error(p);return r.json()};
let stock=null;
async function load(){try{const [stocks,insider,news,shorts]=await Promise.all([get('/api/stocks'),get('/api/insider/'+encodeURIComponent(ticker)),get('/api/news/'+encodeURIComponent(ticker)),get('/api/short/'+encodeURIComponent(ticker))]);stock=(stocks.items||[]).find(x=>x.ticker===ticker)||{ticker,name:ticker};$('name').textContent=stock.name||ticker;$('ticker').textContent=ticker+' · Oslo Børs';$('score').textContent=stock.score??'—';$('fund').textContent=stock.fundamentals??'—';$('val').textContent=stock.valuation??'—';$('sent').textContent=stock.sentiment??'—';$('ins').textContent=stock.insider??'—';$('heroStatus').innerHTML=`Data coverage: <b>${stock.live_verified?'LIVE':stock.partial_live?'PARTIAL LIVE':'STORED'}</b> · updated ${esc(stock.score_updated_at||'—')}`;window.data={insider,news,shorts};render('overview')}catch(e){$('heroStatus').textContent='Kunne ikke hente live data akkurat nå.';console.error(e)}}
function render(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const d=window.data||{};if(tab==='overview')$('content').innerHTML=`<div class="grid"><section class="card"><h2>Hva skjer med ${esc(ticker)}?</h2><div class="item"><b>Score</b><div class="muted">${esc(stock?.score??'—')}/100. Se komponentene over før du tolker totalscoren.</div></div><div class="item"><b>Datadekning</b><div class="muted">${esc(stock?.live_verified?'Alle scorekomponenter verifisert':stock?.partial_live?'Insiderdata mangler eller er ikke verifisert':'Lagret data')}</div></div><div class="item"><b>Hurtiglenker</b><div class="muted">Bruk fanene for nyheter, konkrete insiderhandler, short, utbytte, paper trading og backtesting.</div></div></section><section class="card"><h2>Seneste nyheter</h2>${newsList((d.news?.items||[]).slice(0,5))}</section></div>`;else if(tab==='news')$('content').innerHTML=`<section class="card"><h2>Nyheter · ${esc(ticker)}</h2><div class="muted">Offentlige nyheter fra live feed.</div>${newsList(d.news?.items||[])}</section>`;else if(tab==='insider')$('content').innerHTML=insiderView(d.insider);else if(tab==='reports')$('content').innerHTML=`<section class="card"><h2>Rapporter og resultater</h2><div class="notice">Rapportklassifiserte meldinger samles fra nyhets-/selskapsmeldingsfeed. Når originaldokumentet er tilgjengelig, skal det åpnes direkte fra kilden.</div>${newsList((d.news?.items||[]).filter(x=>x.category==='Rapport'||/report|result|earnings|quarter/i.test(x.title||'')))}</section>`;else if(tab==='dividend')$('content').innerHTML=`<section class="card"><h2>Utbytte</h2><div class="notice">Utbyttehistorikk kobles til backtest-motoren. Reinvestering behandles separat fra kontantutbytte.</div><div class="item"><b>Backtest</b><div class="muted">Gå til Backtest for å sammenligne reinvestert mot ikke-reinvestert utbytte.</div></div></section>`;else if(tab==='short')$('content').innerHTML=shortView(d.shorts);else if(tab==='paper')$('content').innerHTML=paperView();else if(tab==='backtest')$('content').innerHTML=backtestView()}
function newsList(items){return items.length?items.map(x=>`<article class="item"><span class="pill">${esc(x.category||'Nyhet')}</span><h3>${esc(x.title)}</h3><div class="muted">${esc(x.publisher||'—')} · ${esc(x.published_at||'—')}</div>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">Åpne originalkilde</a>`:''}</article>`).join(''):'<div class="notice">Ingen offentlige meldinger funnet.</div>'}
function insiderView(d){const items=d?.items||[];return `<section class="card"><h2>Insider · hvem kjøpte og solgte?</h2><div class="muted">Kun offentlig tilgjengelige primary-insider-disclosures. Vi skal ikke gjette identitet når kilden ikke oppgir den.</div>${items.length?`<table><thead><tr><th>Dato</th><th>Handling</th><th>Antall</th><th>Pris</th><th>Kilde</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.trade_date||'—')}</td><td><span class="pill ${x.transaction_type==='sell'?'sell':'buy'}">${x.transaction_type==='buy'?'KJØP':x.transaction_type==='sell'?'SALG':'ANNET'}</span><div class="muted">${esc(x.person||x.holder||x.entity||'Navn ikke tilgjengelig i kilden')}</div></td><td>${esc(x.shares??'—')}</td><td>${x.price?money(x.price):'—'}</td><td>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">Euronext</a>`:'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="notice">Ingen detaljerte offentlige insiderhandler tilgjengelig akkurat nå.</div>'}</section>`}
function shortView(d){return `<section class="card"><h2>Short</h2><div class="metrics"><div class="metric"><span class="muted">Short %</span><b>${d?.short_percent_float??'—'}</b></div><div class="metric"><span class="muted">Siste dato</span><b>${esc(d?.latest_date||'—')}</b></div><div class="metric"><span class="muted">Kilde</span><b style="font-size:13px">Finanstilsynet SSR</b></div></div><div class="item">${(d?.items||[]).map(x=>`<div><b>${esc(x.issuer_name||ticker)}</b> · ${esc(x.date||'—')} · ${esc(x.short_percent??'—')}%</div>`).join('')||'Ingen offentlig shortposisjon funnet.'}</div></section>`}
function paperView(){return `<section class="card"><h2>Paper Trading · ${esc(ticker)}</h2><div class="notice">Dette er simulert handel. Ingen ekte ordre sendes.</div><div class="metrics"><div class="metric"><span class="muted">Startkapital</span><b>100 000 kr</b></div><div class="metric"><span class="muted">Kurs</span><b>${$('price').textContent}</b></div></div><p class="muted">Paper Trading-motoren håndterer kjøp, salg, cash, posisjoner, P/L og historikk via API-et.</p><button class="tab" onclick="location.href='/paper'">Åpne Paper Trading</button></section>`}
function backtestView(){return `<section class="card"><h2>Backtest · ${esc(ticker)}</h2><div class="notice">Backtest-motoren støtter månedlig investering, lump sum, 50/200 SMA, gebyrer, XIRR, benchmark og utbyttebehandling.</div><div class="metrics"><div class="metric"><span class="muted">Startkapital</span><b>100 000 kr</b></div><div class="metric"><span class="muted">Månedsbeløp</span><b>5 000 kr</b></div><div class="metric"><span class="muted">Utbytte</span><b>Reinvestering</b></div></div><p class="muted">Vi bruker samme motor som Paper Trading og viser resultatet som egen historisk simulering.</p></section>`}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));load();
</script></body></html>
