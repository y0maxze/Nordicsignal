<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NordicSignal · Stock Intelligence</title>
<style>
:root{--bg:#07111f;--p:#0d1b2d;--p2:#10243a;--line:#20354d;--t:#eef5ff;--m:#91a5bd;--g:#35d49a;--r:#fb7185;--b:#65a9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#112942,#07111f 45%);color:var(--t);font:14px system-ui,-apple-system,sans-serif}.wrap{max-width:1500px;margin:auto;padding:28px}.top,.toolbar{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.muted{color:var(--m);font-size:12px}.card{background:rgba(13,27,45,.96);border:1px solid var(--line);border-radius:14px;padding:18px}.hero{margin-top:20px}.price{font-size:40px;font-weight:850}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}.metric{background:#0a1727;border-radius:10px;padding:13px}.metric b{font-size:19px;display:block;margin-top:5px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 12px}.tab,.btn{border:1px solid var(--line);background:var(--p2);color:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.tab.active{border-color:#5b83a8;background:#17324d}.danger{border-color:#63303a;color:#ffd9df}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.stack{display:grid;gap:14px}.item{border-top:1px solid var(--line);padding:14px 0}.item:first-child{border-top:0}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#0c3027;color:var(--g);font-size:11px;font-weight:750}.sell{background:#351522;color:var(--r)}.notice{padding:12px;background:#0a1727;border:1px solid var(--line);border-radius:10px;color:var(--m);margin-bottom:12px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form label{display:flex;flex-direction:column;gap:5px;color:var(--m);font-size:12px}.form input,.form select,.wideinput{background:#07111f;border:1px solid var(--line);border-radius:8px;color:#fff;padding:9px}.wideinput{width:100%;margin-top:5px}.positive{color:var(--g)}.negative{color:var(--r)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;color:var(--m)}a{color:var(--b)}.statusline{min-height:18px;margin-top:10px}@media(max-width:900px){.metrics,.form{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:550px){.wrap{padding:16px}.metrics,.form{grid-template-columns:1fr}.price{font-size:30px}}
</style></head>
<body><main class="wrap">
<div class="top"><div><div class="muted">NORDICSIGNAL · STOCK INTELLIGENCE</div><h1 id="name">Loading…</h1><div id="ticker" class="muted"></div></div><div><div id="price" class="price">—</div><div id="priceMeta" class="muted"></div></div></div>
<section class="card hero"><div id="status" class="notice">Loading live stock data…</div><div class="metrics"><div class="metric"><span class="muted">Score</span><b id="score">—</b></div><div class="metric"><span class="muted">Fundamentals</span><b id="fund">—</b></div><div class="metric"><span class="muted">Valuation</span><b id="val">—</b></div><div class="metric"><span class="muted">Sentiment</span><b id="sent">—</b></div><div class="metric"><span class="muted">Insider</span><b id="ins">—</b></div></div></section>
<nav class="tabs"><button class="tab active" data-tab="overview">Oversikt</button><button class="tab" data-tab="news">Nyheter</button><button class="tab" data-tab="insider">Insider</button><button class="tab" data-tab="reports">Rapporter</button><button class="tab" data-tab="dividend">Utbytte</button><button class="tab" data-tab="short">Short</button><button class="tab" data-tab="paper">Paper Trade</button><button class="tab" data-tab="backtest">Backtest</button></nav><section id="content"></section>
</main><script>
const API='https://nordicsignal-api.onrender.com',q=new URLSearchParams(location.search),ticker=(q.get('ticker')||'LSG').toUpperCase(),$=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));const money=n=>n==null?'—':Number(n).toLocaleString('no-NO',{maximumFractionDigits:2})+' kr',num=n=>n==null?'—':Number(n).toLocaleString('no-NO',{maximumFractionDigits:4});async function get(p){const r=await fetch(API+p);if(!r.ok)throw Error(p+' '+r.status);return r.json()}async function post(p,body={}){const r=await fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}async function safeGet(p,f){try{return await get(p)}catch(e){console.warn(p,e);return f}}let data={},stock={};
async function load(){const [s,quote,i,n,sh,reports,dividends]=await Promise.all([safeGet('/api/stocks/'+encodeURIComponent(ticker),{ticker,name:ticker}),safeGet('/api/quote/'+encodeURIComponent(ticker),{ticker,source:'unavailable'}),safeGet('/api/insider/'+encodeURIComponent(ticker),{ticker,items:[],status:'unavailable'}),safeGet('/api/news/'+encodeURIComponent(ticker),{ticker,items:[],status:'unavailable'}),safeGet('/api/short/'+encodeURIComponent(ticker),{ticker,items:[],status:'unavailable'}),safeGet('/api/reports/'+encodeURIComponent(ticker),{ticker,items:[],status:'unavailable'}),safeGet('/api/dividends/'+encodeURIComponent(ticker)+'?years=10',{ticker,items:[],status:'unavailable'})]);stock=s&&s.error?{ticker,name:ticker}:s;Object.assign(data,{quote,insider:i,news:n,short:sh,reports,dividends});$('name').textContent=stock.name||ticker;$('ticker').textContent=ticker+' · Oslo Børs';$('score').textContent=stock.score??'—';$('fund').textContent=stock.fundamentals??'—';$('val').textContent=stock.valuation??'—';$('sent').textContent=stock.sentiment??'—';$('ins').textContent=stock.insider??'—';$('price').textContent=quote.price==null?'—':Number(quote.price).toLocaleString('no-NO',{maximumFractionDigits:2})+' '+(quote.currency||'NOK');$('priceMeta').textContent=quote.price==null?'Live kurs utilgjengelig':((quote.change_pct>=0?'+':'')+num(quote.change_pct)+'% · '+(quote.source||'Yahoo Finance'));const quality=stock.live_verified?'LIVE':stock.partial_live?'PARTIAL LIVE':'STORED',bad=[];if(quote.price==null)bad.push('kurs');for(const [k,v] of [['insider',i],['nyheter',n],['short',sh],['rapporter',reports],['utbytte',dividends]])if(v.status==='unavailable')bad.push(k);$('status').innerHTML='Data: <b>'+esc(quality)+'</b> · sist oppdatert '+esc(stock.score_updated_at||stock.updated_at||'—')+(bad.length?' · utilgjengelig nå: '+esc(bad.join(', ')):'');render('overview')}
function tabs(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t))}function news(items){return items.length?items.map(x=>'<article class="item"><span class="pill">'+esc(x.category||'Nyhet')+'</span><h3>'+esc(x.title)+'</h3><div class="muted">'+esc(x.publisher||'—')+' · '+esc(x.published_at||'—')+'</div>'+(x.url?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener">Åpne originalkilde</a>':'')+'</article>').join(''):'<div class="notice">Ingen offentlige meldinger funnet.</div>'}
function insider(){const a=data.insider?.items||[];return '<section class="card"><h2>Insider · hvem kjøpte og solgte?</h2><div class="notice">Kun opplysninger som finnes i offentlig kilde vises. Ingen identiteter eller beløp gjettes.</div>'+(a.length?'<div class="tablewrap"><table><thead><tr><th>Dato</th><th>Handling</th><th>Person / foretak</th><th>Rolle</th><th>Antall</th><th>Pris</th><th>Verdi</th><th>Kilde</th></tr></thead><tbody>'+a.map(x=>{const actor=x.person||x.entity||x.insider||x.holder||'Ikke oppgitt i kilden',value=x.transaction_value??(x.shares!=null&&x.price!=null?x.shares*x.price:null);return '<tr><td>'+esc(x.trade_date||x.date||'—')+'</td><td><span class="pill '+(x.transaction_type==='sell'?'sell':'')+'">'+esc(x.transaction_type==='buy'?'KJØP':x.transaction_type==='sell'?'SALG':'ANNET')+'</span></td><td><b>'+esc(actor)+'</b></td><td>'+esc(x.role||'—')+'</td><td>'+num(x.shares)+'</td><td>'+money(x.price)+'</td><td>'+money(value)+'</td><td>'+(x.url?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener">Original</a>':'—')+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="notice">Ingen detaljerte offentlige insiderhandler tilgjengelig akkurat nå.</div>')+'</section>'}
function dividendView(){const d=data.dividends||{},items=d.items||[];return '<section class="card"><h2>Utbytte · '+esc(ticker)+'</h2><div class="metrics"><div class="metric"><span class="muted">Events (10 år)</span><b>'+esc(d.event_count??0)+'</b></div><div class="metric"><span class="muted">Siste utbytte/aksje</span><b>'+money(d.latest?.amount)+'</b></div><div class="metric"><span class="muted">Siste dato</span><b>'+esc(d.latest?.date||'—')+'</b></div><div class="metric"><span class="muted">Sum/aksje</span><b>'+money(d.total_per_share)+'</b></div><div class="metric"><span class="muted">Kilde</span><b style="font-size:13px">'+esc(d.source||'—')+'</b></div></div><div class="notice" style="margin-top:12px">Historiske utbytter brukes også av backtest-motoren for kontantutbytte eller reinvestering.</div>'+(items.length?'<div class="tablewrap"><table><thead><tr><th>Dato</th><th>Utbytte per aksje</th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+money(x.amount)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="notice">Ingen utbytte-events funnet i valgt periode.</div>')+'</section>'}
function render(t){tabs(t);if(t==='overview')$('content').innerHTML='<div class="grid"><section class="card"><h2>Hva skjer med '+esc(ticker)+'?</h2><div class="item"><b>Totalscore</b><div class="muted">'+esc(stock.score??'—')+'/100. Score og datadekning må vurderes sammen.</div></div><div class="item"><b>Signal</b><div class="muted">'+esc(stock.signal||'—')+'</div></div><div class="item"><b>Datadekning</b><div class="muted">'+esc(stock.live_verified?'Alle scorekomponenter verifisert':stock.partial_live?'Noe live-data mangler':'Lagret data')+'</div></div></section><section class="card"><h2>Siste nytt</h2>'+news((data.news?.items||[]).slice(0,6))+'</section></div>';else if(t==='news')$('content').innerHTML='<section class="card"><h2>Nyheter · '+esc(ticker)+'</h2>'+news(data.news?.items||[])+'</section>';else if(t==='insider')$('content').innerHTML=insider();else if(t==='reports')$('content').innerHTML='<section class="card"><h2>Rapporter og resultater</h2><div class="notice">Rapportfeed er separat fra vanlige nyheter og lenker til originalkilden.</div>'+news(data.reports?.items||[])+'</section>';else if(t==='dividend')$('content').innerHTML=dividendView();else if(t==='short')$('content').innerHTML='<section class="card"><h2>Short</h2><div class="metrics"><div class="metric"><span class="muted">Short %</span><b>'+esc(data.short?.short_percent_float??'—')+'</b></div><div class="metric"><span class="muted">Dato</span><b>'+esc(data.short?.latest_date||'—')+'</b></div><div class="metric"><span class="muted">Kilde</span><b style="font-size:13px">Finanstilsynet SSR</b></div></div><div class="item">'+((data.short?.items||[]).map(x=>'<b>'+esc(x.issuer_name||ticker)+'</b> · '+esc(x.date||'—')+' · '+esc(x.short_percent??'—')+'%').join('<br>')||'Ingen offentlig shortposisjon funnet.')+'</div></section>';else if(t==='paper')paper();else if(t==='backtest')backtest()}
function positionTable(a){return a.length?'<div class="tablewrap"><table><thead><tr><th>Ticker</th><th>Aksjer</th><th>Live kurs</th><th>Verdi</th><th>Kostpris</th><th>Urealisert P/L</th><th>Realisert P/L</th></tr></thead><tbody>'+a.map(x=>'<tr><td><b>'+esc(x.ticker)+'</b></td><td>'+num(x.shares)+'</td><td>'+money(x.price)+'</td><td>'+money(x.value)+'</td><td>'+money(x.cost_basis)+'</td><td class="'+(x.pnl!=null&&x.pnl>=0?'positive':'negative')+'">'+money(x.pnl)+(x.change_pct==null?'':' ('+num(x.change_pct)+'%)')+'</td><td>'+money(x.realized_pnl)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="notice">Ingen åpne paper-posisjoner.</div>'}function tradeTable(a){return a.length?'<div class="tablewrap"><table><thead><tr><th>Tid</th><th>Ticker</th><th>Side</th><th>Aksjer</th><th>Pris</th><th>Beløp</th><th>Gebyr</th><th>Notat</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.executed_at?new Date(x.executed_at).toLocaleString('no-NO'):'—')+'</td><td>'+esc(x.ticker)+'</td><td class="'+(x.side==='buy'?'positive':'negative')+'">'+(x.side==='buy'?'Kjøp':'Salg')+'</td><td>'+num(x.shares)+'</td><td>'+money(x.price)+'</td><td>'+money(Number(x.shares)*Number(x.price))+'</td><td>'+money(x.fee)+'</td><td>'+esc(x.note||'')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="notice">Ingen paper-handler registrert ennå.</div>'}
async function paper(){const [p,a,t]=await Promise.all([safeGet('/api/paper/portfolio',{positions:[]}),safeGet('/api/paper/account',{}),safeGet('/api/paper/trades?limit=100',{items:[]})]);const own=(p.positions||[]).find(x=>x.ticker===ticker);$('content').innerHTML='<div class="stack"><section class="card"><div class="toolbar"><div><h2>Paper Trading · '+esc(ticker)+'</h2><div class="muted">100 % simulert. Ingen ekte ordre sendes.</div></div><button class="btn danger" onclick="resetPaper()">Nullstill konto</button></div><div class="metrics"><div class="metric"><span class="muted">Startkapital</span><b>'+money(p.starting_cash??a.starting_cash)+'</b></div><div class="metric"><span class="muted">Cash</span><b>'+money(p.cash)+'</b></div><div class="metric"><span class="muted">Markedsverdi</span><b>'+money(p.market_value)+'</b></div><div class="metric"><span class="muted">Equity</span><b>'+money(p.equity)+'</b></div><div class="metric"><span class="muted">Total P/L</span><b class="'+(p.pnl>=0?'positive':'negative')+'">'+money(p.pnl)+' ('+num(p.pnl_pct)+'%)</b></div></div>'+(own?'<div class="notice" style="margin-top:12px">Din '+esc(ticker)+'-posisjon: '+num(own.shares)+' aksjer · verdi '+money(own.value)+' · urealisert P/L '+money(own.pnl)+'</div>':'')+'<div class="form"><label>Antall<input id="pshares" type="number" min="0.0001" step="0.0001" value="1"></label><label>Pris<input id="pprice" type="number" min="0" step="0.01" placeholder="Live"></label><label>Gebyr<input id="pfee" type="number" min="0" step="0.01" value="0"></label><label>Handling<select id="pside"><option value="buy">Kjøp</option><option value="sell">Salg</option></select></label></div><label class="muted">Notat<input id="pnote" class="wideinput" maxlength="240" placeholder="Hvorfor tok du handelen?"></label><button class="btn" style="margin-top:12px" onclick="trade()">Utfør paper trade</button><div id="tradeMsg" class="statusline muted"></div></section><section class="card"><h2>Åpne posisjoner</h2>'+positionTable(p.positions||[])+'</section><section class="card"><h2>Tradehistorikk</h2>'+tradeTable(t.items||[])+'</section></div>'}
async function trade(){const shares=Number($('pshares').value),fee=Number($('pfee').value||0),price=$('pprice').value?Number($('pprice').value):null,m=$('tradeMsg');if(!Number.isFinite(shares)||shares<=0){m.textContent='Feil: antall må være > 0';return}if(!Number.isFinite(fee)||fee<0){m.textContent='Feil: ugyldig gebyr';return}if(price!=null&&(!Number.isFinite(price)||price<=0)){m.textContent='Feil: ugyldig pris';return}try{m.textContent='Registrerer simulert handel…';await post('/api/paper/trades',{ticker,side:$('pside').value,shares,price,fee,note:$('pnote').value||null});await paper()}catch(e){m.textContent='Feil: '+e.message}}async function resetPaper(){if(!confirm('Nullstille alle paper-handler?'))return;try{await post('/api/paper/reset',{});await paper()}catch(e){alert(e.message)}}
async function backtest(){const s=new Date();s.setFullYear(s.getFullYear()-2);$('content').innerHTML='<section class="card"><h2>Backtest · '+esc(ticker)+'</h2><div class="form"><label>Fra<input id="btstart" type="date" value="'+s.toISOString().slice(0,10)+'"></label><label>Til<input id="btend" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label><label>Startkapital<input id="btcash" type="number" value="100000"></label><label>Månedlig<input id="btmonth" type="number" value="5000"></label><label>Strategi<select id="btstrategy"><option value="dca">Månedlig investering</option><option value="lump_sum">Alt inn</option><option value="sma_cross">50/200 SMA</option></select></label><label>Utbytte<select id="btd"><option value="true">Reinvester</option><option value="false">Kontant</option></select></label><label>Gebyr %<input id="btfee" type="number" min="0" step="0.01" value="0"></label><label>Fast gebyr<input id="btfixed" type="number" min="0" step="0.01" value="0"></label></div><button class="btn" style="margin-top:12px" onclick="runBacktest()">Kjør backtest</button><div id="btresult" style="margin-top:15px"></div></section>'}async function runBacktest(){const qs=new URLSearchParams({ticker,start:$('btstart').value,end:$('btend').value,initial_cash:$('btcash').value,monthly_investment:$('btmonth').value,reinvest_dividends:$('btd').value,fee_pct:$('btfee').value,fixed_fee:$('btfixed').value,strategy:$('btstrategy').value,benchmark:'^OSEBX'});try{const d=await get('/api/paper/backtest?'+qs),x=d.xirr==null?'—':num(d.xirr*100)+'%';$('btresult').innerHTML='<div class="metrics"><div class="metric"><span class="muted">Investert</span><b>'+money(d.invested)+'</b></div><div class="metric"><span class="muted">Sluttverdi</span><b>'+money(d.final_equity)+'</b></div><div class="metric"><span class="muted">Avkastning</span><b class="'+(d.return>=0?'positive':'negative')+'">'+money(d.return)+' ('+num(d.return_pct)+'%)</b></div><div class="metric"><span class="muted">XIRR</span><b>'+x+'</b></div><div class="metric"><span class="muted">Utbytte</span><b>'+money(d.dividends)+'</b></div></div><div class="notice" style="margin-top:12px">Utbytte-events: '+esc(d.dividend_events)+' · Gebyrer: '+money(d.fees_paid)+' · Benchmark: '+(d.benchmark?money(d.benchmark.final_equity):'ikke tilgjengelig')+'</div>'}catch(e){$('btresult').innerHTML='<div class="notice">Backtest feilet: '+esc(e.message)+'</div>'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));load();
</script></body></html>
