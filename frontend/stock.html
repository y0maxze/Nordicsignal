<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NordicSignal · Stock Intelligence</title><style>:root{--bg:#07111f;--p:#0d1b2d;--p2:#10243a;--line:#20354d;--t:#eef5ff;--m:#91a5bd;--g:#35d49a;--y:#f3c95b;--r:#fb7185;--b:#65a9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#112942,#07111f 45%);color:var(--t);font:14px system-ui,-apple-system,sans-serif}.wrap{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}.muted{color:var(--m);font-size:12px}.card{background:rgba(13,27,45,.96);border:1px solid var(--line);border-radius:14px;padding:18px}.hero{margin-top:20px}.price{font-size:40px;font-weight:850}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}.metric{background:#0a1727;border-radius:10px;padding:13px}.metric b{font-size:20px;display:block;margin-top:5px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 12px}.tab,.btn{border:1px solid var(--line);background:var(--p2);color:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.tab.active,.btn.active{border-color:#5b83a8;background:#17324d}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.item{border-top:1px solid var(--line);padding:14px 0}.item:first-child{border-top:0}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#0c3027;color:var(--g);font-size:11px;font-weight:750}.sell{background:#351522;color:var(--r)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--m)}a{color:var(--b)}button{font:inherit}.notice{padding:12px;background:#0a1727;border:1px solid var(--line);border-radius:10px;color:var(--m);margin-bottom:12px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form label{display:flex;flex-direction:column;gap:5px;color:var(--m);font-size:12px}.form input,.form select{background:#07111f;border:1px solid var(--line);border-radius:8px;color:#fff;padding:9px}.positive{color:var(--g)}.negative{color:var(--r)}@media(max-width:900px){.metrics,.form{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:550px){.wrap{padding:16px}.metrics,.form{grid-template-columns:1fr}.top{display:block}}</style></head><body><main class="wrap"><div class="top"><div><div class="muted">NORDICSIGNAL · STOCK INTELLIGENCE</div><h1 id="name">Loading…</h1><div id="ticker" class="muted"></div></div><div id="price" class="price">—</div></div><section class="card hero"><div id="status" class="notice">Loading live stock data…</div><div class="metrics"><div class="metric"><span class="muted">Score</span><b id="score">—</b></div><div class="metric"><span class="muted">Fundamentals</span><b id="fund">—</b></div><div class="metric"><span class="muted">Valuation</span><b id="val">—</b></div><div class="metric"><span class="muted">Sentiment</span><b id="sent">—</b></div><div class="metric"><span class="muted">Insider</span><b id="ins">—</b></div></div></section><nav class="tabs"><button class="tab active" data-tab="overview">Oversikt</button><button class="tab" data-tab="news">Nyheter</button><button class="tab" data-tab="insider">Insider</button><button class="tab" data-tab="reports">Rapporter</button><button class="tab" data-tab="dividend">Utbytte</button><button class="tab" data-tab="short">Short</button><button class="tab" data-tab="paper">Paper Trade</button><button class="tab" data-tab="backtest">Backtest</button></nav><section id="content"></section></main><script>const API='https://nordicsignal-api.onrender.com',q=new URLSearchParams(location.search),ticker=(q.get('ticker')||'LSG').toUpperCase(),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),money=n=>n==null?'—':Number(n).toLocaleString('no-NO',{maximumFractionDigits:2})+' kr',num=n=>n==null?'—':Number(n).toLocaleString('no-NO',{maximumFractionDigits:4}),get=async p=>{const r=await fetch(API+p);if(!r.ok)throw Error(p+' '+r.status);return r.json()};let data={},stock={};async function load(){try{const [s,i,n,sh]=await Promise.all([get('/api/stocks'),get('/api/insider/'+encodeURIComponent(ticker)),get('/api/news/'+encodeURIComponent(ticker)),get('/api/short/'+encodeURIComponent(ticker))]);stock=(s.items||[]).find(x=>x.ticker===ticker)||{ticker,name:ticker};Object.assign(data,{insider:i,news:n,short:sh});$('name').textContent=stock.name||ticker;$('ticker').textContent=ticker+' · Oslo Børs';$('score').textContent=stock.score??'—';$('fund').textContent=stock.fundamentals??'—';$('val').textContent=stock.valuation??'—';$('sent').textContent=stock.sentiment??'—';$('ins').textContent=stock.insider??'—';$('status').innerHTML='Data: <b>'+esc(stock.live_verified?'LIVE':stock.partial_live?'PARTIAL LIVE':'STORED')+'</b> · sist oppdatert '+esc(stock.score_updated_at||'—');render('overview')}catch(e){$('status').textContent='Kunne ikke hente live data akkurat nå.';console.error(e)}}function tabs(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t))}function news(items){return items.length?items.map(x=>'<article class="item"><span class="pill">'+esc(x.category||'Nyhet')+'</span><h3>'+esc(x.title)+'</h3><div class="muted">'+esc(x.publisher||'—')+' · '+esc(x.published_at||'—')+'</div>'+(x.url?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener">Åpne originalkilde</a>':'')+'</article>').join(''):'<div class="notice">Ingen offentlige meldinger funnet.</div>'}function insider(d){const a=d?.items||[];return '<section class="card"><h2>Insider · hvem kjøpte og solgte?</h2><div class="notice">Vi viser kun opplysninger som faktisk finnes i den offentlige meldingen. Ingen identiteter eller beløp gjettes.</div>'+(a.length?'<table><thead><tr><th>Dato</th><th>Handling</th><th>Person / foretak</th><th>Antall</th><th>Pris</th><th>Verdi</th><th>Kilde</th></tr></thead><tbody>'+a.map(x=>{const value=x.shares&&x.price?x.shares*x.price:null;return '<tr><td>'+esc(x.trade_date||'—')+'</td><td><span class="pill '+(x.transaction_type==='sell'?'sell':'')+'">'+esc(x.transaction_type==='buy'?'KJØP':x.transaction_type==='sell'?'SALG':'ANNET')+'</span></td><td><b>'+esc(x.person||x.holder||x.entity||'Ikke oppgitt i kilden')+'</b><div class="muted">'+esc(x.title||'Primary insider disclosure')+'</div></td><td>'+num(x.shares)+'</td><td>'+money(x.price)+'</td><td>'+money(value)+'</td><td>'+(x.url?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener">Euronext</a>':'—')+'</td></tr>'}).join('')+'</tbody></table>':'<div class="notice">Ingen detaljerte offentlige insiderhandler tilgjengelig akkurat nå.</div>')+'</section>'}function render(t){tabs(t);if(t==='overview')$('content').innerHTML='<div class="grid"><section class="card"><h2>Hva skjer med '+esc(ticker)+'?</h2><div class="item"><b>Totalscore</b><div class="muted">'+esc(stock.score??'—')+'/100. Komponentene og datadekningen må vurderes sammen.</div></div><div class="item"><b>Signal</b><div class="muted">'+esc(stock.signal||'—')+'</div></div><div class="item"><b>Datadekning</b><div class="muted">'+esc(stock.live_verified?'Alle scorekomponenter verifisert':stock.partial_live?'Noe live-data mangler':'Lagret data')+'</div></div></section><section class="card"><h2>Siste nytt</h2>'+news((data.news?.items||[]).slice(0,6))+'</section></div>';else if(t==='news')$('content').innerHTML='<section class="card"><h2>Nyheter · '+esc(ticker)+'</h2><div class="muted">Siste offentlige nyheter og selskapsmeldinger.</div>'+news(data.news?.items||[])+'</section>';else if(t==='insider')$('content').innerHTML=insider(data.insider);else if(t==='reports')$('content').innerHTML='<section class="card"><h2>Rapporter og resultater</h2><div class="notice">Rapportklassifiserte meldinger filtreres fra nyhetsfeeden. Originalkilden åpnes direkte.</div>'+news((data.news?.items||[]).filter(x=>x.category==='Rapport'||/report|result|earnings|quarter|årsrapport/i.test(x.title||'')))+'</section>';else if(t==='dividend')$('content').innerHTML='<section class="card"><h2>Utbytte</h2><div class="notice">Utbytte brukes også i backtest-motoren, med separat behandling for kontantutbytte og reinvestering.</div><button class="btn" onclick="render(\'backtest\')">Test reinvestert utbytte</button></section>';else if(t==='short')$('content').innerHTML='<section class="card"><h2>Short</h2><div class="metrics"><div class="metric"><span class="muted">Short %</span><b>'+esc(data.short?.short_percent_float??'—')+'</b></div><div class="metric"><span class="muted">Dato</span><b>'+esc(data.short?.latest_date||'—')+'</b></div><div class="metric"><span class="muted">Kilde</span><b style="font-size:13px">Finanstilsynet SSR</b></div></div><div class="item">'+((data.short?.items||[]).map(x=>'<b>'+esc(x.issuer_name||ticker)+'</b> · '+esc(x.date||'—')+' · '+esc(x.short_percent??'—')+'%').join('<br>')||'Ingen offentlig shortposisjon funnet.')+'</div></section>';else if(t==='paper')paper();else if(t==='backtest')backtest()}async function paper(){let p;try{p=await get('/api/paper/portfolio')}catch{p={cash:100000,equity:100000,positions:[]}}$('content').innerHTML='<section class="card"><h2>Paper Trading · '+esc(ticker)+'</h2><div class="notice">100 % simulert. Ingen ekte ordre sendes.</div><div class="metrics"><div class="metric"><span class="muted">Equity</span><b>'+money(p.equity)+'</b></div><div class="metric"><span class="muted">Cash</span><b>'+money(p.cash)+'</b></div><div class="metric"><span class="muted">P/L</span><b class="'+(p.pnl>=0?'positive':'negative')+'">'+money(p.pnl)+' ('+num(p.pnl_pct)+'%)</b></div></div><div class="form" style="margin-top:15px"><label>Antall<input id="pshares" type="number" min="0.0001" step="0.0001" value="1"></label><label>Pris<input id="pprice" type="number" min="0" step="0.01" placeholder="Live"></label><label>Gebyr<input id="pfee" type="number" min="0" step="0.01" value="0"></label><label>Handling<select id="pside"><option value="buy">Kjøp</option><option value="sell">Salg</option></select></label></div><button class="btn" style="margin-top:12px" onclick="trade()">Utfør paper trade</button><div id="tradeMsg" class="muted" style="margin-top:10px"></div></section>'}async function trade(){const body={ticker,side:$('pside').value,shares:Number($('pshares').value),price:$('pprice').value?Number($('pprice').value):null,fee:Number($('pfee').value||0)};try{const r=await fetch(API+'/api/paper/trades',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.detail||'Trade failed');$('tradeMsg').textContent='Handel registrert. Equity: '+money(d.portfolio.equity);paper()}catch(e){$('tradeMsg').textContent='Feil: '+e.message}}async function backtest(){const start=new Date();start.setFullYear(start.getFullYear()-2);$('content').innerHTML='<section class="card"><h2>Backtest · '+esc(ticker)+'</h2><div class="form"><label>Fra<input id="btstart" type="date" value="'+start.toISOString().slice(0,10)+'"></label><label>Til<input id="btend" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label><label>Startkapital<input id="btcash" type="number" value="100000"></label><label>Månedlig<input id="btmonth" type="number" value="5000"></label><label>Strategi<select id="btstrategy"><option value="dca">Månedlig investering</option><option value="lump_sum">Alt inn med en gang</option><option value="sma_cross">50/200 SMA</option></select></label><label>Utbytte<select id="btd"> <option value="true">Reinvester</option><option value="false">Kontant</option></select></label><label>Gebyr %<input id="btfee" type="number" step="0.01" value="0"></label><label>Fast gebyr<input id="btfixed" type="number" step="0.01" value="0"></label></div><button class="btn" style="margin-top:12px" onclick="runBacktest()">Kjør backtest</button><div id="btresult" style="margin-top:15px"></div></section>'}async function runBacktest(){const qs=new URLSearchParams({ticker,start:$('btstart').value,end:$('btend').value,initial_cash:$('btcash').value,monthly_investment:$('btmonth').value,reinvest_dividends:$('btd').value,fee_pct:$('btfee').value,fixed_fee:$('btfixed').value,strategy:$('btstrategy').value,benchmark:'^OSEBX'});try{const d=await get('/api/paper/backtest?'+qs);$('btresult').innerHTML='<div class="metrics"><div class="metric"><span class="muted">Investert</span><b>'+money(d.invested)+'</b></div><div class="metric"><span class="muted">Sluttverdi</span><b>'+money(d.final_equity)+'</b></div><div class="metric"><span class="muted">Avkastning</span><b class="'+(d.return>=0?'positive':'negative')+'">'+money(d.return)+' ('+num(d.return_pct)+'%)</b></div><div class="metric"><span class="muted">XIRR</span><b>'+num(d.xirr*100)+'%</b></div><div class="metric"><span class="muted">Utbytte</span><b>'+money(d.dividends)+'</b><span class="muted">'+esc(d.dividend_events)+' events</span></div></div><div class="notice" style="margin-top:12px">Gebyrer: '+money(d.fees_paid)+' · Aksjer: '+num(d.shares)+' · Benchmark: '+(d.benchmark?money(d.benchmark.final_equity):'ikke tilgjengelig')+'</div>'}catch(e){$('btresult').innerHTML='<div class="notice">Backtest feilet: '+esc(e.message)+'</div>'}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));load();</script></body></html>
