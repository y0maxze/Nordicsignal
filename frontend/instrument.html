<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NordicSignal · Instrument Intelligence</title>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1500px;margin:auto;padding:30px}.home{display:inline-flex;margin-bottom:22px;text-decoration:none;font-weight:850;font-size:18px}.home span{color:#18c984}.top,.toolbar{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.eyebrow,.muted,.small{color:#999;font-size:12px}.titleline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.type{border:1px solid #343434;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;color:#ddd;background:#151515}.price{font-size:40px;font-weight:850;text-align:right}.card{background:#0e0e0e;border:1px solid #292929;border-radius:12px;padding:18px}.hero{margin-top:20px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}.metric{background:#101010;border:1px solid #252525;border-radius:10px;padding:13px}.metric b{font-size:19px;display:block;margin-top:5px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 12px}.tab,.btn{border:1px solid #303030;background:#151515;color:#f4f4f4;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:650}.tab.active,.btn.active{background:#f3f3f3;color:#090909}.tab.dim{opacity:.55}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.item{border-top:1px solid #252525;padding:14px 0}.item:first-child{border:0}.notice{padding:12px;border:1px solid #292929;border-radius:10px;color:#aaa;background:#101010;margin-bottom:12px}.notice.accent{border-left:3px solid #35d99b}.positive{color:#35d99b}.negative{color:#ff7586}.chart{height:330px;margin-top:14px;border:1px solid #202020;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent)}.chart svg{width:100%;height:100%;display:block}.chartbar{display:flex;gap:6px;flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid #252525;white-space:nowrap}th{font-size:11px;color:#999}.pill{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid #333;font-size:10px;font-weight:800}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form label{display:flex;flex-direction:column;gap:5px;color:#999;font-size:12px}.form input,.form select{background:#0b0b0b;border:1px solid #303030;color:#fff;border-radius:8px;padding:9px}.signalGuide{display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin-top:12px}.light{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px}.green{background:#35d99b}.yellow{background:#e7c16b}.red{background:#ff7586}.analyticsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}.analyticsBox{background:#101010;border:1px solid #252525;border-radius:10px;padding:13px}.analyticsBox span{display:block;color:#999;font-size:11px;margin-bottom:6px}.analyticsBox b{font-size:18px}.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.estimate{margin-top:10px;padding:10px 12px;border:1px solid #292929;border-radius:9px;background:#0b0b0b;color:#aaa}.estimate b{color:#f3f3f3}.paperHolding{margin-top:10px;color:#aaa;font-size:12px}.sourceLink{display:inline-block;margin-top:7px}.sectionGap{margin-top:14px}@media(max-width:900px){.metrics,.form,.analyticsGrid{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:550px){.wrap{padding:16px}.metrics,.form,.analyticsGrid{grid-template-columns:1fr}.price{font-size:30px;text-align:left}}
</style>
</head>
<body><main class="wrap">
<a class="home" href="/app">Nordic<span>Signal</span></a>
<div class="top"><div><div class="eyebrow">NORDICSIGNAL · INSTRUMENT INTELLIGENCE</div><div class="titleline"><h1 id="name">Laster…</h1><span id="type" class="type">—</span></div><div id="ticker" class="muted"></div></div><div><div id="price" class="price">—</div><div id="priceMeta" class="muted"></div></div></div>
<section class="card hero"><div id="status" class="notice">Laster markedsdata…</div><div class="metrics" id="heroMetrics"><div class="metric"><span class="muted">Dagens endring</span><b id="m1">—</b></div><div class="metric"><span class="muted">Forrige slutt</span><b id="m2">—</b></div><div class="metric"><span class="muted">Dagens høy</span><b id="m3">—</b></div><div class="metric"><span class="muted">Dagens lav</span><b id="m4">—</b></div><div class="metric"><span class="muted">Volum</span><b id="m5">—</b></div></div><div class="signalGuide"><span><i class="light green"></i>KJØP / STRONG</span><span><i class="light yellow"></i>WATCH / NEUTRAL</span><span><i class="light red"></i>SELL / RISK</span></div></section>
<nav class="tabs"><button class="tab active" data-tab="overview">Oversikt</button><button class="tab" data-tab="news">Nyheter</button><button class="tab" data-tab="insider">Insider</button><button class="tab" data-tab="reports">Rapporter</button><button class="tab" data-tab="dividend" id="distributionTab">Utbytte</button><button class="tab" data-tab="short">Short</button><button class="tab" data-tab="paper">Paper Trade</button><button class="tab" data-tab="backtest">Backtest</button></nav>
<section id="content"></section>
</main>
<script>
const API='/api',q=new URLSearchParams(location.search),symbol=(q.get('symbol')||q.get('ticker')||'').trim(),hintName=q.get('name')||'',hintType=q.get('type')||'',hintExchange=q.get('exchange')||'',hintCurrency=q.get('currency')||'';
const $=id=>document.getElementById(id),esc=v=>String(v==null?'':v).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),num=(v,d=2)=>v==null||!Number.isFinite(Number(v))?'—':Number(v).toLocaleString('no-NO',{maximumFractionDigits:d}),pct=v=>v==null||!Number.isFinite(Number(v))?'—':`${Number(v)>=0?'+':''}${num(v,2)}%`;
let instrument={},analytics={},newsData={items:[]},distData={items:[]},historyCache={};
const money=(v,currency)=>v==null?'—':num(v,2)+' '+(currency||instrument.currency||'');
async function request(path,opt={}){const r=await fetch(API+path,{cache:'no-store',...opt,headers:{'content-type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}
function baseTicker(){return symbol.toUpperCase().endsWith('.OL')?symbol.slice(0,-3).toUpperCase():null}
function isOsloEquity(){return instrument.quote_type==='EQUITY'&&!!baseTicker()}
function isFund(){return String(instrument.quote_type||'').toUpperCase()==='MUTUALFUND'||instrument.asset_class==='Fond'}
function tabs(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t))}
function chartSvg(items){const pts=(items||[]).filter(x=>Number.isFinite(Number(x.close)));if(pts.length<2)return '<div class="notice">Ikke nok kurshistorikk.</div>';const vals=pts.map(x=>Number(x.close)),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1,path=pts.map((x,i)=>`${i?'L':'M'} ${25+(i/(pts.length-1))*950} ${285-((Number(x.close)-min)/span)*250}`).join(' ');return `<svg viewBox="0 0 1000 310" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="#35d99b" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>`}
async function loadHistory(period='1y'){const box=$('historyChart');if(!box)return;box.innerHTML='<div class="notice">Laster kurshistorikk…</div>';try{const d=historyCache[period]||await request('/instrument/'+encodeURIComponent(symbol)+'/history?period='+encodeURIComponent(period));historyCache[period]=d;box.innerHTML=chartSvg(d.items||[])}catch(e){box.innerHTML='<div class="notice">Kurshistorikk utilgjengelig.</div>'}}
function periodButtons(){return [['now','Nå'],['1d','Dag'],['1w','Uke'],['1m','Måned'],['3m','3 mnd'],['6m','6 mnd'],['1y','År'],['5y','5 år'],['10y','10 år'],['max','Max']].map((x,i)=>`<button class="btn ${i===6?'active':''}" data-period="${x[0]}">${x[1]}</button>`).join('')}
function newsHtml(items){return items?.length?items.map(x=>`<article class="item"><span class="pill">${esc(x.category||'Nyhet')}</span><h3>${esc(x.title)}</h3><div class="muted">${esc(x.publisher||'—')} · ${esc(x.published_at?new Date(x.published_at).toLocaleString('no-NO'):'—')}</div>${x.url?`<a class="sourceLink" href="${esc(x.url)}" target="_blank" rel="noopener">Åpne originalkilde</a>`:''}</article>`).join(''):'<div class="notice">Ingen relevante offentlige nyheter funnet akkurat nå.</div>'}
function unavailable(title,text){return `<section class="card"><h2>${esc(title)}</h2><div class="notice">${esc(text)}</div></section>`}
function setHero(){const labels=[...document.querySelectorAll('#heroMetrics .muted')],values=[$('m1'),$('m2'),$('m3'),$('m4'),$('m5')];if(isFund()){const rows=[['1 måned',analytics.return_1m_pct],['3 måneder',analytics.return_3m_pct],['År hittil',analytics.return_ytd_pct],['1 år',analytics.return_1y_pct],['Volatilitet 1 år',analytics.volatility_1y_pct]];rows.forEach((r,i)=>{labels[i].textContent=r[0];values[i].textContent=i===4?(r[1]==null?'—':num(r[1],2)+'%'):pct(r[1]);values[i].className=i===4?'':r[1]==null?'':Number(r[1])>=0?'positive':'negative'});$('status').innerHTML=`Data: <b>SISTE TILGJENGELIGE NAV/KURS</b> · Fond · kilde ${esc(instrument.source||'Yahoo Finance')}. Fond handles normalt til ukjent kurs, så dette er ikke en sanntids børskurs.`;$('priceMeta').textContent='Siste rapporterte NAV/kurs · fondsordre avregnes normalt senere til ukjent kurs';$('distributionTab').textContent='Utdelinger';document.querySelectorAll('.tab[data-tab="insider"],.tab[data-tab="short"]').forEach(x=>{x.classList.add('dim');x.title='Denne datatypen er normalt ikke relevant eller tilgjengelig for tradisjonelle fond'})}else{const rows=[['Dagens endring',instrument.change_pct==null?'—':pct(instrument.change_pct)],['Forrige slutt',money(instrument.previous_close)],['Dagens høy',money(instrument.day_high)],['Dagens lav',money(instrument.day_low)],['Volum',instrument.volume==null?'—':Number(instrument.volume).toLocaleString('no-NO')]];rows.forEach((r,i)=>{labels[i].textContent=r[0];values[i].textContent=r[1]});values[0].className=instrument.change_pct==null?'':instrument.change_pct>=0?'positive':'negative';$('status').innerHTML=`Data: <b>LIVE MARKEDSDATA</b> · ${esc(instrument.asset_class||'Instrument')} · kilde ${esc(instrument.source||'Yahoo Finance')}`;$('priceMeta').textContent=instrument.change_pct==null?'Dagens endring utilgjengelig':pct(instrument.change_pct)+' · '+(instrument.source||'Yahoo Finance')}}
function analyticsPanel(){return `<section class="card sectionGap"><div class="toolbar"><div><h2 style="margin:0">${isFund()?'Fondanalyse':'Historisk analyse'}</h2><div class="muted">Beregnet direkte fra instrumentets egen pris/NAV-historikk. Dette er beskrivende statistikk, ikke et kjøpssignal.</div></div></div><div class="analyticsGrid"><div class="analyticsBox"><span>1 måned</span><b class="${Number(analytics.return_1m_pct)>=0?'positive':'negative'}">${pct(analytics.return_1m_pct)}</b></div><div class="analyticsBox"><span>3 måneder</span><b class="${Number(analytics.return_3m_pct)>=0?'positive':'negative'}">${pct(analytics.return_3m_pct)}</b></div><div class="analyticsBox"><span>År hittil</span><b class="${Number(analytics.return_ytd_pct)>=0?'positive':'negative'}">${pct(analytics.return_ytd_pct)}</b></div><div class="analyticsBox"><span>1 år</span><b class="${Number(analytics.return_1y_pct)>=0?'positive':'negative'}">${pct(analytics.return_1y_pct)}</b></div></div><div class="analyticsGrid"><div class="analyticsBox"><span>3 år annualisert</span><b>${pct(analytics.cagr_3y_pct)}</b></div><div class="analyticsBox"><span>5 år annualisert</span><b>${pct(analytics.cagr_5y_pct)}</b></div><div class="analyticsBox"><span>Volatilitet 1 år</span><b>${analytics.volatility_1y_pct==null?'—':num(analytics.volatility_1y_pct,2)+'%'}</b></div><div class="analyticsBox"><span>Maks fall siste år</span><b class="negative">${analytics.max_drawdown_1y_pct==null?'—':num(analytics.max_drawdown_1y_pct,2)+'%'}</b></div></div><div class="analyticsGrid"><div class="analyticsBox"><span>52 uker høy</span><b>${money(analytics.high_52w)}</b></div><div class="analyticsBox"><span>52 uker lav</span><b>${money(analytics.low_52w)}</b></div><div class="analyticsBox"><span>50d snitt</span><b>${money(analytics.sma_50)}</b></div><div class="analyticsBox"><span>200d trend</span><b>${analytics.above_sma_200==null?'—':analytics.above_sma_200?'Over 200d snitt':'Under 200d snitt'}</b></div></div></section>`}
async function render(tab){tabs(tab);if(tab==='overview'){$('content').innerHTML=`<div class="grid"><section class="card"><div class="toolbar"><div><h2 style="margin:0">Kursutvikling</h2><div class="muted">${esc(instrument.name||symbol)} · ${esc(instrument.exchange||'Marked')}</div></div><div class="chartbar" id="periods">${periodButtons()}</div></div><div id="historyChart" class="chart"></div></section><section class="card"><h2>Nøkkeldata</h2><div class="item"><b>Instrumenttype</b><div class="muted">${esc(instrument.asset_class||'Øvrig')} · ${esc(instrument.quote_type||'—')}</div></div><div class="item"><b>Marked</b><div class="muted">${esc(instrument.exchange||'—')}</div></div><div class="item"><b>Valuta</b><div class="muted">${esc(instrument.currency||'—')}</div></div><div class="item"><b>52 uker høy / lav</b><div class="muted">${money(analytics.high_52w??instrument.fifty_two_week_high)} / ${money(analytics.low_52w??instrument.fifty_two_week_low)}</div></div><div class="item"><b>NordicSignal-score</b><div class="muted">Globale fond/ETF-er og aksjer utenfor det scorede Oslo-universet får ikke en oppdiktet score. Markedsdata og tilgjengelige verktøy vises likevel på samme instrumentside.</div></div>${isFund()?'<div class="item"><b>Fondsordre</b><div class="muted">Tradisjonelle fond kjøpes normalt i pengebeløp. Eksakt antall andeler bestemmes først når ordren avregnes til fondets NAV.</div></div>':''}</section></div>${analyticsPanel()}`;document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-period]').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadHistory(b.dataset.period)});loadHistory('1y')}
else if(tab==='news')$('content').innerHTML=`<section class="card"><h2>Nyheter · ${esc(instrument.name||symbol)}</h2>${newsHtml(newsData.items)}</section>`;
else if(tab==='insider'){if(isOsloEquity()){const d=await request('/insider/'+encodeURIComponent(baseTicker())).catch(()=>({items:[]}));$('content').innerHTML=`<section class="card"><h2>Insider</h2>${d.items?.length?d.items.map(x=>`<div class="item"><b>${esc(x.person||x.entity||x.insider||'Offentlig insider')}</b><div class="muted">${esc(x.transaction_type||'')} · ${num(x.shares,0)} aksjer · ${money(x.price,'NOK')}</div>${x.url?`<a class="sourceLink" href="${esc(x.url)}" target="_blank" rel="noopener">Originalkilde</a>`:''}</div>`).join(''):'<div class="notice">Ingen verifiserte offentlige insiderhandler funnet.</div>'}</section>`}else $('content').innerHTML=unavailable('Insider',isFund()?'Insiderhandel er ikke en relevant offentlig dataserie for et tradisjonelt verdipapirfond. NordicSignal viser derfor ikke gjetninger.':'Insiderregisteret vårt er koblet mot offentlige Oslo Børs/Euronext-meldinger. Dette instrumentet er ikke en støttet Oslo-notert aksje.')}
else if(tab==='reports'){if(isOsloEquity()){const d=await request('/reports/'+encodeURIComponent(baseTicker())).catch(()=>({items:[]}));$('content').innerHTML=`<section class="card"><h2>Rapporter og resultater</h2>${newsHtml(d.items||[])}</section>`}else $('content').innerHTML=`<section class="card"><h2>${isFund()?'Fondsdokumenter / relevante saker':'Rapporter og dokumenter'}</h2><div class="notice">NordicSignal har foreløpig ikke en verifisert separat dokumentfeed for dette instrumentet. Relevante publiserte saker vises under Nyheter.</div>${newsHtml(newsData.items.slice(0,8))}</section>`}
else if(tab==='dividend')$('content').innerHTML=`<section class="card"><h2>${isFund()?'Utdelinger':'Utbytte / utdelinger'}</h2><div class="metrics"><div class="metric"><span class="muted">Registrerte events</span><b>${distData.event_count??0}</b></div><div class="metric"><span class="muted">Siste utdeling</span><b>${money(distData.latest?.amount)}</b></div><div class="metric"><span class="muted">Siste dato</span><b>${esc(distData.latest?.date||'—')}</b></div><div class="metric"><span class="muted">Sum events</span><b>${money(distData.total_per_unit)}</b></div><div class="metric"><span class="muted">Kilde</span><b style="font-size:12px">${esc(distData.source||'Yahoo Finance')}</b></div></div>${distData.items?.length?`<div class="tablewrap sectionGap"><table><thead><tr><th>Dato</th><th>Beløp per enhet</th></tr></thead><tbody>${distData.items.map(x=>`<tr><td>${esc(x.date)}</td><td>${money(x.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="notice sectionGap">Ingen utdelinger funnet i tilgjengelig historikk.</div>'}</section>`;
else if(tab==='short'){if(isOsloEquity()){const d=await request('/short/'+encodeURIComponent(baseTicker())).catch(()=>({}));$('content').innerHTML=`<section class="card"><h2>Short</h2><div class="metrics"><div class="metric"><span class="muted">Offentlig short %</span><b>${d.short_percent_float??'—'}</b></div><div class="metric"><span class="muted">Dato</span><b>${esc(d.latest_date||'—')}</b></div></div><div class="notice sectionGap">Kilde: Finanstilsynets offentlige shortregister.</div></section>`}else $('content').innerHTML=unavailable('Short',isFund()?'Tradisjonelle fond har ikke en direkte offentlig shortprosent som gir mening på samme måte som en børsnotert aksje.':'NordicSignals verifiserte shortdata er foreløpig knyttet til det norske offentlige shortregisteret.')}
else if(tab==='paper')await renderPaper();
else if(tab==='backtest')renderBacktest()}
async function renderPaper(){if(isFund()){const c=instrument.currency||'NOK',p=Number(instrument.price);$('content').innerHTML=`<section class="card"><h2>Paper Trade · ${esc(instrument.name||symbol)}</h2><div class="notice accent"><b>Fondordre i beløp.</b> Du oppgir hvor mye penger du vil kjøpe eller selge for, ikke et kjent antall fondsandeler. En ekte fondsordre handles normalt til ukjent kurs. NordicSignal bruker siste viste NAV/kurs til å beregne et <b>estimert</b> antall andeler i simuleringen.</div><form id="paperFundForm" class="form"><label>Side<select id="paperSide"><option value="buy">Kjøp</option><option value="sell">Selg</option></select></label><label>Beløp · ${esc(c)}<input id="paperAmount" type="number" min="1" step="any" value="10000" required></label><label>NAV/kurs brukt i estimat<input id="paperPrice" type="number" value="${Number.isFinite(p)?p:''}" readonly></label><label>Gebyr · ${esc(c)}<input id="paperFee" type="number" min="0" step="any" value="0"></label><button class="btn" type="submit">Registrer paperordre</button></form><div class="quick"><button class="btn" type="button" data-amt="1000">1 000</button><button class="btn" type="button" data-amt="5000">5 000</button><button class="btn" type="button" data-amt="10000">10 000</button><button class="btn" type="button" data-amt="25000">25 000</button><button class="btn" type="button" data-amt="50000">50 000</button></div><div id="paperEstimate" class="estimate"></div><div id="paperHolding" class="paperHolding"></div><div id="paperStatus" class="muted sectionGap"></div></section>`;const amount=$('paperAmount'),estimate=$('paperEstimate'),refresh=()=>{const a=Number(amount.value);estimate.innerHTML=a>0&&p>0?`Estimert beholdningsendring: <b>${num(a/p,6)} andeler</b> ved NAV/kurs ${num(p,2)} ${esc(c)}. Endelig andelstall i en ekte fondsordre er ukjent når ordren legges.`:'Oppgi et gyldig beløp.'};amount.oninput=refresh;refresh();document.querySelectorAll('[data-amt]').forEach(b=>b.onclick=()=>{amount.value=b.dataset.amt;refresh()});try{const d=await request('/paper/portfolio'),pos=(d.positions||[]).find(x=>String(x.ticker||'').toUpperCase()===symbol.toUpperCase());$('paperHolding').textContent=pos?`Nåværende paperbeholdning: ${num(pos.shares,6)} andeler · verdi ${money(pos.value,c)}`:'Ingen paperbeholdning i dette fondet ennå.'}catch{};$('paperFundForm').onsubmit=async e=>{e.preventDefault();const amt=Number(amount.value),fee=Number($('paperFee').value||0);$('paperStatus').textContent='Registrerer…';try{const d=await request('/paper/instrument-order',{method:'POST',body:JSON.stringify({symbol,side:$('paperSide').value,amount:amt,price:p,fee,currency:c,instrument_name:instrument.name||symbol})});$('paperStatus').textContent=`Paperordre registrert: ${num(d.order_amount,2)} ${c} · ca. ${num(d.estimated_units,6)} andeler.`}catch(err){$('paperStatus').textContent='Kunne ikke registrere: '+err.message}};return}
const p=Number(instrument.price),c=instrument.currency||'';$('content').innerHTML=`<section class="card"><h2>Paper Trade · ${esc(instrument.name||symbol)}</h2><div class="notice">For aksjer og ETF-er registreres antall enheter. Dette er simulering, ikke en ekte ordre.</div><form id="paperUnitForm" class="form"><label>Side<select id="paperSide"><option value="buy">Kjøp</option><option value="sell">Selg</option></select></label><label>Antall<input id="paperUnits" type="number" min="0.000001" step="any" required></label><label>Pris<input id="paperPrice" type="number" step="any" value="${Number.isFinite(p)?p:''}" required></label><label>Gebyr<input id="paperFee" type="number" min="0" step="any" value="0"></label><button class="btn" type="submit">Registrer paper trade</button></form><div id="paperStatus" class="muted sectionGap"></div></section>`;$('paperUnitForm').onsubmit=async e=>{e.preventDefault();const units=Number($('paperUnits').value),price=Number($('paperPrice').value),fee=Number($('paperFee').value||0),amount=units*price;$('paperStatus').textContent='Registrerer…';try{const d=await request('/paper/instrument-order',{method:'POST',body:JSON.stringify({symbol,side:$('paperSide').value,amount,price,fee,currency:c,instrument_name:instrument.name||symbol})});$('paperStatus').textContent=`Paper trade registrert: ${num(d.estimated_units,6)} enheter.`}catch(err){$('paperStatus').textContent='Kunne ikke registrere: '+err.message}}}
function renderBacktest(){const now=new Date(),start=new Date(now);start.setFullYear(now.getFullYear()-5);$('content').innerHTML=`<section class="card"><h2>Backtest · ${esc(instrument.name||symbol)}</h2><div class="notice">Historisk månedlig investeringssimulering beregnes direkte fra instrumentets faktiske pris/NAV-historikk. Historisk avkastning er ikke en prognose.</div><form id="btForm" class="form"><label>Startkapital<input id="btInitial" type="number" min="1" value="10000"></label><label>Månedlig beløp<input id="btMonthly" type="number" min="0" value="1000"></label><label>Fra<input id="btStart" type="date" value="${start.toISOString().slice(0,10)}"></label><label>Til<input id="btEnd" type="date" value="${now.toISOString().slice(0,10)}"></label><button class="btn" type="submit">Kjør backtest</button></form><div id="btResult" class="sectionGap"></div></section>`;$('btForm').onsubmit=runBacktest}
async function runBacktest(e){e.preventDefault();const host=$('btResult');host.innerHTML='<div class="notice">Beregner…</div>';try{const d=historyCache.max||await request('/instrument/'+encodeURIComponent(symbol)+'/history?period=max');historyCache.max=d;const from=$('btStart').value,to=$('btEnd').value,rows=(d.items||[]).filter(x=>x.date.slice(0,10)>=from&&x.date.slice(0,10)<=to);if(rows.length<2)throw Error('Ikke nok historikk i perioden');let cash=+$('btInitial').value,monthly=+$('btMonthly').value,units=0,invested=cash,lastMonth='';for(const r of rows){const month=r.date.slice(0,7);if(month!==lastMonth){if(lastMonth){cash+=monthly;invested+=monthly}if(r.close>0){units+=cash/r.close;cash=0}lastMonth=month}}const final=units*rows[rows.length-1].close+cash,gain=final-invested,ret=invested?gain/invested*100:0;host.innerHTML=`<div class="metrics"><div class="metric"><span class="muted">Investert</span><b>${money(invested)}</b></div><div class="metric"><span class="muted">Sluttverdi</span><b>${money(final)}</b></div><div class="metric"><span class="muted">Resultat</span><b class="${gain>=0?'positive':'negative'}">${money(gain)}</b></div><div class="metric"><span class="muted">Avkastning</span><b class="${ret>=0?'positive':'negative'}">${pct(ret)}</b></div><div class="metric"><span class="muted">Enheter</span><b>${num(units,6)}</b></div></div>`}catch(err){host.innerHTML='<div class="notice">Backtest feilet: '+esc(err.message)+'</div>'}}
async function load(){if(!symbol){$('status').textContent='Mangler instrument-symbol.';return}try{instrument=await request('/instrument/'+encodeURIComponent(symbol)+'?name='+encodeURIComponent(hintName)+'&quote_type='+encodeURIComponent(hintType)+'&exchange='+encodeURIComponent(hintExchange)+'&currency='+encodeURIComponent(hintCurrency));$('name').textContent=instrument.name||symbol;$('type').textContent=instrument.asset_class||instrument.quote_type||'Instrument';$('ticker').textContent=[instrument.symbol,instrument.exchange,instrument.currency].filter(Boolean).join(' · ');$('price').textContent=money(instrument.price);[analytics,newsData,distData]=await Promise.all([request('/instrument/'+encodeURIComponent(symbol)+'/analytics').catch(()=>({})),request('/instrument/'+encodeURIComponent(symbol)+'/news?name='+encodeURIComponent(instrument.name||hintName)+'&limit=20').catch(()=>({items:[]})),request('/instrument/'+encodeURIComponent(symbol)+'/distributions?years=10').catch(()=>({items:[],event_count:0}))]);setHero();await render('overview')}catch(e){$('name').textContent=hintName||symbol;$('ticker').textContent=symbol;$('status').innerHTML='<b>Kunne ikke laste instrumentdata.</b> '+esc(e.message)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));load();
</script></body></html>
