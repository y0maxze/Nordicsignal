<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NordicSignal · Instrument Intelligence</title>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1500px;margin:auto;padding:30px}.home{display:inline-flex;margin-bottom:22px;text-decoration:none;font-weight:850;font-size:18px}.home span{color:#18c984}.top,.toolbar{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.eyebrow,.muted{color:#999;font-size:12px}.titleline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.type{border:1px solid #343434;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;color:#ddd;background:#151515}.price{font-size:40px;font-weight:850;text-align:right}.card{background:#0e0e0e;border:1px solid #292929;border-radius:12px;padding:18px}.hero{margin-top:20px}.metrics,.analyticsGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}.metric,.analyticsBox{background:#101010;border:1px solid #252525;border-radius:10px;padding:13px}.metric b,.analyticsBox b{font-size:18px;display:block;margin-top:5px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 12px}.tab,.btn{border:1px solid #303030;background:#151515;color:#f4f4f4;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:650}.tab.active,.btn.active{background:#f3f3f3;color:#090909}.notice{padding:12px;border:1px solid #292929;border-radius:10px;color:#aaa;background:#101010;margin-bottom:12px}.item{border-top:1px solid #252525;padding:14px 0}.item:first-child{border:0}.positive{color:#35d99b}.negative{color:#ff7586}.chart{height:330px;margin-top:14px;border:1px solid #202020;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent)}.chart svg{width:100%;height:100%;display:block}.chartbar{display:flex;gap:6px;flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid #252525;white-space:nowrap}th{font-size:11px;color:#999}.pill{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid #333;font-size:10px;font-weight:800}.sourceLink{display:inline-block;margin-top:7px}.sectionGap{margin-top:14px}@media(max-width:900px){.metrics,.analyticsGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.wrap{padding:16px}.metrics,.analyticsGrid{grid-template-columns:1fr}.price{text-align:left;font-size:30px}}
</style>
</head>
<body><main class="wrap">
<a class="home" href="/app">Nordic<span>Signal</span></a>
<div class="top"><div><div class="eyebrow">NORDICSIGNAL · INSTRUMENT INTELLIGENCE</div><div class="titleline"><h1 id="name">Laster…</h1><span id="type" class="type">—</span></div><div id="ticker" class="muted"></div></div><div><div id="price" class="price">—</div><div id="priceMeta" class="muted"></div></div></div>
<section class="card hero"><div id="status" class="notice">Laster markedsdata…</div><div class="metrics"><div class="metric"><span class="muted">1 måned</span><b id="m1">—</b></div><div class="metric"><span class="muted">3 måneder</span><b id="m2">—</b></div><div class="metric"><span class="muted">År hittil</span><b id="m3">—</b></div><div class="metric"><span class="muted">1 år</span><b id="m4">—</b></div><div class="metric"><span class="muted">Volatilitet</span><b id="m5">—</b></div></div></section>
<nav class="tabs"><button class="tab active" data-tab="overview">Oversikt</button><button class="tab" data-tab="news">Nyheter</button><button class="tab" data-tab="distributions">Utbytte / utdelinger</button><button class="tab" data-tab="analytics">Analyse</button></nav>
<section id="content"></section>
</main>
<script>
const API='/api',q=new URLSearchParams(location.search),symbol=(q.get('symbol')||q.get('ticker')||'').trim(),$=id=>document.getElementById(id),esc=v=>String(v==null?'':v).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),num=(v,d=2)=>v==null||!Number.isFinite(Number(v))?'—':Number(v).toLocaleString('no-NO',{maximumFractionDigits:d}),pct=v=>v==null||!Number.isFinite(Number(v))?'—':`${Number(v)>=0?'+':''}${num(v,2)}%`;let instrument={},analytics={},newsData={items:[]},distData={items:[]},historyCache={};
async function request(path){const r=await fetch(API+path,{cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||('HTTP '+r.status));return d}function tabs(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t))}function money(v){return v==null?'—':num(v,2)+' '+(instrument.currency||'')}function chartSvg(items){const pts=(items||[]).filter(x=>Number.isFinite(Number(x.close)));if(pts.length<2)return '<div class="notice">Ikke nok kurshistorikk.</div>';const vals=pts.map(x=>Number(x.close)),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1,path=pts.map((x,i)=>`${i?'L':'M'} ${25+(i/(pts.length-1))*950} ${285-((Number(x.close)-min)/span)*250}`).join(' ');return `<svg viewBox="0 0 1000 310" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="#35d99b" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>`}function newsHtml(items){return items?.length?items.map(x=>`<article class="item"><span class="pill">${esc(x.category||'Nyhet')}</span><h3>${esc(x.title)}</h3><div class="muted">${esc(x.publisher||'—')} · ${esc(x.published_at?new Date(x.published_at).toLocaleString('no-NO'):'—')}</div>${x.url?`<a class="sourceLink" href="${esc(x.url)}" target="_blank" rel="noopener">Åpne originalkilde</a>`:''}</article>`).join(''):'<div class="notice">Ingen relevante offentlige nyheter funnet akkurat nå.</div>'}
async function loadHistory(period='1y'){const box=$('historyChart');if(!box)return;box.innerHTML='<div class="notice">Laster kurshistorikk…</div>';try{const d=historyCache[period]||await request('/instrument/'+encodeURIComponent(symbol)+'/history?period='+encodeURIComponent(period));historyCache[period]=d;box.innerHTML=chartSvg(d.items||[])}catch{box.innerHTML='<div class="notice">Kurshistorikk utilgjengelig.</div>'}}function periodButtons(){return ['1m','3m','6m','1y','5y','10y','max'].map(p=>`<button class="btn ${p==='1y'?'active':''}" data-period="${p}">${p}</button>`).join('')}
function overview(){return `<section class="card"><div class="toolbar"><div><h2 style="margin:0">Kursutvikling</h2><div class="muted">${esc(instrument.name||symbol)} · ${esc(instrument.exchange||'')}</div></div><div class="chartbar">${periodButtons()}</div></div><div class="chart" id="historyChart"></div></section>`}function analyticsHtml(){const rows=[['1 måned',analytics.return_1m_pct],['3 måneder',analytics.return_3m_pct],['År hittil',analytics.return_ytd_pct],['1 år',analytics.return_1y_pct],['3 år annualisert',analytics.cagr_3y_pct],['5 år annualisert',analytics.cagr_5y_pct],['Volatilitet 1 år',analytics.volatility_1y_pct],['Maks fall 1 år',analytics.max_drawdown_1y_pct],['52 uker høy',analytics.high_52w],['52 uker lav',analytics.low_52w]];return `<section class="card"><h2>Historisk analyse</h2><div class="notice">Beregnet fra instrumentets pris/NAV-historikk. Beskrivende statistikk, ikke et kjøpssignal.</div><div class="analyticsGrid">${rows.map(([k,v],i)=>`<div class="analyticsBox"><span class="muted">${k}</span><b>${i>=8?money(v):v==null?'—':num(v,2)+'%'}</b></div>`).join('')}</div></section>`}function distributions(){const a=distData.items||[];return `<section class="card"><h2>Utbytte / utdelinger</h2>${a.length?`<div class="tablewrap"><table><thead><tr><th>Dato</th><th>Beløp</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.date||x.ex_date||'—')}</td><td>${money(x.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="notice">Ingen utdelinger funnet i tilgjengelig historikk.</div>'}</section>`}
function render(tab){tabs(tab);if(tab==='overview'){$('content').innerHTML=overview();document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-period]').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadHistory(b.dataset.period)});loadHistory()}else if(tab==='news')$('content').innerHTML=`<section class="card"><h2>Nyheter</h2>${newsHtml(newsData.items||[])}</section>`;else if(tab==='distributions')$('content').innerHTML=distributions();else if(tab==='analytics')$('content').innerHTML=analyticsHtml()}
async function load(){if(!symbol){$('status').textContent='Velg et instrument fra søk.';return}try{[instrument,analytics,newsData,distData]=await Promise.all([request('/instrument/'+encodeURIComponent(symbol)),request('/instrument/'+encodeURIComponent(symbol)+'/analytics').catch(()=>({})),request('/instrument/'+encodeURIComponent(symbol)+'/news').catch(()=>({items:[]})),request('/instrument/'+encodeURIComponent(symbol)+'/distributions').catch(()=>({items:[]}))]);$('name').textContent=instrument.name||symbol;$('type').textContent=instrument.asset_class||instrument.quote_type||'Instrument';$('ticker').textContent=[symbol,instrument.exchange].filter(Boolean).join(' · ');$('price').textContent=money(instrument.price);$('priceMeta').textContent=instrument.source||'Siste tilgjengelige markedsdata';$('status').innerHTML='Data: <b>'+esc(instrument.status||'LIVE / LATEST')+'</b> · '+esc(instrument.source||'markedsdata');[['m1',analytics.return_1m_pct],['m2',analytics.return_3m_pct],['m3',analytics.return_ytd_pct],['m4',analytics.return_1y_pct],['m5',analytics.volatility_1y_pct]].forEach(([id,v])=>$(id).textContent=v==null?'—':num(v,2)+'%');render('overview')}catch(e){$('status').textContent='Kunne ikke laste instrumentet: '+e.message}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));load();
</script></body></html>
