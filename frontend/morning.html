<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aksjer · Før børs</title>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box}body{margin:0}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0}.main{min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:30px 28px 110px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--m)}h1{font-size:34px;margin:4px 0 7px}.sub{font-size:12px;line-height:1.5}.grid{display:grid;grid-template-columns:1.35fr .9fr;gap:14px}.card{border:1px solid var(--line);padding:18px}.card h2{font-size:17px;margin:0 0 12px}.summary{display:grid;gap:8px}.summaryRow{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-weight:650}.riskRow,.eventRow,.newsRow,.marketRow{padding:12px 0;border-top:1px solid var(--line)}.riskRow:first-child,.eventRow:first-child,.newsRow:first-child,.marketRow:first-child{border-top:0}.clickableRow{cursor:pointer;border-radius:10px;transition:background .12s ease}.clickableRow:hover,.clickableRow:focus-visible{background:var(--surface-2);outline:none}.clickableRow:focus-visible{box-shadow:inset 0 0 0 1px var(--m)}.rowTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.ticker{font-weight:850}.muted{font-size:11px}.pill{font-size:9px;font-weight:850;border-radius:999px;padding:4px 7px}.pill.critical,.pill.high{color:var(--r)!important;border-color:color-mix(in srgb,var(--r) 35%,var(--line))!important;background:color-mix(in srgb,var(--r) 8%,var(--surface))!important}.pill.watch{color:var(--y)!important}.radarTag{display:inline-block;margin-right:6px;font-size:9px;font-weight:850;letter-spacing:.05em;color:var(--b)}.openCue{font-size:10px;color:var(--m);margin-top:6px}.markets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.marketRow{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--surface-2)}.marketChange{font-size:18px;font-weight:800;margin-top:4px}.positive{color:var(--g)!important}.negative{color:var(--r)!important}.sectionGap{margin-top:14px}.empty{padding:20px 0;color:var(--m)}.refresh{min-height:44px}.clickableRow{min-height:44px}.source{font-size:10px;color:var(--m)!important}.nsMobileNav{display:none}@media(max-width:900px){.wrap{padding:20px 14px calc(100px + env(safe-area-inset-bottom))}.grid{grid-template-columns:1fr}.nsMobileNav{display:grid}.top{align-items:center}h1{font-size:28px}.markets{grid-template-columns:1fr 1fr}}
.pill.normal{color:var(--m)!important;background:var(--surface-2)!important;border-color:var(--line)!important}.rowTop>div{min-width:0;overflow-wrap:anywhere}.pill{flex-shrink:0}.main{min-width:0}#meta{padding-bottom:24px}
.morningCompany{display:inline-flex;align-items:center;min-height:44px;color:var(--b);font:inherit;font-weight:850;text-align:left;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.morningCompany:focus-visible,.morningStockChoice:focus-visible{outline:2px solid var(--b);outline-offset:3px}.morningStockChoices{margin-top:10px;font-size:13px;color:var(--m)}.morningStockChoice{display:flex;align-items:center;min-height:44px;color:var(--b)}
</style>
<script src="/theme_mode.js"></script>
<link rel="stylesheet" href="/finance_shell.css">
</head>
<body>
<div class="app"><aside class="side"><div class="logo">AKSJER</div><nav></nav></aside><main class="main"><div class="wrap">
<div class="top"><div><div class="eyebrow">PRE-MARKET BRIEF</div><h1>Før børs</h1><div class="sub">Det viktigste før Oslo Børs åpner: rapporter, verifiserte hendelser, nattens meldinger og markedsbevegelser.</div></div><button class="btn refresh" id="refresh">Oppdater</button></div>
<section class="card"><h2>Det viktigste nå</h2><div id="summary" class="summary"><div class="empty">Laster morgenbrief…</div></div><div id="mustKnow"></div></section><div hidden><div id="news"></div><div id="markets"></div><div id="upcoming"></div></div><div class="muted sectionGap" id="meta"></div>
</div></main></div>
<nav id="nsMobileNav" class="nsMobileNav"></nav>
<script src="/ui_shell.js"></script>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const pct=v=>v==null?'—':(Number(v)>0?'+':'')+Number(v).toLocaleString('no-NO',{maximumFractionDigits:2})+'%';
const stockUrl=x=>x&&x.ticker?'/stock?ticker='+encodeURIComponent(String(x.ticker).toUpperCase()):'';
function when(x){const n=Number(x.days_until);return n===0?'I dag':n===1?'I morgen':Number.isFinite(n)?'om '+n+' dager':'—'}
function riskLabel(r,x={}){return r==='critical'?'HØY RISIKO':r==='high'?'HØY':r==='watch'?'FØLG MED':x.source_context==='market'?'OBSERVERT':x.source_context==='radar'?'PUBLISERT':'KOMMENDE'}
function rowAttrs(x){const url=stockUrl(x);return url?` role="link" tabindex="0" data-stock-url="${esc(url)}" aria-label="Åpne ${esc(x.ticker||x.company||'aksje')}"`:''}
function companyLink(x){const label=esc(x.company||x.ticker||x.publisher||'Marked'),url=stockUrl(x);if(url)return `<a class="morningCompany" href="${esc(url)}">${label}</a>`;if(x.company&&x.source_context!=='market')return `<button type="button" class="morningCompany" data-company-query="${esc(x.company)}" aria-label="Finn aksjen ${esc(x.company)}">${label}</button>`;return label}
function renderEvents(id,items){const root=$(id);if(!(items||[]).length){root.innerHTML='<div class="empty">Ingen relevante hendelser registrert.</div>';return}root.innerHTML=items.map(x=>{const radar=['radar','market'].includes(x.source_context);const detail=radar?`${esc(x.title||x.event_label)}${x.published_at?' · '+esc(new Date(x.published_at).toLocaleString('no-NO',{timeZone:'Europe/Oslo'})):''}`:`${esc(x.event_label||x.event_raw)} · ${esc(when(x))}`;const source=x.url?`<div class="muted" style="margin-top:5px"><span class="radarTag">KILDE</span><a class="source" data-source-link href="${esc(x.url)}" target="_blank" rel="noopener">Originalmelding ↗</a></div>`:'';return `<div class="eventRow clickableRow"${rowAttrs(x)}><div class="rowTop"><div><div class="ticker">${companyLink(x)}</div><div class="muted">${detail}</div>${x.source_context==='market'?'<div class="source">Kilde: Yahoo Finance · observert kurs, ikke verifisert sanntid</div>':''}${source}${x.ticker?'<div class="openCue">Trykk for å åpne aksjen →</div>':''}</div><span class="pill ${esc(x.risk||'normal')}">${esc(riskLabel(x.risk,x))}</span></div></div>`}).join('')}
function renderNews(items){const root=$('news');if(!(items||[]).length){root.innerHTML='<div class="empty">Ingen nye meldinger funnet siden forrige Oslo-close.</div>';return}root.innerHTML=items.map(x=>`<div class="newsRow clickableRow"${rowAttrs(x)}><div class="ticker">${companyLink(x)}</div><div style="margin-top:4px">${esc(x.title)}</div><div class="muted" style="margin-top:5px">${esc(x.publisher||'')} ${x.url?`· <a class="source" data-source-link href="${esc(x.url)}" target="_blank" rel="noopener">Kilde ↗</a>`:''}</div>${x.ticker?'<div class="openCue">Trykk for å åpne aksjen →</div>':''}</div>`).join('')}
function renderMarkets(items){const root=$('markets');root.innerHTML=(items||[]).map(x=>{const c=Number(x.change_pct);const cls=Number.isFinite(c)?c>0?'positive':c<0?'negative':'':'';return `<div class="marketRow"><div class="muted">${esc(x.label)}</div><div class="marketChange ${cls}">${esc(pct(x.change_pct))}</div><div class="muted">${x.status==='live'?'Oppdatert':'Utilgjengelig'}</div></div>`}).join('')||'<div class="empty">Markedsdata utilgjengelig.</div>'}
function briefPoints(d){const seen=new Set(),out=[];const add=x=>{const key=x.url||String(x.ticker||x.company||'')+'|'+String(x.title||x.event_label||x.event_raw||'');if(!seen.has(key)&&out.length<8){seen.add(key);out.push(x)}};for(const x of d.must_know||[])add({...x,url:x.url||x.source_url});for(const x of d.notable_markets||[])if(x.change_pct!=null)add({company:x.label,title:pct(x.change_pct)+' · siste observerte endring mot forrige sluttkurs',published_at:x.market_time,source_context:'market',risk:'normal'});return out}
async function load(force=false){$('summary').innerHTML='<div class="empty">Laster morgenbrief…</div>';$('mustKnow').innerHTML='';try{const r=await fetch('/api/morning-brief'+'',{cache:'no-store',signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json(),points=briefPoints(d);$('summary').textContent=points.length?'Maks åtte prioriterte punkter · kilder og tidspunkt nedenfor':d.status==='partial'?'Noen kilder er utilgjengelige. Fravær av punkter bekrefter ikke et hendelsesfritt marked.':'Ingen verifiserte høyverdipunkter i tilgjengelige kilder.';renderEvents('mustKnow',points);$('meta').textContent='Sist generert '+(d.generated_at?new Date(d.generated_at).toLocaleString('no-NO',{timeZone:'Europe/Oslo'}):'ukjent')+' · Europe/Oslo · '+(d.status==='partial'?'Delvis datadekning. ':'')+'Forrige verifiserte Oslo-slutt: '+(d.previous_oslo_close?new Date(d.previous_oslo_close).toLocaleString('nb-NO',{timeZone:'Europe/Oslo'}):'ukjent')+' · Informasjon til analyse. Påvirker ikke score eller signalregler.'}catch(e){$('summary').textContent='Før børs er midlertidig utilgjengelig. Prøv igjen senere.';$('mustKnow').innerHTML='';$('meta').textContent='Datastatus: UTILGJENGELIG'}}

$('refresh').onclick=()=>load(true);load();
</script>
<script src="/morning_navigation.js"></script>
<script src="/finance_shell.js"></script></body></html>
